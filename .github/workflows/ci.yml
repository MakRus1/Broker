name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
defaults:
  run:
    shell: bash
jobs:
  tools:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Определение затронутых сервисов
        id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci-tests.py plan --base "${BASE:-missing-base}"
      - name: Тесты генератора и инструментов
        run: python -m unittest discover -s tests -v
      - name: Синтаксис команды подключения Windows
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              "$PWD/scripts/staging-connect.ps1", [ref]$tokens, [ref]$errors
          )
          if ($errors.Count) { throw ($errors | Out-String) }
          & ./tests/staging-connect.Tests.ps1
      - name: Актуальность генерации и форматирование
        run: make check-gen-all check-format
      - run: python scripts/container-images.py check
      - run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
  frontend:
    strategy:
      matrix:
        app: [admin, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend/${{ matrix.app }}
      - name: Форматирование фронтенда
        run: pnpm check-format
        working-directory: frontend/${{ matrix.app }}
      - name: Тесты фронтенда
        run: pnpm test
        working-directory: frontend/${{ matrix.app }}
      - name: Сборка фронтенда
        run: pnpm build
        working-directory: frontend/${{ matrix.app }}

  build:
    name: Сборка и тесты · ${{ matrix.preset }} · ${{ matrix.runner }}
    needs: tools
    if: needs.tools.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: debug
          - runner: ubuntu-24.04
            preset: release
          - runner: ubuntu-24.04
            preset: sanitize
          - runner: ubuntu-24.04-arm
            preset: debug
    runs-on: ${{ matrix.runner }}
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Выбор закрепленного окружения
        id: image
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          variant=dev
          if [[ "$PRESET" == sanitize ]]; then variant=sanitize; fi
          echo "ref=$(python3 scripts/container-images.py ref --variant "$variant")" >> "$GITHUB_OUTPUT"
      - name: Вход в GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Загрузка готового окружения
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker pull "$IMAGE"
      - name: Проверка инструментированного framework
        if: matrix.preset == 'sanitize'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker run --rm "$IMAGE" bash -euc '
            archive=$(find "$BROKER_USERVER_PREFIX" -name libuserver-cored.a -print -quit)
            test -n "$archive"
            nm --undefined-only "$archive" > /tmp/userver-symbols.txt
            grep -q __asan_ /tmp/userver-symbols.txt
            grep -q __ubsan_ /tmp/userver-symbols.txt
          '
      - name: Права рабочего каталога для контейнера
        run: sudo chown -R 1001:1001 "$GITHUB_WORKSPACE"
      - name: Чистая сборка
        id: compile
        env:
          PRESET: ${{ matrix.preset }}
          DOCKER_IMAGE: ${{ steps.image.outputs.ref }}
        run: make "docker-ci-build-$PRESET"
      - name: Тесты затронутых сервисов
        id: tests
        env:
          CI_SERVICES: ${{ needs.tools.outputs.services }}
          CI_RESULTS_DIR: ci-results/${{ matrix.preset }}-${{ runner.arch }}
          PRESET: ${{ matrix.preset }}
          DOCKER_IMAGE: ${{ steps.image.outputs.ref }}
        run: make "docker-ci-test-$PRESET"
      - name: Межсервисный сценарий · две реплики
        if: ${{ matrix.preset == 'debug' }}
        env:
          DOCKER_IMAGE: ${{ steps.image.outputs.ref }}
        run: make docker-ci-smoke-debug
      - name: Результаты тестов по сервисам
        if: always()
        env:
          SERVICES: ${{ needs.tools.outputs.services }}
          PRESET: ${{ matrix.preset }}
          ARCH: ${{ runner.arch }}
          BUILD_RESULT: ${{ steps.compile.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          python3 scripts/ci-tests.py summary --services $SERVICES \
            --output-dir "ci-results/$PRESET-$ARCH" --preset "$PRESET" --arch "$ARCH" \
            --build-result "$BUILD_RESULT" --test-result "$TEST_RESULT"
      - name: Сохранить логи и JUnit
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.preset }}-${{ runner.arch }}
          path: ci-results/${{ matrix.preset }}-${{ runner.arch }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Четыре варианта создания сервиса
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && matrix.preset == 'debug' && runner.arch == 'X64' }}
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker run --rm --network=host -v "$PWD:/workspaces/broker" "$IMAGE" python3 scripts/smoke-services.py --build
      - name: Исходники не изменились
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"

  result:
    name: CI result
    if: ${{ always() }}
    needs: [tools, build, frontend]
    runs-on: ubuntu-24.04
    steps:
      - name: Проверка обязательных результатов
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          TOOLS_RESULT: ${{ needs.tools.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SERVICES: ${{ needs.tools.outputs.services }}
        run: |
          set -euo pipefail
          {
            echo '### Итог CI'
            echo
            echo "Затронутые сервисы: ${SERVICES:-нет}."
            echo
            echo '| Проверка | Результат |'
            echo '| --- | --- |'
            echo "| Инструменты | $TOOLS_RESULT |"
            echo "| Сборка и тесты сервисов | $BUILD_RESULT |"
            echo "| Фронтенд | $FRONTEND_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FRONTEND_RESULT" != success ]]; then exit 1; fi
          if [[ "$TOOLS_RESULT" != success ]]; then
            exit 1
          fi
          if [[ -n "$SERVICES" ]]; then
            if [[ "$BUILD_RESULT" != success ]]; then exit 1; fi
          else
            if [[ "$BUILD_RESULT" != skipped ]]; then exit 1; fi
          fi
