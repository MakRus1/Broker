name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
defaults:
  run:
    shell: bash
jobs:
  tools:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: make check-gen-all check-format
      - run: python scripts/container-images.py check
      - name: Определение затронутых сервисов
        id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          affected=$(./scripts/affected-services.sh "${BASE:-missing-base}")
          if [[ "$affected" == all ]]; then
            affected=$(find services -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | xargs)
          fi
          echo "services=$affected" >> "$GITHUB_OUTPUT"
      - run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
  build:
    needs: tools
    if: needs.tools.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: debug
          - runner: ubuntu-24.04
            preset: release
          - runner: ubuntu-24.04
            preset: sanitize
          - runner: ubuntu-24.04-arm
            preset: debug
    runs-on: ${{ matrix.runner }}
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Выбор закрепленного окружения
        id: image
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          variant=dev
          if [[ "$PRESET" == sanitize ]]; then variant=sanitize; fi
          echo "ref=$(python3 scripts/container-images.py ref --variant "$variant")" >> "$GITHUB_OUTPUT"
      - name: Вход в GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Загрузка готового окружения
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker pull "$IMAGE"
      - name: Проверка инструментированного framework
        if: matrix.preset == 'sanitize'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker run --rm "$IMAGE" bash -euc '
            archive=$(find "$BROKER_USERVER_PREFIX" -name libuserver-cored.a -print -quit)
            test -n "$archive"
            nm --undefined-only "$archive" > /tmp/userver-symbols.txt
            grep -q __asan_ /tmp/userver-symbols.txt
            grep -q __ubsan_ /tmp/userver-symbols.txt
          '
      - name: Права рабочего каталога для контейнера
        run: sudo chown -R 1001:1001 "$GITHUB_WORKSPACE"
      - name: Чистая сборка и проверки
        env:
          SERVICES: ${{ needs.tools.outputs.services }}
          PRESET: ${{ matrix.preset }}
          DOCKER_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            make "docker-test-$PRESET" SERVICE="$svc"
          done
      - name: Четыре варианта создания сервиса
        if: matrix.preset == 'debug' && runner.arch == 'X64'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker run --rm --network=host -v "$PWD:/workspaces/broker" "$IMAGE" python3 scripts/smoke-services.py --build
      - name: Исходники не изменились
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"

  result:
    name: CI result
    if: ${{ always() }}
    needs: [tools, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Проверка обязательных результатов
        env:
          TOOLS_RESULT: ${{ needs.tools.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SERVICES: ${{ needs.tools.outputs.services }}
        run: |
          set -euo pipefail
          if [[ "$TOOLS_RESULT" != success ]]; then
            exit 1
          fi
          if [[ -n "$SERVICES" ]]; then
            if [[ "$BUILD_RESULT" != success ]]; then exit 1; fi
          else
            if [[ "$BUILD_RESULT" != skipped ]]; then exit 1; fi
          fi
