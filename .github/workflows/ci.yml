name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
defaults:
  run:
    shell: bash
jobs:
  tools:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: make check-gen-all check-format
      - name: Определение затронутых сервисов
        id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          affected=$(./scripts/affected-services.sh "${BASE:-missing-base}")
          if [[ "$affected" == all ]]; then
            affected=$(find services -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | xargs)
          fi
          echo "services=$affected" >> "$GITHUB_OUTPUT"
      - run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
  build:
    needs: tools
    if: needs.tools.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: debug
          - runner: ubuntu-24.04
            preset: release
          - runner: ubuntu-24.04
            preset: sanitize
          - runner: ubuntu-24.04-arm
            preset: debug
    runs-on: ${{ matrix.runner }}
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Сборка общего окружения
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: tools/Dockerfile
          load: true
          tags: broker-dev:userver-3.2
          cache-from: type=gha,scope=dev-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=dev-${{ runner.arch }}
      - name: Права рабочего каталога для контейнера
        run: sudo chown -R 1001:1001 "$GITHUB_WORKSPACE"
      - name: Чистая сборка и проверки
        env:
          SERVICES: ${{ needs.tools.outputs.services }}
          PRESET: ${{ matrix.preset }}
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            make "docker-test-$PRESET" SERVICE="$svc"
          done
      - name: Четыре варианта создания сервиса
        if: matrix.preset == 'debug' && runner.arch == 'X64'
        run: docker run --rm --network=host -v "$PWD:/workspaces/broker" broker-dev:userver-3.2 python3 scripts/smoke-services.py --build
      - name: Исходники не изменились
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"

  result:
    name: CI result
    if: ${{ always() }}
    needs: [tools, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Проверка обязательных результатов
        env:
          TOOLS_RESULT: ${{ needs.tools.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SERVICES: ${{ needs.tools.outputs.services }}
        run: |
          set -euo pipefail
          [[ "$TOOLS_RESULT" == success ]]
          if [[ -n "$SERVICES" ]]; then
            [[ "$BUILD_RESULT" == success ]]
          else
            [[ "$BUILD_RESULT" == skipped ]]
          fi
