name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
defaults:
  run:
    shell: bash
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.detect.outputs.services }}
      build_services: ${{ steps.detect.outputs.build_services }}
      frontends: ${{ steps.detect.outputs.frontends }}
      scaffolds: ${{ steps.detect.outputs.scaffolds }}
      smoke: ${{ steps.detect.outputs.smoke }}
      shared_contracts: ${{ steps.detect.outputs.shared_contracts }}
      build_required: ${{ steps.detect.outputs.build_required }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install "$(sed -n '/^PyYAML==/p' requirements.txt)"
      - name: Определение затронутых сервисов
        id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci-tests.py plan --base "${BASE:-missing-base}"

  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Проверка закреплённого окружения
        run: python scripts/container-images.py check
      - run: python -m pip install -r requirements.txt
      - name: Тесты затронутых инструментов
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci-tools.py --base "${BASE:-missing-base}" ${{ github.event_name == 'workflow_dispatch' && '--full' || '' }}
      - name: Синтаксис команды подключения Windows
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              "$PWD/scripts/staging-connect.ps1", [ref]$tokens, [ref]$errors
          )
          if ($errors.Count) { throw ($errors | Out-String) }
          & ./tests/staging-connect.Tests.ps1
      - name: Актуальность генерации и форматирование
        run: make check-gen-all check-format
      - name: YAML без якорей и ссылок
        run: python scripts/check-yaml.py
      - run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
  frontend:
    needs: plan
    if: needs.plan.outputs.frontends != '[]'
    strategy:
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.frontends) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend/${{ matrix.app }}
      - name: Форматирование фронтенда
        run: pnpm check-format
        working-directory: frontend/${{ matrix.app }}
      - name: Тесты фронтенда
        run: pnpm test
        working-directory: frontend/${{ matrix.app }}
      - name: Сборка фронтенда
        run: pnpm build
        working-directory: frontend/${{ matrix.app }}

  build:
    name: Сборка и тесты · ${{ matrix.preset }} · ${{ matrix.runner }}
    needs: plan
    if: needs.plan.outputs.build_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: debug
          - runner: ubuntu-24.04
            preset: release
          - runner: ubuntu-24.04
            preset: sanitize
          - runner: ubuntu-24.04-arm
            preset: debug
    runs-on: ${{ matrix.runner }}
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      CI_SHARED_CONTRACTS: ${{ needs.plan.outputs.shared_contracts }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Выбор закрепленного окружения
        id: image
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          variant=dev
          if [[ "$PRESET" == sanitize ]]; then variant=sanitize; fi
          image_ref=$(python3 scripts/container-images.py ref --variant "$variant")
          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"
      - name: Вход в GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Загрузка готового окружения
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker pull "$IMAGE"
      - name: Проверка инструментированного framework
        if: matrix.preset == 'sanitize'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker run --rm "$IMAGE" bash -euc '
            archive=$(find "$BROKER_USERVER_PREFIX" -name libuserver-cored.a -print -quit)
            test -n "$archive"
            nm --undefined-only "$archive" > /tmp/userver-symbols.txt
            grep -q __asan_ /tmp/userver-symbols.txt
            grep -q __ubsan_ /tmp/userver-symbols.txt
          '
      - name: Кеш компиляции
        id: compile-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('tools/container-images.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('tools/container-images.json') }}-
      - name: Права рабочего каталога для контейнера
        run: |
          mkdir -p .ccache
          sudo chown -R 1001:1001 "$GITHUB_WORKSPACE"
      - name: Сборка выбранных сервисов
        id: compile
        env:
          PRESET: ${{ matrix.preset }}
          DOCKER_IMAGE: ${{ steps.image.outputs.ref }}
          CI_BUILD_SERVICES: ${{ needs.plan.outputs.build_services }}
        run: |
          docker run --rm -v "$PWD/.ccache:/ccache" -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=512M "$DOCKER_IMAGE" ccache --zero-stats
          make "docker-ci-build-$PRESET"
      - name: Статистика кеша компиляции
        if: ${{ always() && steps.image.outcome == 'success' }}
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          mkdir -p .ccache
          docker run --rm -v "$PWD/.ccache:/ccache" -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=512M "$IMAGE" ccache --show-stats
      - name: Сохранить кеш успешной сборки
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.compile-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .ccache
          key: ${{ steps.compile-cache.outputs.cache-primary-key }}
      - name: Тесты затронутых сервисов
        id: tests
        env:
          CI_SERVICES: ${{ needs.plan.outputs.services }}
          CI_RESULTS_DIR: ci-results/${{ matrix.preset }}-${{ runner.arch }}
          PRESET: ${{ matrix.preset }}
          DOCKER_IMAGE: ${{ steps.image.outputs.ref }}
        run: make "docker-ci-test-$PRESET"
      - name: Межсервисный сценарий · две реплики
        if: ${{ matrix.preset == 'debug' && needs.plan.outputs.smoke == 'true' }}
        env:
          DOCKER_IMAGE: ${{ steps.image.outputs.ref }}
        run: make docker-ci-smoke-debug
      - name: Результаты тестов по сервисам
        if: always()
        env:
          SERVICES: ${{ needs.plan.outputs.services }}
          PRESET: ${{ matrix.preset }}
          ARCH: ${{ runner.arch }}
          BUILD_RESULT: ${{ steps.compile.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          python3 scripts/ci-tests.py summary --services $SERVICES \
            --output-dir "ci-results/$PRESET-$ARCH" --preset "$PRESET" --arch "$ARCH" \
            --build-result "$BUILD_RESULT" --test-result "$TEST_RESULT"
      - name: Сохранить логи и JUnit
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.preset }}-${{ runner.arch }}
          path: ci-results/${{ matrix.preset }}-${{ runner.arch }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Четыре варианта создания сервиса
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && needs.plan.outputs.scaffolds == 'true' && matrix.preset == 'debug' && runner.arch == 'X64' }}
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker run --rm --network=host -v "$PWD:/workspaces/broker" "$IMAGE" python3 scripts/smoke-services.py --build
      - name: Исходники не изменились
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"

  result:
    name: CI result
    if: ${{ always() }}
    needs: [plan, tools, build, frontend]
    runs-on: ubuntu-24.04
    steps:
      - name: Проверка обязательных результатов
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTENDS: ${{ needs.plan.outputs.frontends }}
          TOOLS_RESULT: ${{ needs.tools.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SERVICES: ${{ needs.plan.outputs.services }}
          BUILD_REQUIRED: ${{ needs.plan.outputs.build_required }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          set -euo pipefail
          {
            echo '### Итог CI'
            echo
            echo "Затронутые сервисы: ${SERVICES:-нет}."
            echo
            echo '| Проверка | Результат |'
            echo '| --- | --- |'
            echo "| Инструменты | $TOOLS_RESULT |"
            echo "| Сборка и тесты сервисов | $BUILD_RESULT |"
            echo "| Фронтенд | $FRONTEND_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FRONTENDS" == '[]' ]]; then
            if [[ "$FRONTEND_RESULT" != skipped ]]; then exit 1; fi
          else
            if [[ "$FRONTEND_RESULT" != success ]]; then exit 1; fi
          fi
          if [[ "$PLAN_RESULT" != success ]]; then exit 1; fi
          if [[ "$TOOLS_RESULT" != success ]]; then
            exit 1
          fi
          if [[ "$BUILD_REQUIRED" == true ]]; then
            if [[ "$BUILD_RESULT" != success ]]; then exit 1; fi
          else
            if [[ "$BUILD_RESULT" != skipped ]]; then exit 1; fi
          fi
