name: Local environment
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/local-environment.yml
      - CMakeLists.txt
      - cmake/**
      - libs/**
      - schemas/**
      - scripts/**
      - services/**
      - tests/fixtures/contract_service/**
      - tools/**
      - requirements.txt
      - Makefile
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: local-environment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make local-up
      - run: make local-check
      - name: Диагностика сбоя
        if: failure()
        run: make local-status local-logs
      - name: Остановка стенда
        if: always()
        run: make local-down
