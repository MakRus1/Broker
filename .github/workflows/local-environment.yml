name: Local environment
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: local-environment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Сборка и запуск стенда с прогрессом
        run: python scripts/ci-local.py
      - run: make local-check
      - name: Диагностика сбоя
        if: failure()
        run: make local-status local-logs
      - name: Остановка стенда
        if: always()
        run: make local-down
