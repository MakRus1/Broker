name: Service images
on:
  pull_request:
    branches: [main]
    # Полная проверка runtime нужна при изменении упаковки, а не бизнес-кода.
    # Манифесты и deploy-скрипты проверяет быстрый tools job основного CI.
    paths:
      - .github/workflows/services.yml
      - tools/deploy/**
      - .dockerignore
      - tools/container-images.json
      - tools/local/images.json
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Собрать все образы заново, без наследования предыдущего релиза
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: service-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  images:
    runs-on: ubuntu-24.04
    # Холодная полная Release-сборка занимает до часа; оставляем время на публикацию
    # всех образов и проверку манифестов. Повторные сборки используют отдельный ccache.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Публикация разрешена только из main вручную
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Вход в GHCR
        if: github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Окружение Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Доступ Buildx к кэшу GitHub Actions
        uses: actions/github-script@v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing ${name}`);
              if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Кэш компиляции релизных образов
        id: compiler-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .release-ccache
          key: release-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/container-images.json') }}-${{ github.sha }}
          restore-keys: |
            release-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/container-images.json') }}-
      - name: Восстановить ccache в BuildKit
        timeout-minutes: 5
        continue-on-error: true
        run: python tools/deploy/compiler_cache.py restore
      - name: Найти предыдущий опубликованный релиз
        id: base
        if: github.event_name == 'workflow_dispatch' && !inputs.full_rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/deploy/release_base.py --revision "$GITHUB_SHA" --output .staging/base-release.json
      - name: Собрать сервисные образы
        id: images
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          BASE_RELEASE: ${{ steps.base.outputs.path }}
        run: |
          args=(--revision "$GITHUB_SHA")
          if [[ "$PUBLISH" == true ]]; then args+=(--push); fi
          if [[ -n "$BASE_RELEASE" ]]; then args+=(--base-release "$BASE_RELEASE"); fi
          python tools/deploy/build.py "${args[@]}"
      - name: Выгрузить ccache из BuildKit
        id: compiler-snapshot
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        timeout-minutes: 5
        continue-on-error: true
        run: python tools/deploy/compiler_cache.py export
      - name: Сохранить кэш компиляции
        if: ${{ !cancelled() && steps.compiler-snapshot.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: .release-ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Освободить ресурсы сборщика перед запуском K3s
        run: docker buildx stop
      - name: Проверить запуск runtime без компилятора
        if: github.event_name == 'pull_request'
        run: |
          for service in $(python scripts/service_catalog.py --plain); do
            docker run --rm --entrypoint /app/service "ghcr.io/makrus1/broker-${service//_/-}:$GITHUB_SHA" --help
          done
      - name: Проверить подготовку манифестов
        run: python scripts/staging.py render --release .staging/release.json
      - name: Серверная проверка манифестов на K3s
        run: python tools/deploy/check.py ${{ github.event_name == 'pull_request' && '--runtime' || '' }}
      - name: Опубликовать описание релиза без секретов
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: staging-release-${{ github.sha }}
          path: .staging/release.json
          if-no-files-found: error
          include-hidden-files: true
