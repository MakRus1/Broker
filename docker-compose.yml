services:
  postgres-broker:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: testsuite
      POSTGRES_PASSWORD: testsuite
      POSTGRES_DB: broker_db_1
    ports:
    - 127.0.0.1:15433:5432
    volumes:
    - ./services/broker/postgresql/schemas/db_1:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U testsuite -d broker_db_1
      interval: 2s
      timeout: 5s
      retries: 10
  postgres-configs:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: testsuite
      POSTGRES_PASSWORD: testsuite
      POSTGRES_DB: configs_db_1
    ports:
    - 127.0.0.1:15434:5432
    volumes:
    - ./services/configs/postgresql/schemas/db_1:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U testsuite -d configs_db_1
      interval: 2s
      timeout: 5s
      retries: 10
