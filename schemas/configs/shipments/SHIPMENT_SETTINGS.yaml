name: SHIPMENT_SETTINGS
mode: conditional
context: shipments/SHIPMENT_ORGANIZATION_CONTEXT
schema:
  type: object
  additionalProperties: false
  properties:
    number_template:
      type: string
      maxLength: 128
    reset_number_yearly:
      type: boolean
    statuses:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: string
        maxLength: 100
    route_types:
      type: array
      maxItems: 30
      items:
        type: string
        maxLength: 64
    planned_containers:
      type: boolean
    container_types:
      type: array
      maxItems: 100
      items:
        type: string
        maxLength: 16
  required:
  - number_template
  - reset_number_yearly
  - statuses
  - route_types
  - planned_containers
  - container_types
default:
  number_template: S-{sequence}
  reset_number_yearly: false
  statuses:
  - Новая
  route_types:
  - sea
  - international_rail
  - international_road
  - rail
  - road
  - pickup
  - air
  planned_containers: true
  container_types:
  - 20DC
  - 40DC
  - 40HC
