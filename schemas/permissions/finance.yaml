finance.read_financial_labels:
  name: Просмотр финансовых меток
  group: Финансовые метки
  scope: organization
  requires: []
finance.write_financial_labels:
  name: Изменение финансовых меток
  group: Финансовые метки
  scope: organization
  requires:
  - finance.read_financial_labels
finance.read_entries:
  name: Просмотр начислений
  group: Финансы
  scope: organization
  requires:
  - shipments.read
  - transportations.read
finance.write_entries:
  name: Изменение начислений
  group: Финансы
  scope: organization
  requires:
  - finance.read_entries
  - finance.read_financial_labels
  - contracts.read
  - counterparties.read
