openapi: 3.0.3
info:
  title: Текущая сессия
  version: '1'
paths:
  /api/session:
    get:
      summary: Текущая сессия
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - actor
                - subject
                - display_name
                - csrf_token
                - permissions
                properties:
                  actor:
                    type: string
                  subject:
                    type: string
                  display_name:
                    type: string
                  csrf_token:
                    type: string
                  permissions:
                    type: array
                    items:
                      type: string
        '400':
          description: Запрос отклонён
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '401':
          description: Запрос отклонён
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '403':
          description: Запрос отклонён
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '503':
          description: Запрос отклонён
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: broker_admin
      description: Сессионная cookie BFF. При HTTPS имя cookie имеет префикс __Host-.
security:
- BrowserSession: []
