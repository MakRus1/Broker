FinanceSettings:
  type: object
  additionalProperties: false
  properties:
    reporting_currency:
      type: string
      pattern: ^[A-Z]{3}$
    revision:
      type: integer
      format: int64
    outgoing_number_template:
      type: string
      minLength: 1
      maxLength: 100
    incoming_number_template:
      type: string
      minLength: 1
      maxLength: 100
    reset_numbers_yearly:
      type: boolean
  required:
  - reporting_currency
  - revision
  - outgoing_number_template
  - incoming_number_template
  - reset_numbers_yearly
FinancialLabelError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
