FinanceSettings:
  type: object
  additionalProperties: false
  properties:
    reporting_currency:
      type: string
      pattern: ^[A-Z]{3}$
    revision:
      type: integer
      format: int64
  required:
  - reporting_currency
  - revision
FinancialLabelError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
