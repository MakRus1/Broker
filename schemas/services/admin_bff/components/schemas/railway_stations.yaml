RailwayStation:
  type: object
  additionalProperties: false
  properties:
    esr_code:
      type: string
      pattern: ^[0-9]{6}$
    name:
      type: string
      minLength: 1
      maxLength: 256
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
  required:
  - esr_code
  - name
  - country_code
ApiError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
StationListCursor:
  type: object
  additionalProperties: false
  required:
  - id
  - value
  - scope
  properties:
    id:
      type: string
      pattern: ^[0-9]{6}$
    value:
      type: string
      maxLength: 1024
    scope:
      type: string
      pattern: ^[a-f0-9]{64}$
ListStationsRequest:
  type: object
  additionalProperties: false
  properties:
    query:
      type: string
      maxLength: 200
    after:
      type: string
      maxLength: 6
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
    sort:
      type: string
      enum:
      - esr_code
      - name
      - country_code
      default: esr_code
    descending:
      type: boolean
      default: false
    cursor:
      $ref: '#/StationListCursor'
  required: []
