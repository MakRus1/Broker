ShipmentBusinessRules:
  type: object
  additionalProperties: false
  properties:
    number_template:
      type: string
      maxLength: 128
    reset_number_yearly:
      type: boolean
    statuses:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: string
        maxLength: 100
    route_types:
      type: array
      maxItems: 30
      items:
        type: string
        maxLength: 64
    planned_containers:
      type: boolean
    container_types:
      type: array
      maxItems: 100
      items:
        type: string
        maxLength: 16
  required:
  - number_template
  - reset_number_yearly
  - statuses
  - route_types
  - planned_containers
  - container_types
ApiError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
DictionaryValue:
  type: object
  additionalProperties: false
  properties:
    code:
      type: string
    name:
      type: string
  required:
  - code
  - name
ShipmentBusinessSettings:
  type: object
  additionalProperties: false
  properties:
    revision:
      type: integer
      format: int64
      minimum: 0
    rules:
      $ref: '#/ShipmentBusinessRules'
    allowed_route_types:
      type: array
      items:
        $ref: '#/DictionaryValue'
    allowed_container_types:
      type: array
      items:
        type: string
    planned_containers_allowed:
      type: boolean
  required:
  - revision
  - rules
  - allowed_route_types
  - allowed_container_types
  - planned_containers_allowed
