openapi: 3.0.3
info:
  title: Валюты и настройки финансов
  version: '1.0'
paths:
  /api/admin/finance/settings/get:
    post:
      summary: Настройки финансов организации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organization_id:
                  type: string
                  format: uuid
              required:
              - organization_id
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinanceSettings
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '409':
          description: Редакция изменилась
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '503':
          description: Курс или сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
      security:
      - BrowserSession: []
  /api/admin/finance/settings/update:
    post:
      summary: Изменить валюту пересчёта организации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organization_id:
                  type: string
                  format: uuid
                reporting_currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                expected_revision:
                  type: integer
                  format: int64
                outgoing_number_template:
                  type: string
                  minLength: 1
                  maxLength: 100
                incoming_number_template:
                  type: string
                  minLength: 1
                  maxLength: 100
                reset_numbers_yearly:
                  type: boolean
              required:
              - organization_id
              - reporting_currency
              - expected_revision
              - outgoing_number_template
              - incoming_number_template
              - reset_numbers_yearly
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinanceSettings
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '409':
          description: Редакция изменилась
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '503':
          description: Курс или сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
      security:
      - BrowserSession: []
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: broker_admin
