openapi: 3.0.3
info:
  title: Создать валидный драфт одного конфига
  version: '1'
paths:
  /admin/configs/drafts/create:
    post:
      summary: Создать валидный драфт одного конфига
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - actor
              - config_name
              - description
              - expected_config_version
              properties:
                actor:
                  type: string
                  minLength: 1
                  maxLength: 128
                config_name:
                  type: string
                  minLength: 1
                description:
                  type: string
                  minLength: 1
                  maxLength: 4096
                expected_config_version:
                  type: integer
                  minimum: 0
                value:
                  type: object
                  additionalProperties: true
                source_revision:
                  type: integer
                  minimum: 0
      description: Укажите ровно одно из value и source_revision. На конфиг разрешен
        один активный драфт.
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/drafts.yaml#/ConfigDraft
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
