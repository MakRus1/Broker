openapi: 3.0.3
info:
  title: Создать валидный драфт одного конфига
  version: '1'
paths:
  /admin/configs/drafts/create:
    post:
      summary: Создать драфт нового или существующего конфига
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../../components/schemas/drafts.yaml#/CreateConfigDraftRequest
      description: 'Укажите одно действие: value, source_revision или remove: true.
        На конфиг разрешён один активный драфт.'
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/drafts.yaml#/ConfigDraft
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '401':
          description: Требуется действительный access token
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '503':
          description: Ключи авторизации недоступны
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- AdminBearer: []
