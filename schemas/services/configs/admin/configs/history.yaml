openapi: 3.0.3
info:
  title: Получить историю опубликованных ревизий
  version: '1'
paths:
  /admin/configs/history:
    get:
      summary: Получить историю опубликованных ревизий
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
