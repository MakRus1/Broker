openapi: 3.0.3
info:
  title: Нумерация договоров
  version: '1'
paths:
  /api/admin/contracts/numbering/get:
    post:
      summary: Настройки нумерации договоров
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organization_id:
                  type: string
                  format: uuid
              required:
              - organization_id
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractNumbering
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractError
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractError
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractError
        '409':
          description: Редакция изменилась
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractError
        '503':
          description: Курс или сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractError
      security:
      - bearerAuth: []
  /api/admin/contracts/numbering/update:
    post:
      summary: Изменить нумерацию договоров
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/models.yaml#/UpdateContractNumberingRequest
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractNumbering
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractError
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractError
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractError
        '409':
          description: Редакция изменилась
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractError
        '503':
          description: Курс или сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ContractError
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
