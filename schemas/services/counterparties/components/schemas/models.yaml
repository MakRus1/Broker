CounterpartyRole:
  type: string
  enum:
  - customer
  - carrier
  - agent
  - supplier
  - partner
CounterpartyContact:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 256
      minLength: 1
    position:
      type: string
      maxLength: 256
      nullable: true
    email:
      type: string
      maxLength: 256
      nullable: true
    phone:
      type: string
      maxLength: 64
      nullable: true
  required:
  - name
Counterparty:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      maxLength: 256
      format: uuid
    name:
      type: string
      maxLength: 256
      minLength: 1
    legal_name:
      type: string
      maxLength: 512
      nullable: true
    country_code:
      type: string
      maxLength: 2
      pattern: ^(|[A-Za-z]{2})$
      nullable: true
    tax_id:
      type: string
      maxLength: 64
      pattern: ^[A-Za-z0-9 -]*$
      nullable: true
    registration_id:
      type: string
      maxLength: 64
      nullable: true
    legal_address:
      type: string
      maxLength: 1024
      nullable: true
    roles:
      type: array
      items:
        $ref: '#/CounterpartyRole'
      uniqueItems: true
      maxItems: 5
      default: []
    contacts:
      type: array
      items:
        $ref: '#/CounterpartyContact'
      maxItems: 32
    revision:
      type: integer
      minimum: 1
    archived:
      type: boolean
    kpp:
      type: string
      nullable: true
      pattern: ^[0-9]{9}$
      maxLength: 9
    logist:
      type: string
      nullable: true
      minLength: 1
      maxLength: 256
  required:
  - id
  - name
  - legal_name
  - country_code
  - tax_id
  - registration_id
  - legal_address
  - roles
  - contacts
  - revision
  - archived
CounterpartyError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
CreateCounterpartyRequest:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      maxLength: 256
      format: uuid
    name:
      type: string
      maxLength: 256
      minLength: 1
    legal_name:
      type: string
      maxLength: 512
      nullable: true
    country_code:
      type: string
      maxLength: 2
      pattern: ^(|[A-Za-z]{2})$
      nullable: true
    tax_id:
      type: string
      maxLength: 64
      pattern: ^[A-Za-z0-9 -]*$
      nullable: true
    registration_id:
      type: string
      maxLength: 64
      nullable: true
    legal_address:
      type: string
      maxLength: 1024
      nullable: true
    roles:
      type: array
      items:
        $ref: '#/CounterpartyRole'
      uniqueItems: true
      maxItems: 5
      default: []
    contacts:
      type: array
      items:
        $ref: '#/CounterpartyContact'
      maxItems: 32
    kpp:
      type: string
      nullable: true
      pattern: ^[0-9]{9}$
      maxLength: 9
    logist:
      type: string
      nullable: true
      minLength: 1
      maxLength: 256
  required:
  - id
  - name
UpdateCounterpartyRequest:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      maxLength: 256
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
    name:
      type: string
      maxLength: 256
      minLength: 1
    legal_name:
      type: string
      maxLength: 512
      nullable: true
    country_code:
      type: string
      maxLength: 2
      pattern: ^(|[A-Za-z]{2})$
      nullable: true
    tax_id:
      type: string
      maxLength: 64
      pattern: ^[A-Za-z0-9 -]*$
      nullable: true
    registration_id:
      type: string
      maxLength: 64
      nullable: true
    legal_address:
      type: string
      maxLength: 1024
      nullable: true
    roles:
      type: array
      items:
        $ref: '#/CounterpartyRole'
      uniqueItems: true
      maxItems: 5
    contacts:
      type: array
      items:
        $ref: '#/CounterpartyContact'
      maxItems: 32
    kpp:
      type: string
      nullable: true
      pattern: ^[0-9]{9}$
      maxLength: 9
    logist:
      type: string
      nullable: true
      minLength: 1
      maxLength: 256
  required:
  - id
  - expected_revision
  - name
GetCounterpartyRequest:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      maxLength: 256
      format: uuid
  required:
  - id
SetArchivedCounterpartyRequest:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      maxLength: 256
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
    archived:
      type: boolean
  required:
  - id
  - expected_revision
  - archived
ListCounterpartiesRequest:
  type: object
  additionalProperties: false
  properties:
    after:
      type: string
      maxLength: 256
      format: uuid
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 100
    sort:
      type: string
      default: id
      minLength: 1
      maxLength: 64
    descending:
      type: boolean
      default: false
    cursor:
      $ref: '#/CounterpartyRegistryCursor'
    filters:
      type: array
      maxItems: 32
      items:
        $ref: '#/RegistryFilter'
  required: []
CounterpartySnapshot:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 256
      minLength: 1
    legal_name:
      type: string
      maxLength: 512
      nullable: true
    country_code:
      type: string
      maxLength: 2
      pattern: ^(|[A-Za-z]{2})$
      nullable: true
    tax_id:
      type: string
      maxLength: 64
      pattern: ^[A-Za-z0-9 -]*$
      nullable: true
    registration_id:
      type: string
      maxLength: 64
      nullable: true
    legal_address:
      type: string
      maxLength: 1024
      nullable: true
    roles:
      type: array
      items:
        $ref: '#/CounterpartyRole'
      uniqueItems: true
      maxItems: 5
    contacts:
      type: array
      items:
        $ref: '#/CounterpartyContact'
      maxItems: 32
    archived:
      type: boolean
    kpp:
      type: string
      nullable: true
      pattern: ^[0-9]{9}$
      maxLength: 9
    logist:
      type: string
      nullable: true
      minLength: 1
      maxLength: 256
  required:
  - name
ListCounterpartyHistoryRequest:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    before:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
  required:
  - id
CounterpartyEvent:
  type: object
  additionalProperties: false
  properties:
    id:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    action:
      type: string
    actor:
      type: string
    actor_name:
      type: string
    occurred_at:
      type: string
      format: date-time
    revision:
      type: integer
      minimum: 1
    before:
      $ref: '#/CounterpartySnapshot'
    after:
      $ref: '#/CounterpartySnapshot'
  required:
  - id
  - action
  - actor
  - occurred_at
  - after
RegistryParty:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
    legal_name:
      type: string
      nullable: true
    tax_id:
      type: string
    kpp:
      type: string
      nullable: true
    registration_id:
      type: string
      nullable: true
    legal_address:
      type: string
      nullable: true
    status:
      type: string
      nullable: true
  required:
  - name
  - legal_name
  - tax_id
  - kpp
  - registration_id
  - legal_address
  - status
LookupCounterpartyRequest:
  type: object
  additionalProperties: false
  properties:
    tax_id:
      type: string
      pattern: ^([0-9]{10}|[0-9]{12})$
  required:
  - tax_id
CounterpartyRegistryCursor:
  type: object
  additionalProperties: false
  required:
  - id
  - scope
  - value
  properties:
    id:
      type: string
      format: uuid
    scope:
      type: string
      pattern: ^[a-f0-9]{64}$
    value:
      type: string
      maxLength: 1024
RegistryFilter:
  type: object
  additionalProperties: false
  required:
  - field
  properties:
    field:
      type: string
      minLength: 1
      maxLength: 64
    values:
      type: array
      maxItems: 200
      uniqueItems: true
      items:
        type: string
        maxLength: 2000
    query:
      type: string
      maxLength: 256
    date_from:
      type: string
      format: date
    date_to:
      type: string
      format: date
    empty:
      type: boolean
RegistryField:
  type: object
  additionalProperties: false
  required:
  - id
  - label
  - kind
  - sortable
  - case_insensitive
  properties:
    id:
      type: string
    label:
      type: string
    kind:
      type: string
      enum:
      - values
      - set
      - date
      - boolean
    sortable:
      type: boolean
    lookup:
      type: string
    case_insensitive:
      type: boolean
RegistryValue:
  type: object
  additionalProperties: false
  required:
  - value
  - label
  properties:
    value:
      type: string
    label:
      type: string
