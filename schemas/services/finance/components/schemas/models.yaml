      type: integer
      nullable: true
      minimum: 0
      maximum: 10000
      description: 'Сотые доли процента: 2250 означает 22,5%'
    note:
      type: string
      nullable: true
      maxLength: 4000
    archived:
      type: boolean
    revision:
      type: integer
      minimum: 1
  required:
  - id
  - name
  - direction
  - unit
  - currency
  - vat_mode
  - vat_rate_basis_points
  - note
  - archived
  - revision
