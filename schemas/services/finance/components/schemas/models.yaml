EntryScope:
  type: object
  additionalProperties: false
  properties:
    shipment_id:
      type: string
      format: uuid
    transportation_id:
      type: string
      format: uuid
      nullable: true
  required:
  - shipment_id
  - transportation_id
ListFinancialEntriesRequest:
  type: object
  additionalProperties: false
  properties:
    scope:
      $ref: '#/EntryScope'
    after:
      type: string
      format: uuid
      nullable: true
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
    include_archived:
      type: boolean
      default: false
  required:
  - scope
  - after
  - limit
  - include_archived
CurrencyTotal:
  type: object
  additionalProperties: false
  properties:
    currency:
      type: string
    income_minor:
      type: string
      pattern: ^[0-9]+$
    expense_minor:
      type: string
      pattern: ^[0-9]+$
  required:
  - currency
  - income_minor
  - expense_minor
EntrySummary:
  type: object
  additionalProperties: false
  properties:
    own:
      type: array
      items:
        $ref: '#/CurrencyTotal'
    transportations:
      type: array
      items:
        $ref: '#/CurrencyTotal'
    combined:
      type: array
      items:
        $ref: '#/CurrencyTotal'
  required:
  - own
  - transportations
  - combined
PriceMode:
  type: string
  enum:
  - net
  - gross
