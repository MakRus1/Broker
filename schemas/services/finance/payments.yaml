openapi: 3.0.3
info:
  title: Поступления и списания
  version: '1'
paths:
  /api/v1/payments/save:
    post:
      summary: Сохранить платёж и распределение оплаты
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/models.yaml#/SavePaymentRequest
      responses:
        '200':
          description: Платёж, распределение или результат выборки
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/PaymentDetails
        '400':
          description: Некорректные поля, повтор счёта или превышение суммы платежа
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к платежам или связанным данным организации
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '404':
          description: Платёж, счёт или связанный объект не найден в организации
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '409':
          description: Конфликт редакции, несовместимые оплаты или превышение остатка
            счёта
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '502':
          description: Не удалось проверить стороны или банковские счета
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
      security:
      - bearerAuth: []
  /api/v1/payments/get:
    post:
      summary: Карточка платежа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/models.yaml#/InvoiceBalanceRequest
      responses:
        '200':
          description: Платёж, распределение или результат выборки
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/PaymentDetails
        '400':
          description: Некорректные поля, повтор счёта или превышение суммы платежа
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к платежам или связанным данным организации
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '404':
          description: Платёж, счёт или связанный объект не найден в организации
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
      security:
      - bearerAuth: []
  /api/v1/payments/list:
    post:
      summary: Реестр платежей
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/models.yaml#/ListPaymentsRequest
      responses:
        '200':
          description: Платёж, распределение или результат выборки
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: components/schemas/models.yaml#/Payment
                  next_cursor:
                    $ref: components/schemas/models.yaml#/InvoiceRegistryCursor
                required:
                - items
        '400':
          description: Некорректные поля, повтор счёта или превышение суммы платежа
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к платежам или связанным данным организации
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
      security:
      - bearerAuth: []
  /api/v1/payments/filter-values:
    post:
      summary: Поля и значения фильтров платежей
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/models.yaml#/PaymentFilterValuesRequest
      responses:
        '200':
          description: Платёж, распределение или результат выборки
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - fields
                - values
                properties:
                  fields:
                    type: array
                    items:
                      $ref: components/schemas/models.yaml#/RegistryField
                  values:
                    type: array
                    items:
                      $ref: components/schemas/models.yaml#/RegistryValue
                  next_after:
                    type: string
        '400':
          description: Некорректные поля, повтор счёта или превышение суммы платежа
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к платежам или связанным данным организации
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
      security:
      - bearerAuth: []
  /api/v1/payments/invoice-candidates:
    post:
      summary: Счета для распределения оплаты
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/models.yaml#/PaymentInvoiceCandidatesRequest
      responses:
        '200':
          description: Платёж, распределение или результат выборки
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: components/schemas/models.yaml#/PaymentInvoice
                  next_after:
                    type: string
                    format: uuid
                    nullable: true
                required:
                - items
                - next_after
        '400':
          description: Некорректные поля, повтор счёта или превышение суммы платежа
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к платежам или связанным данным организации
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
      security:
      - bearerAuth: []
  /api/v1/payments/invoice-balance:
    post:
      summary: Оплата и остаток счёта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/models.yaml#/InvoiceBalanceRequest
      responses:
        '200':
          description: Платёж, распределение или результат выборки
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/PaymentInvoice
        '400':
          description: Некорректные поля, повтор счёта или превышение суммы платежа
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к платежам или связанным данным организации
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '404':
          description: Платёж, счёт или связанный объект не найден в организации
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
      security:
      - bearerAuth: []
  /api/v1/payments/payment-candidates:
    post:
      summary: Поступления или списания со свободным остатком для счёта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                invoice_id:
                  type: string
                  format: uuid
                query:
                  type: string
                  maxLength: 200
                after:
                  type: string
                  format: uuid
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 40
              required:
              - invoice_id
      responses:
        '200':
          description: Платёж, распределение или результат выборки
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: components/schemas/models.yaml#/PaymentAvailable
                  next_after:
                    type: string
                    format: uuid
                    nullable: true
                required:
                - items
                - next_after
        '400':
          description: Некорректные поля, повтор счёта или превышение суммы платежа
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к платежам или связанным данным организации
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '404':
          description: Платёж, счёт или связанный объект не найден в организации
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
        '409':
          description: Счёт находится в архиве
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
