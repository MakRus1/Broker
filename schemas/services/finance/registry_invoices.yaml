openapi: 3.0.3
info:
  title: Фильтры реестра
  version: '1'
paths:
  /api/v1/invoices/filter-values:
    post:
      summary: Поля реестра и значения фильтра с учётом остальных условий
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/models.yaml#/InvoiceFilterValuesRequest
      responses:
        '200':
          description: Каталог полей и очередная страница значений
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - fields
                - values
                properties:
                  fields:
                    type: array
                    items:
                      $ref: components/schemas/models.yaml#/RegistryField
                  values:
                    type: array
                    items:
                      $ref: components/schemas/models.yaml#/RegistryValue
                  next_after:
                    type: string
        '400':
          description: Некорректные фильтры или неизвестное поле
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/FinancialLabelError
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- BearerAuth: []
