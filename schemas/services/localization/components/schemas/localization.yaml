Translation:
  type: object
  additionalProperties: false
  required:
  - key
  - value
  properties:
    key:
      type: string
    value:
      type: string
EditableCatalog:
  type: object
  additionalProperties: false
  required:
  - ru
  - en
  properties:
    ru:
      type: array
      maxItems: 10000
      items:
        $ref: '#/Translation'
    en:
      type: array
      maxItems: 10000
      items:
        $ref: '#/Translation'
CatalogEditorState:
  type: object
  additionalProperties: false
  required:
  - version
  - revision
  - published
  - inherited
  - source
  properties:
    version:
      type: integer
      format: int64
    revision:
      type: integer
      format: int64
    published:
      $ref: '#/EditableCatalog'
    inherited:
      $ref: '#/EditableCatalog'
    draft:
      $ref: '#/EditableCatalog'
    source:
      $ref: '#/EditableCatalog'
GetCatalogRequest:
  type: object
  additionalProperties: false
  properties:
    organization_id:
      type: string
      format: uuid
    locale:
      type: string
      enum:
      - ru
      - en
  required:
  - organization_id
  - locale
GetEditorRequest:
  type: object
  additionalProperties: false
  properties:
    organization_id:
      type: string
      format: uuid
SaveCatalogRequest:
  type: object
  additionalProperties: false
  properties:
    organization_id:
      type: string
      format: uuid
    version:
      type: integer
      format: int64
      minimum: 0
    catalog:
      $ref: '#/EditableCatalog'
  required:
  - version
  - catalog
PublishCatalogRequest:
  type: object
  additionalProperties: false
  properties:
    organization_id:
      type: string
      format: uuid
    version:
      type: integer
      format: int64
      minimum: 0
  required:
  - version
