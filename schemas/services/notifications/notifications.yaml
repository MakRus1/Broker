openapi: 3.0.3
info:
  title: Уведомления
  version: '1'
paths:
  /api/internal/v1/events/publish:
    post:
      summary: Надёжно принять событие
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/notifications.yaml#/PublishedEvent
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  accepted:
                    type: boolean
                required:
                - accepted
        '400':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
        '401':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
        '403':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
        '409':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
        '502':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
      security:
      - bearerAuth: []
  /api/v1/notifications/list:
    post:
      summary: Уведомления текущего сотрудника
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/notifications.yaml#/ListNotificationsRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: components/schemas/notifications.yaml#/Notification
                required:
                - items
        '400':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
        '401':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
        '403':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
        '409':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
        '502':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
      security:
      - bearerAuth: []
  /api/v1/notifications/read:
    post:
      summary: Отметить выбранные уведомления прочитанными
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/notifications.yaml#/ReadNotificationsRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  updated:
                    type: integer
                required:
                - updated
        '400':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
        '401':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
        '403':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
        '409':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
        '502':
          description: Ошибка запроса или доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/notifications.yaml#/ApiError
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
