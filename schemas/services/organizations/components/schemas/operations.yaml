OrganizationIdentity:
  type: object
  additionalProperties: false
  required:
  - organization_id
  properties:
    organization_id:
      type: string
      format: uuid
RegistryDefaultsGetResult:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: registry_defaults.yaml#/RegistryDefault
  required:
  - items
RegistryDefaultsListResult:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: registry_defaults.yaml#/RegistryDefault
    roles:
      type: array
      items:
        $ref: registry_defaults.yaml#/RegistryRole
  required:
  - items
  - roles
RegistryDefaultsSaveRequest:
  type: object
  additionalProperties: false
  properties:
    organization_id:
      type: string
      format: uuid
    role:
      type: string
      minLength: 1
      maxLength: 100
    registry:
      type: string
      pattern: ^(shipments|transportations|counterparties|contracts|service-charges|financial_labels|outgoing-invoices|incoming-invoices|receipt-payments|disbursement-payments)$
    value:
      type: object
      additionalProperties: true
    expected_revision:
      type: integer
      minimum: 0
  required:
  - organization_id
  - role
  - registry
  - value
  - expected_revision
RegistryDefaultsSaveResult:
  type: object
  additionalProperties: false
  properties:
    item:
      $ref: registry_defaults.yaml#/RegistryDefault
  required:
  - item
AccessResolveOrganizationRequest:
  type: object
  additionalProperties: false
  required:
  - permission
  properties:
    organization_id:
      type: string
      format: uuid
    permission:
      type: string
      minLength: 1
      maxLength: 100
AccessMineResult:
  type: object
  additionalProperties: false
  required:
  - platform_admin
  - organizations
  - managed_organization_ids
  properties:
    platform_admin:
      type: boolean
    organizations:
      type: array
      items:
        $ref: organizations.yaml#/Organization
    managed_organization_ids:
      type: array
      items:
        type: string
        format: uuid
OrganizationsListResult:
  type: object
  additionalProperties: false
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: organizations.yaml#/Organization
    next_cursor:
      $ref: organizations.yaml#/OrganizationListCursor
OrganizationResult:
  type: object
  additionalProperties: false
  required:
  - organization
  properties:
    organization:
      $ref: organizations.yaml#/Organization
MembersListResult:
  type: object
  additionalProperties: false
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: organizations.yaml#/Member
    next_cursor:
      $ref: organizations.yaml#/MemberListCursor
MemberResult:
  type: object
  additionalProperties: false
  required:
  - member
  properties:
    member:
      $ref: organizations.yaml#/Member
RolesListResult:
  type: object
  additionalProperties: false
  required:
  - items
  - permissions
  properties:
    items:
      type: array
      items:
        $ref: organizations.yaml#/OrganizationRole
    permissions:
      type: array
      items:
        $ref: organizations.yaml#/Permission
RolesCreateRequest:
  type: object
  additionalProperties: false
  required:
  - organization_id
  - id
  - name
  - description
  - permissions
  properties:
    organization_id:
      type: string
      format: uuid
    id:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[a-z][a-z0-9_-]*$
    name:
      type: string
      minLength: 1
      maxLength: 100
    description:
      type: string
      maxLength: 500
    permissions:
      type: array
      items:
        type: string
      maxItems: 100
OrganizationRoleResult:
  type: object
  additionalProperties: false
  required:
  - role
  properties:
    role:
      $ref: organizations.yaml#/OrganizationRole
RolesUpdateRequest:
  type: object
  additionalProperties: false
  required:
  - organization_id
  - id
  - name
  - description
  - permissions
  - expected_revision
  properties:
    organization_id:
      type: string
      format: uuid
    id:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[a-z][a-z0-9_-]*$
    name:
      type: string
      minLength: 1
      maxLength: 100
    description:
      type: string
      maxLength: 500
    permissions:
      type: array
      items:
        type: string
      maxItems: 100
    expected_revision:
      type: integer
      format: int64
      minimum: 1
AccessGetPlatformRequest:
  type: object
  additionalProperties: false
  required:
  - subject
  properties:
    subject:
      type: string
      minLength: 1
      maxLength: 200
AccessUpdatePlatformRequest:
  type: object
  additionalProperties: false
  required:
  - subject
  - permissions
  - expected_revision
  properties:
    subject:
      type: string
      minLength: 1
      maxLength: 200
    permissions:
      type: array
      items:
        type: string
    expected_revision:
      type: integer
      minimum: 0
AccessResolvePlatformRequest:
  type: object
  additionalProperties: false
  required:
  - permission
  properties:
    permission:
      type: string
      minLength: 1
      maxLength: 100
AccessEmployeesRequest:
  type: object
  additionalProperties: false
  properties:
    organization_id:
      type: string
      format: uuid
    query:
      type: string
      maxLength: 200
    subject:
      type: string
      maxLength: 200
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  required: []
AccessEmployeesResult:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: organizations.yaml#/OrganizationEmployee
  required:
  - items
PermissionReleasesUpsertRequest:
  type: object
  additionalProperties: false
  required:
  - owner
  - version
  - entries
  properties:
    owner:
      type: string
      minLength: 1
      maxLength: 100
    version:
      type: string
      minLength: 1
      maxLength: 1000
    entries:
      type: array
      maxItems: 1000
      items:
        $ref: '#/ReleasePermission'
PermissionReleaseResult:
  type: object
  additionalProperties: false
  required:
  - success
  properties:
    success:
      type: boolean
PermissionReleasesActivateRequest:
  type: object
  additionalProperties: false
  required:
  - owner
  - version
  properties:
    owner:
      type: string
      minLength: 1
      maxLength: 100
    version:
      type: string
      minLength: 1
      maxLength: 1000
PermissionReleasesReconcileRequest:
  type: object
  additionalProperties: false
  required:
  - owner
  - versions
  properties:
    owner:
      type: string
      minLength: 1
      maxLength: 100
    versions:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
ReleasePermission:
  type: object
  additionalProperties: false
  required:
  - code
  - name
  - group
  - scope
  - dependencies
  properties:
    code:
      type: string
      minLength: 3
      maxLength: 200
    name:
      type: string
      minLength: 1
      maxLength: 500
    group:
      type: string
      minLength: 1
      maxLength: 200
    scope:
      type: string
      enum:
      - organization
      - platform
      - service
    dependencies:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 3
        maxLength: 200
