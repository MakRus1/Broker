openapi: 3.0.3
info:
  title: Исходные виды реестров по ролям
  version: '1'
paths:
  /api/organizations/registry-defaults/get:
    post:
      summary: Исходные виды своей роли
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/operations.yaml#/OrganizationIdentity
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: components/schemas/operations.yaml#/RegistryDefaultsGetResult
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: components/schemas/organizations.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/organizations.yaml#/ApiError
        '403':
          description: Нет доступа к организации или управлению ролями
          content:
            application/json:
              schema:
                $ref: components/schemas/organizations.yaml#/ApiError
        '409':
          description: Вид роли изменён другим пользователем
          content:
            application/json:
              schema:
                $ref: components/schemas/organizations.yaml#/ApiError
      security:
      - BearerAuth: []
  /api/organizations/registry-defaults/list:
    post:
      summary: Виды реестров и роли организации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/operations.yaml#/OrganizationIdentity
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: components/schemas/operations.yaml#/RegistryDefaultsListResult
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: components/schemas/organizations.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/organizations.yaml#/ApiError
        '403':
          description: Нет доступа к организации или управлению ролями
          content:
            application/json:
              schema:
                $ref: components/schemas/organizations.yaml#/ApiError
        '409':
          description: Вид роли изменён другим пользователем
          content:
            application/json:
              schema:
                $ref: components/schemas/organizations.yaml#/ApiError
      security:
      - BearerAuth: []
  /api/organizations/registry-defaults/save:
    post:
      summary: Сохранить исходный вид реестра роли
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/operations.yaml#/RegistryDefaultsSaveRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: components/schemas/operations.yaml#/RegistryDefaultsSaveResult
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: components/schemas/organizations.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/organizations.yaml#/ApiError
        '403':
          description: Нет доступа к организации или управлению ролями
          content:
            application/json:
              schema:
                $ref: components/schemas/organizations.yaml#/ApiError
        '409':
          description: Вид роли изменён другим пользователем
          content:
            application/json:
              schema:
                $ref: components/schemas/organizations.yaml#/ApiError
      security:
      - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
