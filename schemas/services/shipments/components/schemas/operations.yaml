TransportationOperationsCreateResult:
  type: object
  additionalProperties: false
  required:
  - operation
  properties:
    operation:
      $ref: models.yaml#/CreationOperation
TransportationOperationsGetResult:
  type: object
  additionalProperties: false
  required:
  - operation
  properties:
    operation:
      $ref: models.yaml#/CreationOperation
ShipmentsFilterValuesRequest:
  type: object
  additionalProperties: false
  required:
  - registry
  properties:
    registry:
      $ref: models.yaml#/ListShipmentsRequest
    field:
      type: string
      maxLength: 64
    query:
      type: string
      maxLength: 256
    after:
      type: string
      maxLength: 2000
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 40
    candidates:
      type: array
      maxItems: 100
      items:
        type: string
        maxLength: 2000
ShipmentsFilterValuesResult:
  type: object
  additionalProperties: false
  required:
  - fields
  - values
  properties:
    fields:
      type: array
      items:
        $ref: models.yaml#/RegistryField
    values:
      type: array
      items:
        $ref: models.yaml#/RegistryValue
    next_after:
      type: string
ShipmentsCreateResult:
  type: object
  additionalProperties: false
