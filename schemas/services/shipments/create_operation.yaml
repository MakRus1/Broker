openapi: 3.0.3
info:
  title: Создать операцию формирования перевозок
  version: '1'
paths:
  /api/v1/transportation-operations/create:
    post:
      summary: Создать операцию формирования перевозок
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                item_id:
                  type: string
                  format: uuid
                expected_revision:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 100
                idempotency_key:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
              - item_id
              - expected_revision
              - quantity
              - idempotency_key
      responses:
        '202':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - operation
                properties:
                  operation:
                    $ref: components/schemas/models.yaml#/CreationOperation
        '400':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '401':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '403':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '404':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '409':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '503':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- BearerAuth: []
