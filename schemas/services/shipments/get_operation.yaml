openapi: 3.0.3
info:
  title: Состояние операции формирования перевозок
  version: '1'
paths:
  /api/v1/transportation-operations/get:
    post:
      summary: Состояние операции формирования перевозок
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                operation_id:
                  type: string
                  format: uuid
              required:
              - operation_id
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - operation
                properties:
                  operation:
                    $ref: components/schemas/models.yaml#/CreationOperation
        '400':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '401':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '403':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '404':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '409':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '503':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- BearerAuth: []
