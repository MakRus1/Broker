openapi: 3.0.3
info:
  title: Изменить поставку
  version: '1'
paths:
  /api/v1/shipments/update:
    post:
      summary: Изменить поставку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                shipment_id:
                  type: string
                  format: uuid
                expected_revision:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                reference:
                  type: string
                  maxLength: 256
              required:
              - shipment_id
              - expected_revision
              - reference
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - shipment
                properties:
                  shipment:
                    $ref: components/schemas/models.yaml#/Shipment
        '400':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '401':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '403':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '404':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '409':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '503':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- BearerAuth: []
