openapi: 3.0.3
info:
  title: Общий справочник станций
  version: '1'
paths:
  /api/admin/railway-stations/list:
    post:
      summary: Общий справочник железнодорожных станций
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/models.yaml#/ListStationsRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: components/schemas/models.yaml#/RailwayStation
                  next:
                    type: string
                  next_cursor:
                    $ref: components/schemas/models.yaml#/StationListCursor
                required:
                - items
        '400':
          description: Некорректные значения
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '403':
          description: Требуется администратор платформы
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '404':
          description: Станция не найдена
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '503':
          description: Проверка доступа недоступна
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
  /api/admin/railway-stations/save:
    post:
      summary: Добавить или изменить общую станцию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                esr_code:
                  type: string
                  pattern: ^[0-9]{6}$
                name:
                  type: string
                  minLength: 1
                  maxLength: 256
                country_code:
                  type: string
                  pattern: ^[A-Z]{2}$
                existing:
                  type: boolean
                  description: Явное редактирование существующей записи
                id:
                  type: string
                  format: uuid
                uic_code:
                  type: string
                  pattern: ^[0-9]{7}$
              required:
              - id
              - name
              - country_code
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/RailwayStation
        '400':
          description: Некорректные значения
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '403':
          description: Требуется администратор платформы
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '404':
          description: Станция не найдена
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '503':
          description: Проверка доступа недоступна
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '409':
          description: Идентификатор станции уже используется
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
  /api/admin/railway-stations/archive:
    post:
      summary: Архивировать общую станцию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                id:
                  type: string
                  format: uuid
              required:
              - id
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                - id
        '400':
          description: Некорректные значения
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '403':
          description: Требуется администратор платформы
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '404':
          description: Станция не найдена
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '503':
          description: Проверка доступа недоступна
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- BearerAuth: []
