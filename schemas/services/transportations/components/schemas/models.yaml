ApiError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
CreationOperation:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    quantity:
      type: integer
      minimum: 1
      maximum: 100
    status:
      $ref: '#/OperationStatus'
    transportation_ids:
      type: array
      items:
        type: string
        format: uuid
    rejection_code:
      type: string
      maxLength: 128
  required:
  - id
  - item_id
  - quantity
  - status
  - transportation_ids
Transportation:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    shipment_id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    operation_id:
      type: string
      format: uuid
    container_type_code:
      type: string
      minLength: 1
      maxLength: 16
    container_ownership:
      $ref: '#/ContainerOwnership'
    legs:
      type: array
      items:
        $ref: '#/TransportationLeg'
    number:
      type: string
      minLength: 1
  required:
  - id
  - revision
  - shipment_id
  - item_id
  - operation_id
  - container_type_code
  - container_ownership
  - legs
  - number
TransportationLeg:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    mode:
      $ref: '#/TransportMode'
    origin:
      $ref: '#/TransportationLegOrigin'
    destination:
      $ref: '#/TransportationLegDestination'
    contractor_id:
      type: string
      format: uuid
    planned_departure_at:
      type: string
      format: date-time
    planned_arrival_at:
      type: string
      format: date-time
    actual_departure_at:
      type: string
      format: date-time
    actual_arrival_at:
      type: string
      format: date-time
  required:
  - id
  - mode
  - origin
  - destination
TransportationLegOrigin:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 256
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
  required:
  - name
  - country_code
TransportationLegDestination:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 256
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
  required:
  - name
  - country_code
SetRouteLegsItem:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    mode:
      $ref: '#/TransportMode'
    origin:
      $ref: '#/SetRouteLegsItemOrigin'
    destination:
      $ref: '#/SetRouteLegsItemDestination'
    contractor_id:
      type: string
      format: uuid
    planned_departure_at:
      type: string
      format: date-time
    planned_arrival_at:
      type: string
      format: date-time
  required:
  - id
  - mode
  - origin
  - destination
SetRouteLegsItemOrigin:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 256
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
  required:
  - name
  - country_code
SetRouteLegsItemDestination:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 256
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
  required:
  - name
  - country_code
ContainerOwnership:
  type: string
  enum:
  - SOC
  - COC
OperationStatus:
  type: string
  enum:
  - pending
  - succeeded
  - rejected
TransportMode:
  type: string
  enum:
  - road
  - rail
  - sea
EventKind:
  type: string
  enum:
  - departure
  - arrival
GetTransportationRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
  required:
  - transportation_id
ListTransportationsRequest:
  type: object
  additionalProperties: false
  properties:
    shipment_id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
    after:
      type: string
      format: uuid
  required: []
EnsureCreatedRequest:
  type: object
  additionalProperties: false
  properties:
    operation_id:
      type: string
      format: uuid
    shipment_id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    tenant_id:
      type: string
      format: uuid
    quantity:
      type: integer
      minimum: 1
      maximum: 100
    schema_version:
      type: integer
      enum:
      - 1
    container_type_code:
      type: string
      pattern: ^[A-Z0-9]{2,16}$
    container_ownership:
      $ref: '#/ContainerOwnership'
  required:
  - operation_id
  - shipment_id
  - item_id
  - tenant_id
  - quantity
  - schema_version
  - container_type_code
  - container_ownership
SetRouteRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    legs:
      type: array
      minItems: 1
      maxItems: 32
      items:
        $ref: '#/SetRouteLegsItem'
  required:
  - transportation_id
  - expected_revision
  - legs
RecordActualRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    leg_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    event_kind:
      $ref: '#/EventKind'
    occurred_at:
      type: string
      format: date-time
  required:
  - transportation_id
  - leg_id
  - expected_revision
  - event_kind
  - occurred_at
CorrectActualRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    leg_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    event_kind:
      $ref: '#/EventKind'
    occurred_at:
      type: string
      format: date-time
    reason:
      type: string
      minLength: 1
      maxLength: 2048
  required:
  - transportation_id
  - leg_id
  - expected_revision
  - event_kind
  - occurred_at
  - reason
