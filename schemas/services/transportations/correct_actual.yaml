openapi: 3.0.3
info:
  title: Исправить факт исполнения плеча
  version: '1'
paths:
  /api/v1/transportation-actuals/correct:
    post:
      summary: Исправить факт исполнения плеча
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                transportation_id:
                  type: string
                  format: uuid
                leg_id:
                  type: string
                  format: uuid
                expected_revision:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                event_kind:
                  type: string
                  enum:
                  - departure
                  - arrival
                occurred_at:
                  type: string
                  format: date-time
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2048
              required:
              - transportation_id
              - leg_id
              - expected_revision
              - event_kind
              - occurred_at
              - reason
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - transportation
                properties:
                  transportation:
                    $ref: components/schemas/models.yaml#/Transportation
        '400':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '401':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '403':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '404':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '409':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '503':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- BearerAuth: []
