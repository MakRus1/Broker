openapi: 3.0.3
info:
  title: Гарантировать создание перевозок по операции
  version: '1'
paths:
  /api/internal/v1/transportations/ensure-created:
    post:
      summary: Гарантировать создание перевозок по операции
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                operation_id:
                  type: string
                  format: uuid
                shipment_id:
                  type: string
                  format: uuid
                item_id:
                  type: string
                  format: uuid
                tenant_id:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 100
                schema_version:
                  type: integer
                  enum:
                  - 1
                container_type_code:
                  type: string
                  pattern: ^[A-Z0-9]{2,16}$
                container_ownership:
                  type: string
                  enum:
                  - SOC
                  - COC
              required:
              - operation_id
              - shipment_id
              - item_id
              - tenant_id
              - quantity
              - schema_version
              - container_type_code
              - container_ownership
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - operation
                properties:
                  operation:
                    $ref: components/schemas/models.yaml#/CreationOperation
        '400':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '401':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '403':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '404':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '409':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '503':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- BearerAuth: []
