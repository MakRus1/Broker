openapi: 3.0.3
info:
  title: Поисковая проекция маршрута поставки
  version: '1'
paths:
  /api/internal/v1/shipments/route-projection:
    post:
      summary: Применить версию маршрута поставки для поиска
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/models.yaml#/ShipmentRouteProjection
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - applied
                properties:
                  applied:
                    type: boolean
        '400':
          description: Некорректное тело запроса, значения полей или последовательность
            дат
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '401':
          description: Отсутствует действительный Bearer-токен
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '403':
          description: Нет требуемого права или доверенной привязки к клиенту
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '404':
          description: Объект не найден в доступном клиенте
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '409':
          description: Операция с таким ID уже обработана с другим содержимым
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
        '503':
          description: Недоступны ключи проверки авторизации
          content:
            application/json:
              schema:
                $ref: components/schemas/models.yaml#/ApiError
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- BearerAuth: []
