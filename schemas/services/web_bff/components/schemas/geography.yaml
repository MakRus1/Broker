City:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
    country:
      type: string
    country_code:
      type: string
    label:
      type: string
  required:
  - name
  - country
  - country_code
  - label
GeographyError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
