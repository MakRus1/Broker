TApiError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
TCreationOperation:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    quantity:
      type: integer
      minimum: 1
      maximum: 100
    status:
      $ref: '#/TOperationStatus'
    transportation_ids:
      type: array
      items:
        type: string
        format: uuid
    rejection_code:
      type: string
      maxLength: 128
  required:
  - id
  - item_id
  - quantity
  - status
  - transportation_ids
TTransportation:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    shipment_id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    operation_id:
      type: string
      format: uuid
    container_type_code:
      type: string
      minLength: 1
      maxLength: 16
    container_ownership:
      $ref: '#/TContainerOwnership'
    legs:
      type: array
      items:
        $ref: '#/TTransportationLeg'
    number:
      type: string
      minLength: 1
  required:
  - id
  - revision
  - shipment_id
  - item_id
  - operation_id
  - container_type_code
  - container_ownership
  - legs
  - number
TTransportationLeg:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    mode:
      $ref: '#/TTransportMode'
    origin:
      $ref: '#/TTransportationLegOrigin'
    destination:
      $ref: '#/TTransportationLegDestination'
    contractor_id:
      type: string
      format: uuid
    planned_departure_at:
      type: string
      format: date-time
    planned_arrival_at:
      type: string
      format: date-time
    actual_departure_at:
      type: string
      format: date-time
    actual_arrival_at:
      type: string
      format: date-time
  required:
  - id
  - mode
  - origin
  - destination
TTransportationLegOrigin:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 256
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
  required:
  - name
  - country_code
TTransportationLegDestination:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 256
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
  required:
  - name
  - country_code
TSetRouteLegsItem:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    mode:
      $ref: '#/TTransportMode'
    origin:
      $ref: '#/TSetRouteLegsItemOrigin'
    destination:
      $ref: '#/TSetRouteLegsItemDestination'
    contractor_id:
      type: string
      format: uuid
    planned_departure_at:
      type: string
      format: date-time
    planned_arrival_at:
      type: string
      format: date-time
  required:
  - id
  - mode
  - origin
  - destination
TSetRouteLegsItemOrigin:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 256
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
  required:
  - name
  - country_code
TSetRouteLegsItemDestination:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 256
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
  required:
  - name
  - country_code
TContainerOwnership:
  type: string
  enum:
  - SOC
  - COC
TOperationStatus:
  type: string
  enum:
  - pending
  - succeeded
  - rejected
TTransportMode:
  type: string
  enum:
  - road
  - rail
  - sea
TEventKind:
  type: string
  enum:
  - departure
  - arrival
TGetTransportationRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
  required:
  - transportation_id
TListTransportationsRequest:
  type: object
  additionalProperties: false
  properties:
    shipment_id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
    after:
      type: string
      format: uuid
  required: []
TEnsureCreatedRequest:
  type: object
  additionalProperties: false
  properties:
    operation_id:
      type: string
      format: uuid
    shipment_id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    tenant_id:
      type: string
      format: uuid
    quantity:
      type: integer
      minimum: 1
      maximum: 100
    schema_version:
      type: integer
      enum:
      - 1
    container_type_code:
      type: string
      pattern: ^[A-Z0-9]{2,16}$
    container_ownership:
      $ref: '#/TContainerOwnership'
  required:
  - operation_id
  - shipment_id
  - item_id
  - tenant_id
  - quantity
  - schema_version
  - container_type_code
  - container_ownership
TSetRouteRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    legs:
      type: array
      minItems: 1
      maxItems: 32
      items:
        $ref: '#/TSetRouteLegsItem'
  required:
  - transportation_id
  - expected_revision
  - legs
TRecordActualRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    leg_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    event_kind:
      $ref: '#/TEventKind'
    occurred_at:
      type: string
      format: date-time
  required:
  - transportation_id
  - leg_id
  - expected_revision
  - event_kind
  - occurred_at
TCorrectActualRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    leg_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    event_kind:
      $ref: '#/TEventKind'
    occurred_at:
      type: string
      format: date-time
    reason:
      type: string
      minLength: 1
      maxLength: 2048
  required:
  - transportation_id
  - leg_id
  - expected_revision
  - event_kind
  - occurred_at
  - reason
TListHistoryRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    before:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
  required:
  - transportation_id
TTransportationEvent:
  type: object
  additionalProperties: false
  properties:
    id:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    action:
      type: string
    actor:
      type: string
    actor_name:
      type: string
    occurred_at:
      type: string
      format: date-time
    reason:
      type: string
    leg_id:
      type: string
      format: uuid
    event_kind:
      $ref: '#/TEventKind'
    revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    legs:
      type: array
      items:
        $ref: '#/TTransportationLeg'
  required:
  - id
  - action
  - actor
  - occurred_at
  - revision
  - legs
