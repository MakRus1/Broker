openapi: 3.0.3
info:
  title: Контрагенты
  version: '1'
paths:
  /api/v1/counterparties/create:
    post:
      summary: Создать контрагента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/counterparties.yaml#/CreateCounterpartyRequest
      responses:
        '201':
          description: Контрагент сохранён
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  counterparty:
                    $ref: components/schemas/counterparties.yaml#/Counterparty
                required:
                - counterparty
        '400':
          description: Некорректное имя или параметры
          content:
            application/json:
              schema:
                $ref: components/schemas/counterparties.yaml#/CounterpartyError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/counterparties.yaml#/CounterpartyError
        '403':
          description: Нет права или доступа к организации
          content:
            application/json:
              schema:
                $ref: components/schemas/counterparties.yaml#/CounterpartyError
        '409':
          description: Идентификатор уже занят другим контрагентом
          content:
            application/json:
              schema:
                $ref: components/schemas/counterparties.yaml#/CounterpartyError
        '503':
          description: Недоступна проверка доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/counterparties.yaml#/CounterpartyError
  /api/v1/counterparties/list:
    post:
      summary: Список контрагентов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/counterparties.yaml#/ListCounterpartiesRequest
      responses:
        '200':
          description: Список контрагентов
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: components/schemas/counterparties.yaml#/Counterparty
                required:
                - items
        '400':
          description: Некорректное имя или параметры
          content:
            application/json:
              schema:
                $ref: components/schemas/counterparties.yaml#/CounterpartyError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/counterparties.yaml#/CounterpartyError
        '403':
          description: Нет права или доступа к организации
          content:
            application/json:
              schema:
                $ref: components/schemas/counterparties.yaml#/CounterpartyError
        '409':
          description: Идентификатор уже занят другим контрагентом
          content:
            application/json:
              schema:
                $ref: components/schemas/counterparties.yaml#/CounterpartyError
        '503':
          description: Недоступна проверка доступа
          content:
            application/json:
              schema:
                $ref: components/schemas/counterparties.yaml#/CounterpartyError
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: broker_web
security:
- BrowserSession: []
