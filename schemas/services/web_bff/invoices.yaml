        '409':
          description: Конфликт редакции или начисление уже включено в счёт
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '502':
          description: Не удалось проверить стороны или договор
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
      security:
      - BrowserSession: []
  /api/v1/invoices/detach-service-charge:
    post:
      summary: Исключить услугу из счёта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/finance/models.yaml#/DetachInvoiceServiceChargeRequest
      responses:
        '200':
          description: Счёт
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/InvoiceDetails
        '400':
          description: Некорректные поля счёта
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к счетам организации
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '404':
          description: Счёт или связанный объект не найден
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '409':
          description: Конфликт редакции или начисление уже включено в счёт
          content:
            application/json:
