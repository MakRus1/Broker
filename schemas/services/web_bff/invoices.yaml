openapi: 3.0.3
info:
  title: Входящие и исходящие счета
  version: '1'
paths:
  /api/v1/invoices/save:
    post:
      summary: Создать или изменить счёт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/finance/models.yaml#/SaveInvoiceRequest
      responses:
        '200':
          description: Счёт
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/InvoiceDetails
        '400':
          description: Некорректные поля счёта
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к счетам организации
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '404':
          description: Счёт или связанный объект не найден
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '409':
          description: Конфликт редакции или начисление уже включено в счёт
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '502':
          description: Не удалось проверить стороны или договор
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
      security:
      - BrowserSession: []
  /api/v1/invoices/get:
    post:
      summary: Карточка счёта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/finance/models.yaml#/GetInvoiceRequest
      responses:
        '200':
          description: Счёт
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/InvoiceDetails
        '400':
          description: Некорректные поля счёта
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к счетам организации
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '404':
          description: Счёт или связанный объект не найден
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '409':
          description: Конфликт редакции или начисление уже включено в счёт
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '502':
          description: Не удалось проверить стороны или договор
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
      security:
      - BrowserSession: []
  /api/v1/invoices/list:
    post:
      summary: Реестр счетов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/finance/models.yaml#/ListInvoicesRequest
      responses:
        '200':
          description: Результаты поиска
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: components/schemas/finance/models.yaml#/InvoiceRegistryItem
                  next_cursor:
                    $ref: components/schemas/finance/models.yaml#/InvoiceRegistryCursor
                required:
                - items
        '400':
          description: Некорректные поля счёта
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к счетам организации
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '404':
          description: Счёт или связанный объект не найден
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '409':
          description: Конфликт редакции или начисление уже включено в счёт
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '502':
          description: Не удалось проверить стороны или договор
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
      security:
      - BrowserSession: []
  /api/v1/invoices/candidates:
    post:
      summary: Начисления, доступные для включения в счёт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/finance/models.yaml#/ListInvoiceCandidatesRequest
      responses:
        '200':
          description: Результаты поиска
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: components/schemas/finance/models.yaml#/ServiceCharge
                  next_after:
                    type: string
                    format: uuid
                    nullable: true
                required:
                - items
                - next_after
        '400':
          description: Некорректные поля счёта
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к счетам организации
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '404':
          description: Счёт или связанный объект не найден
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '409':
          description: Конфликт редакции или начисление уже включено в счёт
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '502':
          description: Не удалось проверить стороны или договор
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
      security:
      - BrowserSession: []
  /api/v1/invoices/add-service-charge:
    post:
      summary: Включить услугу в существующий счёт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/finance/models.yaml#/AddInvoiceServiceChargeRequest
      responses:
        '200':
          description: Счёт
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/InvoiceDetails
        '400':
          description: Некорректные поля счёта
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
