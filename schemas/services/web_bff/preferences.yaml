openapi: 3.0.3
info:
  title: Личные настройки
  version: '1'
paths:
  /api/preferences/list:
    post:
      summary: Личные настройки текущего пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organization_id:
                  type: string
                  format: uuid
              required:
              - organization_id
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - preferences
                - role_defaults
                properties:
                  preferences:
                    type: array
                    items:
                      $ref: components/schemas/preferences/models.yaml#/Preference
                  role_defaults:
                    type: array
                    items:
                      $ref: components/schemas/registry_defaults.yaml#/RegistryDefault
        '400':
          description: Некорректная настройка
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '403':
          description: Нет доступа к организации
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '409':
          description: Настройка изменена на другом устройстве
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '502':
          description: Сервис организаций недоступен
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
      security:
      - BrowserSession: []
  /api/preferences/save:
    post:
      summary: Сохранить личную настройку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/preferences/models.yaml#/SavePreferenceRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - preference
                properties:
                  preference:
                    $ref: components/schemas/preferences/models.yaml#/Preference
        '400':
          description: Некорректная настройка
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '403':
          description: Нет доступа к организации
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '409':
          description: Настройка изменена на другом устройстве
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '502':
          description: Сервис организаций недоступен
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
      security:
      - BrowserSession: []
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: broker_web_session
