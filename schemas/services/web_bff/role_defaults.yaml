openapi: 3.0.3
info:
  title: Исходные виды реестров по ролям
  version: '1'
paths:
  /api/preferences/roles/list:
    post:
      summary: Виды реестров и роли организации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organization_id:
                  type: string
                  format: uuid
              required:
              - organization_id
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: components/schemas/registry_defaults.yaml#/RegistryDefaultsResult
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '403':
          description: Нет доступа к организации или управлению ролями
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '409':
          description: Вид роли изменён другим пользователем
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
      security:
      - BrowserSession: []
  /api/preferences/roles/save:
    post:
      summary: Сохранить исходный вид реестра роли
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/registry_defaults.yaml#/SaveRegistryDefaultRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  item:
                    $ref: components/schemas/registry_defaults.yaml#/RegistryDefault
                required:
                - item
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '403':
          description: Нет доступа к организации или управлению ролями
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
        '409':
          description: Вид роли изменён другим пользователем
          content:
            application/json:
              schema:
                $ref: components/schemas/preferences/models.yaml#/ApiError
      security:
      - BrowserSession: []
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: broker_web_session
