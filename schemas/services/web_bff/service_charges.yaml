openapi: 3.0.3
info:
  title: Начисления
  version: '1'
paths:
  /api/v1/service-charges/save:
    post:
      summary: Создать или изменить начисление
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/finance/models.yaml#/SaveServiceChargeRequest
      responses:
        '200':
          description: Начисления
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  charge:
                    $ref: components/schemas/finance/models.yaml#/ServiceCharge
                required:
                - charge
        '400':
          description: Некорректные поля начисления
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к начислениям организации
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '404':
          description: Связанный объект не найден в организации
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '409':
          description: Конфликт редакции или архивный связанный объект
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '502':
          description: Не удалось проверить поставку, перевозку или стороны начисления
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
      security:
      - BrowserSession: []
  /api/v1/service-charges/list:
    post:
      summary: Начисления и итоги поставки или перевозки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/finance/models.yaml#/ListServiceChargesRequest
      responses:
        '200':
          description: Начисления
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: components/schemas/finance/models.yaml#/ServiceCharge
                  next_after:
                    type: string
                    format: uuid
                    nullable: true
                  summary:
                    $ref: components/schemas/finance/models.yaml#/ServiceChargeSummary
                  invoices:
                    type: array
                    items:
                      $ref: components/schemas/finance/models.yaml#/ServiceChargeInvoice
                required:
                - items
                - next_after
                - summary
                - invoices
        '400':
          description: Некорректные поля начисления
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к начислениям организации
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '404':
          description: Связанный объект не найден в организации
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '409':
          description: Конфликт редакции или архивный связанный объект
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '502':
          description: Не удалось проверить поставку, перевозку или стороны начисления
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
      security:
      - BrowserSession: []
  /api/v1/service-charges/get:
    post:
      summary: Получить услугу поставки или перевозки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/finance/models.yaml#/GetServiceChargeRequest
      responses:
        '200':
          description: Начисления
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  charge:
                    $ref: components/schemas/finance/models.yaml#/ServiceCharge
                required:
                - charge
        '400':
          description: Некорректные поля начисления
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к начислениям организации
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '404':
          description: Связанный объект не найден в организации
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '409':
          description: Конфликт редакции или архивный связанный объект
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
        '502':
          description: Не удалось проверить поставку, перевозку или стороны начисления
          content:
            application/json:
              schema:
                $ref: components/schemas/finance/models.yaml#/FinancialLabelError
      security:
      - BrowserSession: []
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: broker_web_session
