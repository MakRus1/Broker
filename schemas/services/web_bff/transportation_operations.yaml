openapi: 3.0.3
info:
  title: Операции создания перевозок
  version: '1'
paths:
  /api/v1/transportation-operations/create:
    post:
      summary: Создать операцию формирования перевозок
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/shipments/models.yaml#/CreateOperationRequest
      responses:
        '202':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - operation
                properties:
                  operation:
                    $ref: components/schemas/shipments/models.yaml#/CreationOperation
        '400':
          description: Некорректное тело запроса, значения полей или последовательность
            дат
          content:
            application/json:
              schema:
                $ref: components/schemas/shipments/models.yaml#/ApiError
        '401':
          description: Отсутствует действительный Bearer-токен
          content:
            application/json:
              schema:
                $ref: components/schemas/shipments/models.yaml#/ApiError
        '403':
          description: Нет требуемого права или доверенной привязки к клиенту
          content:
            application/json:
              schema:
                $ref: components/schemas/shipments/models.yaml#/ApiError
        '404':
          description: Объект не найден в доступном клиенте
          content:
            application/json:
              schema:
                $ref: components/schemas/shipments/models.yaml#/ApiError
        '409':
          description: Превышено доступное количество, изменена редакция позиции или
            ключ идемпотентности уже использован с другим запросом
          content:
            application/json:
              schema:
                $ref: components/schemas/shipments/models.yaml#/ApiError
        '503':
          description: Недоступны ключи проверки авторизации
          content:
            application/json:
              schema:
                $ref: components/schemas/shipments/models.yaml#/ApiError
  /api/v1/transportation-operations/get:
    post:
      summary: Состояние операции формирования перевозок
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/shipments/models.yaml#/GetOperationRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - operation
                properties:
                  operation:
                    $ref: components/schemas/shipments/models.yaml#/CreationOperation
        '400':
          description: Некорректное тело запроса, значения полей или последовательность
            дат
          content:
            application/json:
              schema:
                $ref: components/schemas/shipments/models.yaml#/ApiError
        '401':
          description: Отсутствует действительный Bearer-токен
          content:
            application/json:
              schema:
                $ref: components/schemas/shipments/models.yaml#/ApiError
        '403':
          description: Нет требуемого права или доверенной привязки к клиенту
          content:
            application/json:
              schema:
                $ref: components/schemas/shipments/models.yaml#/ApiError
        '404':
          description: Объект не найден в доступном клиенте
          content:
            application/json:
              schema:
                $ref: components/schemas/shipments/models.yaml#/ApiError
        '409':
          description: 'Объект изменен: expected_revision не совпадает с текущей редакцией'
          content:
            application/json:
              schema:
                $ref: components/schemas/shipments/models.yaml#/ApiError
        '503':
          description: Недоступны ключи проверки авторизации
          content:
            application/json:
              schema:
                $ref: components/schemas/shipments/models.yaml#/ApiError
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: broker_web
security:
- BrowserSession: []
