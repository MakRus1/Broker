openapi: 3.0.3
info:
  title: Перевозки
  version: '1'
paths:
  /api/v1/transportations/get:
    post:
      summary: Получить перевозку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/transportations/models.yaml#/GetTransportationRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - transportation
                properties:
                  transportation:
                    $ref: components/schemas/transportations/models.yaml#/Transportation
        '400':
          description: Некорректное тело запроса, значения полей или последовательность
            дат
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
        '401':
          description: Отсутствует действительный Bearer-токен
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
        '403':
          description: Нет требуемого права или доверенной привязки к клиенту
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
        '404':
          description: Объект не найден в доступном клиенте
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
        '409':
          description: 'Объект изменен: expected_revision не совпадает с текущей редакцией'
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
        '503':
          description: Недоступны ключи проверки авторизации
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
  /api/v1/transportations/list:
    post:
      summary: Список перевозок
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/transportations/models.yaml#/ListTransportationsRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: components/schemas/transportations/models.yaml#/Transportation
                  next_cursor:
                    $ref: components/schemas/transportations/models.yaml#/RegistryCursor
                required:
                - items
        '400':
          description: Некорректное тело запроса, значения полей или последовательность
            дат
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
        '401':
          description: Отсутствует действительный Bearer-токен
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
        '403':
          description: Нет требуемого права или доверенной привязки к клиенту
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
        '404':
          description: Объект не найден в доступном клиенте
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
        '409':
          description: 'Объект изменен: expected_revision не совпадает с текущей редакцией'
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
        '503':
          description: Недоступны ключи проверки авторизации
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
  /api/v1/transportations/create:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: components/schemas/transportations/models.yaml#/CreateTransportationRequest
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  transportation:
                    $ref: components/schemas/transportations/models.yaml#/Transportation
                required:
                - transportation
                type: object
          description: Успех
        '400':
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
          description: Некорректное тело запроса, значения полей или последовательность
            дат
        '401':
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
          description: Отсутствует действительный Bearer-токен
        '403':
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
          description: Нет требуемого права или доверенной привязки к клиенту
        '404':
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
          description: Объект не найден в доступном клиенте
        '409':
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
          description: 'Объект изменен: expected_revision не совпадает с текущей редакцией'
        '503':
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
          description: Недоступны ключи проверки авторизации
      summary: Создать перевозку вручную
  /api/v1/transportations/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: components/schemas/transportations/models.yaml#/UpdateTransportationRequest
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  transportation:
                    $ref: components/schemas/transportations/models.yaml#/Transportation
                required:
                - transportation
                type: object
          description: Успех
        '400':
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
          description: Некорректное тело запроса, значения полей или последовательность
            дат
        '401':
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
          description: Отсутствует действительный Bearer-токен
        '403':
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
          description: Нет требуемого права или доверенной привязки к клиенту
        '404':
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
          description: Объект не найден в доступном клиенте
        '409':
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
          description: 'Объект изменен: expected_revision не совпадает с текущей редакцией'
        '503':
          content:
            application/json:
              schema:
                $ref: components/schemas/transportations/models.yaml#/ApiError
          description: Недоступны ключи проверки авторизации
      summary: Изменить основные данные перевозки
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: broker_web
security:
- BrowserSession: []
