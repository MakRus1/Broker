components_manager:
    task_processors:
        main-task-processor:
            worker_threads: $worker-threads
        fs-task-processor:
            worker_threads: $worker-fs-threads
    default_task_processor: main-task-processor
    components:
        # OPENAPI_HANDLERS_BEGIN
        handler-api-configs-current:
            path: /api/configs/current
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-configs-drafts-approve:
            path: /api/configs/drafts/approve
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-configs-drafts-cancel:
            path: /api/configs/drafts/cancel
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-configs-drafts-create:
            path: /api/configs/drafts/create
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-configs-drafts-edit:
            path: /api/configs/drafts/edit
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-configs-drafts-events:
            path: /api/configs/drafts/events
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-configs-drafts-get:
            path: /api/configs/drafts/get
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-configs-drafts-list:
            path: /api/configs/drafts/list
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-configs-history:
            path: /api/configs/history
            method: GET
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-configs-list:
            path: /api/configs/list
            method: GET
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-logout:
            path: /api/logout
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0
        handler-api-session:
            path: /api/session
            method: GET
            task_processor: main-task-processor
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0
        handler-version:
            path: /version
            method: GET
            task_processor: main-task-processor
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0
        # OPENAPI_HANDLERS_END
        # SERVICE_CONFIG_BEGIN
        client-config_admin:
            base-url: $client-config_admin-base-url
        platform-readiness: {}
        platform-http-readiness: {}
        platform-config-delivery:
            load-enabled: $config-updates-enabled
        platform-config-readiness:
            rules: []
        dynamic-config:
            defaults:
                HTTP_CLIENT_CONNECTION_POOL_SIZE: 1000
                POSTGRES_DEFAULT_COMMAND_CONTROL:
                    network_timeout_ms: 750
                    statement_timeout_ms: 500
            updates-enabled: $config-updates-enabled
            fs-cache-path: $config-cache-path
            fs-task-processor: fs-task-processor
        dynamic-config-client:
            load-enabled: $config-updates-enabled
            config-url: $config-server-url
            http-client: dynamic-config-http-client
            service-name: admin_bff
            get-configs-overrides-for-service: false
            http-timeout: 1s
            http-retries: 1
        dynamic-config-client-updater:
            load-enabled: $config-updates-enabled
            config-settings: false
            first-update-fail-ok: true
            updates-sink: platform-config-delivery
            update-types: only-full
            deduplicate-update-types: none
            update-interval: 1s
        # SERVICE_CONFIG_END
        platform-auth:
            issuer: $auth-issuer
            audience: configs-admin
            roles-client: configs-admin
            jwks-url: $auth-jwks-url
            protected-prefix: /api/
            permissions: {}
            allow-http: $auth-allow-http
        auth-http-client:
            wait-for-dynamic-configs: false
        admin-sessions:
            origin: $admin-origin
            issuer: $auth-issuer
            token-url: $admin-token-url
            revoke-url: $admin-revoke-url
            secure-cookie: $admin-secure-cookie
            client-id: broker-admin
        admin-assets:
            dir: $admin-assets-dir
            update-period: 10s
        admin-browser-session: {}
        admin-login:
            path: /auth/login
            method: GET
            task_processor: main-task-processor
        admin-login-callback:
            path: /auth/callback
            method: GET
            task_processor: main-task-processor
        admin-assets-handler:
            path: /assets/*
            method: GET
            task_processor: main-task-processor
        admin-index:
            path: /
            method: GET
            task_processor: main-task-processor
        admin-index-html:
            path: /index.html
            method: GET
            task_processor: main-task-processor
        platform-http-telemetry:
            service-name: admin_bff
            environment: $environment
        platform-http-pipeline:
            final-middlewares: [admin-browser-session]
        server:
            middleware-pipeline-builder: platform-http-pipeline
            listener:
                port: $server-port
                task_processor: main-task-processor
                handler-defaults:
                    request_body_size_log_limit: 0
                    request_headers_size_log_limit: 0
                    response_data_size_log_limit: 0
            listener-monitor:
                address: 127.0.0.1
                port: $monitor-port
                task_processor: main-task-processor
                handler-defaults:
                    request_body_size_log_limit: 0
                    request_headers_size_log_limit: 0
                    response_data_size_log_limit: 0
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    format: json
                    overflow_behavior: discard
        tracing-manager-locator:
            incoming-format:
            - opentelemetry
            new-requests-format:
            - opentelemetry
            otel-trace-sampling-enabled: true
        grpc-client-common:
            blocking-task-processor: fs-task-processor
        grpc-otlp-factory:
            load-enabled: $otlp-enabled
            middlewares:
                grpc-client-logging:
                    enabled: false
        otlp-logger:
            load-enabled: $otlp-enabled
            endpoint: $otlp-endpoint
            endpoint#env: OTEL_EXPORTER_OTLP_ENDPOINT
            client-factory-name: grpc-otlp-factory
            service-name: admin_bff
            log-level: $logger-level
            sinks:
                logs: both
                tracing: both
            extra-attributes:
                service.version: 0.1.0
                deployment.environment.name: $environment
        grpc-client-logging:
            msg-log-level: none
        handler-server-monitor:
            path: /metrics
            method: GET
            task_processor: main-task-processor
            format: prometheus
            common-labels:
                service: admin_bff
                environment: $environment
        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            monitor-handler: true
        handler-ping-ready:
            path: /ping/ready
            method: GET
            task_processor: main-task-processor
            monitor-handler: true
        testsuite-support: {}
        congestion-control:
            fake-mode: true
        http-client: null
        http-client-core:
            fs-task-processor: fs-task-processor
        dns-client:
            fs-task-processor: fs-task-processor
        tests-control:
            load-enabled: $is-testing
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor
