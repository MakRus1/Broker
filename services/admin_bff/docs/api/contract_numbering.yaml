openapi: 3.0.3
info:
  title: Нумерация договоров
  version: '1'
paths:
  /api/admin/contracts/numbering/get:
    post:
      summary: Настройки нумерации договоров
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organization_id:
                  type: string
                  format: uuid
              required:
              - organization_id
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema:
                $ref: ../components/schemas/contracts/models.yaml#/ContractNumbering
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: ../components/schemas/finance/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: ../components/schemas/finance/models.yaml#/FinancialLabelError
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: ../components/schemas/finance/models.yaml#/FinancialLabelError
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: ../components/schemas/finance/models.yaml#/FinancialLabelError
        '409':
          description: Редакция изменилась
          content:
            application/json:
              schema:
                $ref: ../components/schemas/finance/models.yaml#/FinancialLabelError
        '503':
          description: Курс или сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: ../components/schemas/finance/models.yaml#/FinancialLabelError
      security:
      - BrowserSession: []
  /api/admin/contracts/numbering/update:
    post:
      summary: Изменить нумерацию договоров
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organization_id:
                  type: string
                  format: uuid
                expected_revision:
                  type: integer
                  format: int64
                number_template:
                  type: string
                  minLength: 1
                  maxLength: 128
                reset_number_yearly:
                  type: boolean
              required:
              - organization_id
              - expected_revision
              - number_template
              - reset_number_yearly
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema:
                $ref: ../components/schemas/contracts/models.yaml#/ContractNumbering
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: ../components/schemas/finance/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: ../components/schemas/finance/models.yaml#/FinancialLabelError
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: ../components/schemas/finance/models.yaml#/FinancialLabelError
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: ../components/schemas/finance/models.yaml#/FinancialLabelError
        '409':
          description: Редакция изменилась
          content:
            application/json:
              schema:
                $ref: ../components/schemas/finance/models.yaml#/FinancialLabelError
        '503':
          description: Курс или сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: ../components/schemas/finance/models.yaml#/FinancialLabelError
      security:
      - BrowserSession: []
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: broker_admin
