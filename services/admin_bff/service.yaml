version: 1
libraries:
- common
- auth
- browser
clients:
  config_admin:
    service: configs
    transport: http
  organizations:
    service: organizations
    transport: http
  shipments:
    service: shipments
    transport: http
  transportations:
    service: transportations
    transport: http
  transport_locations:
    service: transport_locations
    transport: http
  finance:
    service: finance
    transport: http
  contracts:
    service: contracts
    transport: http
  localization:
    service: localization
    transport: http
  sales:
    service: sales
    transport: http
dashboard:
  title: Broker · Административный BFF
  tags:
  - admin
http_logging:
  redact_fields:
    "/api/admin/organizations/members/*": [display_name, last_name, first_name, middle_name, query, cursor]
  exclude_paths:
  - /auth/**
  - /api/session
  - /api/logout
  - /api/admin/organizations/members/create
