openapi: 3.0.3
info:
  title: Управление конфигами
  version: '1'
paths:
  /admin/configs/current:
    post:
      summary: Получить конфиг для редактора
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - config_name
              properties:
                config_name:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - config_name
                - value
                - version
                properties:
                  config_name:
                    type: string
                  value:
                    type: object
                    additionalProperties: true
                  version:
                    type: integer
                    minimum: 0
                  active_draft_id:
                    type: integer
                    minimum: 1
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/configs/drafts/approve:
    post:
      summary: Подтвердить и атомарно опубликовать драфт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - id
              - actor
              - expected_version
              properties:
                id:
                  type: integer
                  minimum: 1
                actor:
                  type: string
                  minLength: 1
                  maxLength: 128
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigDraft'
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/configs/drafts/cancel:
    post:
      summary: Отменить активный драфт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - id
              - actor
              - expected_version
              properties:
                id:
                  type: integer
                  minimum: 1
                actor:
                  type: string
                  minLength: 1
                  maxLength: 128
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigDraft'
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/configs/drafts/create:
    post:
      summary: Создать валидный драфт одного конфига
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - actor
              - config_name
              - description
              - expected_config_version
              properties:
                actor:
                  type: string
                  minLength: 1
                  maxLength: 128
                config_name:
                  type: string
                  minLength: 1
                description:
                  type: string
                  minLength: 1
                  maxLength: 4096
                expected_config_version:
                  type: integer
                  minimum: 0
                value:
                  type: object
                  additionalProperties: true
                source_revision:
                  type: integer
                  minimum: 0
      description: Укажите ровно одно из value и source_revision. На конфиг разрешен
        один активный драфт.
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigDraft'
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/configs/drafts/edit:
    post:
      summary: Сохранить валидные правки драфта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - id
              - actor
              - expected_version
              properties:
                id:
                  type: integer
                  minimum: 1
                actor:
                  type: string
                  minLength: 1
                  maxLength: 128
                expected_version:
                  type: integer
                  minimum: 1
                value:
                  type: object
                  additionalProperties: true
                description:
                  type: string
                  minLength: 1
                  maxLength: 4096
      description: Укажите value и/или description. Невалидное значение не сохраняется.
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigDraft'
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/configs/drafts/events:
    post:
      summary: Получить историю драфта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - id
              properties:
                id:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DraftEvent'
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/configs/drafts/get:
    post:
      summary: Получить драфт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - id
              properties:
                id:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigDraft'
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/configs/drafts/list:
    post:
      summary: Получить страницу драфтов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties:
                config_name:
                  type: string
                before_id:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConfigDraft'
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/configs/history:
    get:
      summary: Получить историю опубликованных ревизий
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConfigRevision'
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/configs/list:
    get:
      summary: Получить каталог конфигов с версиями и активными драфтами
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConfigCatalogEntry'
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      properties:
        error:
          type: string
        message:
          type: string
    DraftStatus:
      type: string
      enum:
      - draft
      - published
      - cancelled
    ConfigDraft:
      type: object
      additionalProperties: false
      required:
      - id
      - config_name
      - author
      - description
      - version
      - status
      - base_version
      - base_value
      - value
      properties:
        id:
          type: integer
          minimum: 1
        config_name:
          type: string
        author:
          type: string
        description:
          type: string
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/DraftStatus'
        base_version:
          type: integer
          minimum: 0
        base_value:
          type: object
          additionalProperties: true
        value:
          type: object
          additionalProperties: true
        approved_by:
          type: string
        source_revision:
          type: integer
          minimum: 0
        published_revision:
          type: integer
          minimum: 0
    DraftSnapshot:
      type: object
      additionalProperties: false
      required:
      - config_name
      - author
      - description
      - version
      - status
      - base_version
      - base_value
      - value
      properties:
        config_name:
          type: string
        author:
          type: string
        description:
          type: string
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/DraftStatus'
        base_version:
          type: integer
          minimum: 0
        base_value:
          type: object
          additionalProperties: true
        value:
          type: object
          additionalProperties: true
        approved_by:
          type: string
        source_revision:
          type: integer
          minimum: 0
        published_revision:
          type: integer
          minimum: 0
    ConfigCatalogEntry:
      type: object
      additionalProperties: false
      required:
      - config_name
      - version
      - active_draft_id
      properties:
        config_name:
          type: string
        version:
          type: integer
          minimum: 0
        active_draft_id:
          type: integer
          minimum: 1
          nullable: true
    ConfigRevision:
      type: object
      additionalProperties: false
      required:
      - revision
      - created_at
      properties:
        revision:
          type: integer
          minimum: 0
        created_at:
          type: string
    DraftEvent:
      type: object
      additionalProperties: false
      required:
      - action
      - actor
      - snapshot
      - created_at
      properties:
        action:
          type: string
        actor:
          type: string
        snapshot:
          $ref: '#/components/schemas/DraftSnapshot'
        created_at:
          type: string
