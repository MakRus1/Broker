openapi: 3.0.3
info:
  title: Получить конфиг для редактора
  version: '1'
paths:
  /admin/configs/current:
    post:
      summary: Получить конфиг для редактора
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - config_name
              properties:
                config_name:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - config_name
                - value
                - version
                properties:
                  config_name:
                    type: string
                  value:
                    type: object
                    additionalProperties: true
                  version:
                    type: integer
                    minimum: 0
                  active_draft_id:
                    type: integer
                    minimum: 1
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '401':
          description: Требуется действительный access token
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '503':
          description: Ключи авторизации недоступны
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- AdminBearer: []
