openapi: 3.0.3
info:
  title: Сохранить валидные правки драфта
  version: '1'
paths:
  /admin/configs/drafts/edit:
    post:
      summary: Сохранить валидные правки драфта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - id
              - actor
              - expected_version
              properties:
                id:
                  type: integer
                  minimum: 1
                actor:
                  type: string
                  minLength: 1
                  maxLength: 128
                expected_version:
                  type: integer
                  minimum: 1
                value:
                  type: object
                  additionalProperties: true
                description:
                  type: string
                  minLength: 1
                  maxLength: 4096
      description: Укажите value и/или description. Невалидное значение не сохраняется.
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: ../../../../components/schemas/drafts.yaml#/ConfigDraft
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: ../../../../components/schemas/errors.yaml#/ApiError
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: ../../../../components/schemas/errors.yaml#/ApiError
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: ../../../../components/schemas/errors.yaml#/ApiError
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: ../../../../components/schemas/errors.yaml#/ApiError
