openapi: 3.0.3
info:
  title: Получить каталог конфигов с версиями и активными драфтами
  version: '1'
paths:
  /admin/configs/list:
    get:
      summary: Получить каталог конфигов с версиями и активными драфтами
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../../../components/schemas/configs.yaml#/ConfigCatalogEntry
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema:
                $ref: ../../../components/schemas/errors.yaml#/ApiError
