openapi: 3.0.3
info:
  title: Получить опубликованные значения конфигов
  version: '1'
paths:
  /configs/values:
    post:
      summary: Получить опубликованные значения конфигов
      requestBody:
        x-validate-content-type: false
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties:
                ids:
                  type: array
                  items: &id001
                    type: string
                updated_since: *id001
                service: *id001
                stage_name: *id001
                service_overrides:
                  type: array
                  items: *id001
                is_prestable:
                  type: boolean
                circuit: *id001
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - configs
                - revision
                - updated_at
                properties:
                  configs:
                    type: object
                    additionalProperties: true
                  revision:
                    type: integer
                    minimum: 0
                  updated_at: *id001
        '400':
          description: Невалидный запрос или конфиг
          content:
            application/json:
              schema: &id002
                type: object
                additionalProperties: false
                required:
                - error
                - message
                properties:
                  error: *id001
                  message: *id001
        '403':
          description: Операция запрещена
          content:
            application/json:
              schema: *id002
        '404':
          description: Драфт или ревизия не найдены
          content:
            application/json:
              schema: *id002
        '409':
          description: Конфликт версий или активный драфт
          content:
            application/json:
              schema: *id002
