version: 1
types:
  public.contract_v1:
    fields:
    - name: id
      type: uuid
    - name: own_company_id
      type: uuid
    - name: counterparty_id
      type: uuid
    - name: number
      type: text
    - name: contract_date
      type: date
    - name: valid_until
      type: date
      nullable: true
    - name: currency
      type: text
    - name: own_bank_account_id
      type: uuid
      nullable: true
    - name: counterparty_bank_account_id
      type: uuid
      nullable: true
    - name: payment_delay_days
      type: integer
      nullable: true
    - name: note
      type: text
      nullable: true
    - name: archived
      type: boolean
    - name: revision
      type: bigint
