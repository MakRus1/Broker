version: 1
libraries:
- common
postgresql:
  enabled: true
  cluster: counterparties
auth:
  audience: broker-logistics
  roles-client: broker-logistics
  protected-prefix: /api/
  permissions:
    /api/v1/counterparties/create: counterparties.write
    /api/v1/counterparties/list: counterparties.read
    /api/v1/counterparties/get: counterparties.read
    /api/v1/counterparties/update: counterparties.write
    /api/v1/counterparties/set-archived: counterparties.write
    /api/v1/counterparties/history: counterparties.read
    /api/v1/counterparties/lookup: counterparties.write
    /api/v1/counterparties/filter-values: counterparties.read
    /api/v1/counterparties/bank-accounts/list: counterparties.read_bank_accounts
    /api/v1/counterparties/bank-accounts/save: counterparties.write_bank_accounts
  organization-access: true
clients:
  organizations:
    service: organizations
    transport: http
