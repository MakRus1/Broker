        # OPENAPI_HANDLERS_END
        # SERVICE_CONFIG_BEGIN
        client-contracts:
            base-url: $client-contracts-base-url
        client-counterparties:
            base-url: $client-counterparties-base-url
        client-organizations:
            base-url: $client-organizations-base-url
        client-shipments:
            base-url: $client-shipments-base-url
        client-transportations:
            base-url: $client-transportations-base-url
        platform-readiness: {}
        platform-http-readiness: {}
        platform-config-delivery:
            load-enabled: $config-updates-enabled
        platform-config-readiness:
            rules: []
        postgres-finance:
            dbconnection: $pg-connection
            dbconnection#env: DB_CONNECTION
            blocking_task_processor: fs-task-processor
            dns_resolver: async
            sync-start: true
            connlimit_mode: manual
        platform-http-pipeline:
            extra-middlewares:
            - platform-auth
        platform-auth:
            issuer: $auth-issuer
            audience: broker-logistics
            roles-client: broker-logistics
            jwks-url: $auth-jwks-url
            protected-prefix: /api/
            allow-http: $auth-allow-http
            permissions:
                /api/admin/finance/settings/get: authenticated
                /api/admin/finance/settings/update: authenticated
                /api/v1/counterparty-reconciliation/get: finance.read_invoices
                /api/v1/counterparty-settlements/get: finance.read_invoices
                /api/v1/exchange-rates/get: finance.read_service_charges
                /api/v1/finance/settings/get: finance.read_service_charges
                /api/v1/financial-labels/filter-values: finance.read_financial_labels
                /api/v1/financial-labels/get: finance.read_financial_labels
                /api/v1/financial-labels/list: finance.read_financial_labels
                /api/v1/financial-labels/save: finance.write_financial_labels
                /api/v1/invoices/add-service-charge: finance.write_invoices
                /api/v1/invoices/candidates: finance.read_invoices
                /api/v1/invoices/detach-service-charge: finance.write_invoices
                /api/v1/invoices/filter-values: finance.read_invoices
                /api/v1/invoices/get: finance.read_invoices
                /api/v1/invoices/history: finance.read_invoices
                /api/v1/invoices/list: finance.read_invoices
                /api/v1/invoices/print-data: finance.read_invoices
                /api/v1/invoices/save: finance.write_invoices
                /api/v1/payments/filter-values: finance.read_payments
                /api/v1/payments/get: finance.read_payments
                /api/v1/payments/history: finance.read_payments
                /api/v1/payments/invoice-balance: finance.read_invoices
                /api/v1/payments/invoice-candidates: finance.read_payments
                /api/v1/payments/list: finance.read_payments
                /api/v1/payments/payment-candidates: finance.read_payments
                /api/v1/payments/save: finance.write_payments
                /api/v1/service-charges/filter-values: finance.read_service_charges
                /api/v1/service-charges/get: finance.read_service_charges
                /api/v1/service-charges/history: finance.read_service_charges
                /api/v1/service-charges/list: finance.read_service_charges
                /api/v1/service-charges/registry: finance.read_service_charges
                /api/v1/service-charges/save: finance.write_service_charges
            permission-dependencies:
                contracts.read:
                - counterparties.read
                counterparties.read_bank_accounts:
                - counterparties.read
                finance.read_invoices:
                - finance.read_service_charges
                finance.read_payments:
                - finance.read_invoices
                finance.read_service_charges:
                - shipments.read
                - transportations.read
                finance.write_financial_labels:
                - finance.read_financial_labels
                finance.write_invoices:
                - finance.read_invoices
                - contracts.read
                - counterparties.read
                - counterparties.read_bank_accounts
                finance.write_payments:
                - finance.read_payments
                - counterparties.read
                - counterparties.read_bank_accounts
                finance.write_service_charges:
                - finance.read_service_charges
                - finance.read_financial_labels
                - contracts.read
                - counterparties.read
                shipments.read:
                - organizations.read_employees
                - counterparties.read
            organization-url: $organization-access-url
        auth-http-client:
            wait-for-dynamic-configs: false
        dynamic-config:
            defaults:
                HTTP_CLIENT_CONNECTION_POOL_SIZE: 1000
                POSTGRES_DEFAULT_COMMAND_CONTROL:
                    network_timeout_ms: 750
                    statement_timeout_ms: 500
            updates-enabled: $config-updates-enabled
            fs-cache-path: $config-cache-path
            fs-task-processor: fs-task-processor
        dynamic-config-client:
            load-enabled: $config-updates-enabled
            config-url: $config-server-url
            http-client: dynamic-config-http-client
            service-name: finance
            get-configs-overrides-for-service: false
            http-timeout: 1s
            http-retries: 1
        dynamic-config-client-updater:
            load-enabled: $config-updates-enabled
            config-settings: false
            first-update-fail-ok: true
            updates-sink: platform-config-delivery
            update-types: only-full
            deduplicate-update-types: none
            update-interval: 1s
        # SERVICE_CONFIG_END
        platform-http-telemetry:
            service-name: finance
            environment: $environment
        server:
            middleware-pipeline-builder: platform-http-pipeline
            listener:
                port: $server-port
                task_processor: main-task-processor
                handler-defaults:
                    request_body_size_log_limit: 0
                    request_headers_size_log_limit: 0
                    response_data_size_log_limit: 0
            listener-monitor:
                address: 127.0.0.1
                port: $monitor-port
                task_processor: main-task-processor
                handler-defaults:
                    request_body_size_log_limit: 0
                    request_headers_size_log_limit: 0
                    response_data_size_log_limit: 0
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    format: json
                    overflow_behavior: discard
        tracing-manager-locator:
            incoming-format:
            - opentelemetry
            new-requests-format:
            - opentelemetry
            otel-trace-sampling-enabled: true
        grpc-client-common:
            blocking-task-processor: fs-task-processor
        grpc-otlp-factory:
            load-enabled: $otlp-enabled
            middlewares:
                grpc-client-logging:
                    enabled: false
        otlp-logger:
            load-enabled: $otlp-enabled
            endpoint: $otlp-endpoint
            endpoint#env: OTEL_EXPORTER_OTLP_ENDPOINT
            client-factory-name: grpc-otlp-factory
            service-name: finance
            log-level: $logger-level
            sinks:
                logs: both
                tracing: both
            extra-attributes:
                service.version: 0.1.0
                deployment.environment.name: $environment
        grpc-client-logging:
            msg-log-level: none
        handler-server-monitor:
            path: /metrics
            method: GET
            task_processor: main-task-processor
            format: prometheus
            common-labels:
                service: finance
                environment: $environment
        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            monitor-handler: true
        handler-ping-ready:
            path: /ping/ready
            method: GET
            task_processor: main-task-processor
            monitor-handler: true
        testsuite-support: {}
        congestion-control:
            fake-mode: true
        http-client: null
        http-client-core:
            fs-task-processor: fs-task-processor
        dns-client:
            fs-task-processor: fs-task-processor
        tests-control:
            load-enabled: $is-testing
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor
