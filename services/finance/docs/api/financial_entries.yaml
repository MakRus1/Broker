openapi: 3.0.3
info:
  title: Начисления
  version: '1'
paths:
  /api/v1/financial-entries/save:
    post:
      summary: Создать или изменить начисление
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/models.yaml#/SaveFinancialEntryRequest
      responses:
        '200':
          description: Начисления
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  entry:
                    $ref: ../components/schemas/models.yaml#/FinancialEntry
                required:
                - entry
        '400':
          description: Некорректные поля начисления
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к начислениям организации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/FinancialLabelError
        '404':
          description: Связанный объект не найден в организации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/FinancialLabelError
        '409':
          description: Конфликт редакции или архивный связанный объект
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/FinancialLabelError
        '502':
          description: Не удалось проверить поставку, перевозку или стороны начисления
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/FinancialLabelError
      security:
      - bearerAuth: []
  /api/v1/financial-entries/list:
    post:
      summary: Начисления и итоги поставки или перевозки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/models.yaml#/ListFinancialEntriesRequest
      responses:
        '200':
          description: Начисления
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../components/schemas/models.yaml#/FinancialEntry
                  next_after:
                    type: string
                    format: uuid
                    nullable: true
                  summary:
                    $ref: ../components/schemas/models.yaml#/EntrySummary
                required:
                - items
                - next_after
                - summary
        '400':
          description: Некорректные поля начисления
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/FinancialLabelError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/FinancialLabelError
        '403':
          description: Нет доступа к начислениям организации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/FinancialLabelError
        '404':
          description: Связанный объект не найден в организации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/FinancialLabelError
        '409':
          description: Конфликт редакции или архивный связанный объект
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/FinancialLabelError
        '502':
          description: Не удалось проверить поставку, перевозку или стороны начисления
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/FinancialLabelError
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
