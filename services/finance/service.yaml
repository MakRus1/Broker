version: 1
libraries:
- common
postgresql:
  enabled: true
  cluster: finance
auth:
  audience: broker-logistics
  roles-client: broker-logistics
  protected-prefix: /api/
  permissions:
    /api/v1/financial-labels/save: finance.write_financial_labels
    /api/v1/financial-labels/get: finance.read_financial_labels
    /api/v1/financial-labels/list: finance.read_financial_labels
    /api/v1/financial-labels/filter-values: finance.read_financial_labels
    /api/v1/service-charges/save: finance.write_service_charges
    /api/v1/service-charges/list: finance.read_service_charges
    /api/v1/invoices/save: finance.write_invoices
    /api/v1/invoices/get: finance.read_invoices
    /api/v1/invoices/list: finance.read_invoices
    /api/v1/invoices/candidates: finance.read_invoices
    /api/v1/invoices/filter-values: finance.read_invoices
    /api/v1/invoices/add-service-charge: finance.write_invoices
    /api/v1/service-charges/get: finance.read_service_charges
    /api/v1/invoices/detach-service-charge: finance.write_invoices
  organization-access: true
clients:
  shipments:
    service: shipments
    transport: http
  transportations:
    service: transportations
    transport: http
  counterparties:
    service: counterparties
    transport: http
  contracts:
    service: contracts
    transport: http
