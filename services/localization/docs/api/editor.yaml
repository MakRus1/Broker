openapi: 3.0.3
info:
  title: Редактор переводов
  version: '1'
paths:
  /api/admin/localization/get:
    post:
      summary: Переводы и черновик
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/localization.yaml#/GetEditorRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: ../components/schemas/localization.yaml#/CatalogEditorState
        '400':
          description: Некорректные переводы
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '403':
          description: Нет права управления переводами
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '409':
          description: Черновик изменён другим пользователем
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '502':
          description: Сервис прав недоступен
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
      security:
      - bearerAuth: []
  /api/admin/localization/save:
    post:
      summary: Сохранить черновик переводов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/localization.yaml#/SaveCatalogRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: ../components/schemas/localization.yaml#/CatalogEditorState
        '400':
          description: Некорректные переводы
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '403':
          description: Нет права управления переводами
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '409':
          description: Черновик изменён другим пользователем
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '502':
          description: Сервис прав недоступен
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
      security:
      - bearerAuth: []
  /api/admin/localization/publish:
    post:
      summary: Опубликовать черновик переводов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/localization.yaml#/PublishCatalogRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: ../components/schemas/localization.yaml#/CatalogEditorState
        '400':
          description: Некорректные переводы
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '403':
          description: Нет права управления переводами
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '409':
          description: Черновик изменён другим пользователем
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
        '502':
          description: Сервис прав недоступен
          content:
            application/json:
              schema:
                $ref: ../components/schemas/errors.yaml#/ApiError
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
