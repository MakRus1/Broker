version: 1
libraries:
- common
postgresql:
  enabled: true
grpc:
  enabled: false
clients:
  organizations:
    service: organizations
    transport: http
auth:
  audience: broker-logistics
  roles-client: broker-logistics
  protected-prefix: /api/
  permissions:
    /api/v1/localization/catalog: authenticated
    /api/admin/localization/get: localization.read
    /api/admin/localization/save: localization.write
    /api/admin/localization/publish: localization.write
  platform-access: true
http_logging:
  exclude_paths:
  - /api/v1/localization/**
