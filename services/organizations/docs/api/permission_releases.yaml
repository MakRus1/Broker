openapi: 3.0.3
info:
  title: Регистрация каталогов прав релизов
  version: '1'
paths:
  /api/internal/permissions/releases/upsert:
    post:
      summary: Зарегистрировать каталог прав версии перед раскаткой
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - owner
              - version
              - entries
              properties:
                owner:
                  type: string
                  minLength: 1
                  maxLength: 100
                version:
                  type: string
                  minLength: 1
                  maxLength: 1000
                entries:
                  type: array
                  maxItems: 1000
                  items:
                    $ref: '#/components/schemas/ReleasePermission'
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - success
                properties:
                  success:
                    type: boolean
        '400':
          description: Некорректный каталог
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '401':
          description: Требуется авторизация
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '403':
          description: Нет доступа к регистрации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '409':
          description: Каталог версии не зарегистрирован или конфликтует
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
      security:
      - bearerAuth: []
  /api/internal/permissions/releases/activate:
    post:
      summary: Активировать сохранённый каталог перед откатом
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - owner
              - version
              properties:
                owner:
                  type: string
                  minLength: 1
                  maxLength: 100
                version:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - success
                properties:
                  success:
                    type: boolean
        '400':
          description: Некорректный каталог
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '401':
          description: Требуется авторизация
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '403':
          description: Нет доступа к регистрации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '409':
          description: Каталог версии не зарегистрирован или конфликтует
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
      security:
      - bearerAuth: []
  /api/internal/permissions/releases/reconcile:
    post:
      summary: Сверить активные каталоги с работающими версиями
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - owner
              - versions
              properties:
                owner:
                  type: string
                  minLength: 1
                  maxLength: 100
                versions:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    minLength: 1
                    maxLength: 1000
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - success
                properties:
                  success:
                    type: boolean
        '400':
          description: Некорректный каталог
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '401':
          description: Требуется авторизация
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '403':
          description: Нет доступа к регистрации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '409':
          description: Каталог версии не зарегистрирован или конфликтует
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
      security:
      - bearerAuth: []
components:
  schemas:
    ReleasePermission:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      - group
      - scope
      - dependencies
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 200
        name:
          type: string
          minLength: 1
          maxLength: 500
        group:
          type: string
          minLength: 1
          maxLength: 200
        scope:
          type: string
          enum:
          - organization
          - platform
          - service
        dependencies:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 3
            maxLength: 200
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
