openapi: 3.0.3
info:
  title: Регистрация каталогов прав релизов
  version: '1'
paths:
  /api/internal/permissions/releases/upsert:
    post:
      summary: Зарегистрировать каталог прав версии перед раскаткой
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/PermissionReleasesUpsertRequest
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                $ref: ../components/schemas/operations.yaml#/PermissionReleaseResult
        '400':
          description: Некорректный каталог
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '401':
          description: Требуется авторизация
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '403':
          description: Нет доступа к регистрации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '409':
          description: Каталог версии не зарегистрирован или конфликтует
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
      security:
      - bearerAuth: []
  /api/internal/permissions/releases/activate:
    post:
      summary: Активировать сохранённый каталог перед откатом
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/PermissionReleasesActivateRequest
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                $ref: ../components/schemas/operations.yaml#/PermissionReleaseResult
        '400':
          description: Некорректный каталог
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '401':
          description: Требуется авторизация
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '403':
          description: Нет доступа к регистрации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '409':
          description: Каталог версии не зарегистрирован или конфликтует
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
      security:
      - bearerAuth: []
  /api/internal/permissions/releases/reconcile:
    post:
      summary: Сверить активные каталоги с работающими версиями
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/PermissionReleasesReconcileRequest
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                $ref: ../components/schemas/operations.yaml#/PermissionReleaseResult
        '400':
          description: Некорректный каталог
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '401':
          description: Требуется авторизация
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '403':
          description: Нет доступа к регистрации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
        '409':
          description: Каталог версии не зарегистрирован или конфликтует
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/ApiError
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
