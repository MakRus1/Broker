Organization:
  type: object
  additionalProperties: false
  required:
  - id
  - name
  - enabled
  - revision
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
      maxLength: 200
    enabled:
      type: boolean
    revision:
      type: integer
      format: int64
Member:
  type: object
  additionalProperties: false
  required:
  - subject
  - username
  - display_name
  - email
  - role
  - enabled
  - revision
  properties:
    subject:
      type: string
    username:
      type: string
    display_name:
      type: string
    email:
      type: string
    role:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[a-z][a-z0-9_-]*$
    enabled:
      type: boolean
    revision:
      type: integer
      format: int64
    last_name:
      type: string
      nullable: true
      maxLength: 100
    first_name:
      type: string
      nullable: true
      maxLength: 100
    middle_name:
      type: string
      nullable: true
      maxLength: 100
OrganizationAccess:
  type: object
  additionalProperties: false
  required:
  - organization_id
  - permissions
  properties:
    organization_id:
      type: string
      format: uuid
    permissions:
      type: array
      items:
        type: string
ApiError:
  type: object
  additionalProperties: false
  required:
  - error
  - message
  properties:
    error:
      type: string
    message:
      type: string
CreateOrganizationRequest:
  type: object
  additionalProperties: false
  required:
  - id
  - name
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
      maxLength: 200
UpdateOrganizationRequest:
  type: object
  additionalProperties: false
  required:
  - id
  - name
  - enabled
  - expected_revision
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
      maxLength: 200
    enabled:
      type: boolean
    expected_revision:
      type: integer
      minimum: 1
CreateMemberRequest:
  type: object
  additionalProperties: false
  required:
  - organization_id
  - request_id
  - username
  - email
  - temporary_password
  - role
  - last_name
  - first_name
  properties:
    organization_id:
      type: string
      format: uuid
    request_id:
      type: string
      format: uuid
    username:
      type: string
      minLength: 3
      maxLength: 100
      pattern: ^[a-zA-Z0-9][a-zA-Z0-9._@-]*$
    email:
      type: string
      minLength: 3
      maxLength: 254
    temporary_password:
      type: string
      minLength: 12
      maxLength: 256
    role:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[a-z][a-z0-9_-]*$
    last_name:
      type: string
      maxLength: 100
      minLength: 1
      nullable: false
    first_name:
      type: string
      maxLength: 100
      minLength: 1
      nullable: false
    middle_name:
      type: string
      maxLength: 100
      minLength: 1
      nullable: true
AddMemberRequest:
  type: object
  additionalProperties: false
  required:
  - organization_id
  - username
  - role
  properties:
    organization_id:
      type: string
      format: uuid
    username:
      type: string
      minLength: 1
      maxLength: 100
    role:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[a-z][a-z0-9_-]*$
UpdateMemberRequest:
  type: object
  additionalProperties: false
  required:
  - organization_id
  - subject
  - role
  - enabled
  - expected_revision
  properties:
    organization_id:
      type: string
      format: uuid
    subject:
      type: string
      minLength: 1
      maxLength: 128
    role:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[a-z][a-z0-9_-]*$
    enabled:
      type: boolean
    expected_revision:
      type: integer
      minimum: 1
OrganizationRole:
  type: object
  additionalProperties: false
  required:
  - id
  - name
  - description
  - permissions
  - revision
  properties:
    id:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[a-z][a-z0-9_-]*$
    name:
      type: string
      minLength: 1
      maxLength: 100
    description:
      type: string
      maxLength: 500
    permissions:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 100
      maxItems: 100
    revision:
      type: integer
      format: int64
      minimum: 1
Permission:
  type: object
  additionalProperties: false
  required:
  - id
  - name
  - group
  - dependencies
  properties:
    id:
      type: string
    name:
      type: string
    group:
      type: string
    dependencies:
      type: array
      items:
        type: string
PlatformAccess:
  type: object
  additionalProperties: false
  required:
  - permissions
  - revision
  properties:
    permissions:
      type: array
      items:
        type: string
    revision:
      type: integer
      minimum: 0
PlatformAccessResult:
  type: object
  additionalProperties: false
  required:
  - access
  - catalog
  properties:
    access:
      $ref: '#/PlatformAccess'
    catalog:
      type: array
      items:
        $ref: '#/Permission'
UpdateMemberProfileRequest:
  type: object
  additionalProperties: false
  properties:
    organization_id:
      type: string
      format: uuid
    last_name:
      type: string
      maxLength: 100
      minLength: 1
      nullable: false
    first_name:
      type: string
      maxLength: 100
      minLength: 1
      nullable: false
    middle_name:
      type: string
      maxLength: 100
      minLength: 1
      nullable: true
    subject:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
  required:
  - organization_id
  - subject
  - last_name
  - first_name
OrganizationEmployee:
  type: object
  additionalProperties: false
  properties:
    subject:
      type: string
    display_name:
      type: string
  required:
  - subject
  - display_name
OrganizationListCursor:
  type: object
  additionalProperties: false
  required:
  - id
  - value
  - scope
  properties:
    id:
      type: string
      format: uuid
    value:
      type: string
      maxLength: 1024
    scope:
      type: string
      pattern: ^[a-f0-9]{64}$
MemberListCursor:
  type: object
  additionalProperties: false
  required:
  - id
  - value
  - scope
  properties:
    id:
      type: string
      maxLength: 256
    value:
      type: string
      maxLength: 1024
    scope:
      type: string
      pattern: ^[a-f0-9]{64}$
ListOrganizationsRequest:
  type: object
  additionalProperties: false
  required: []
  properties:
    after:
      type: string
      format: uuid
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
    query:
      type: string
      maxLength: 200
    enabled:
      type: boolean
    sort:
      type: string
      enum:
      - id
      - name
      - enabled
      default: id
    descending:
      type: boolean
      default: false
    cursor:
      $ref: '#/OrganizationListCursor'
ListMembersRequest:
  type: object
  additionalProperties: false
  required:
  - organization_id
  properties:
    organization_id:
      type: string
      format: uuid
    after:
      type: string
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
    query:
      type: string
      maxLength: 200
    enabled:
      type: boolean
    role:
      type: string
      maxLength: 128
    sort:
      type: string
      enum:
      - subject
      - display_name
      - username
      - email
      - role
      - enabled
      default: subject
    descending:
      type: boolean
      default: false
    cursor:
      $ref: '#/MemberListCursor'
