RegistryDefault:
  type: object
  additionalProperties: false
  properties:
    role: &id001
      type: string
    registry:
      type: string
      pattern: ^(shipments|transportations|counterparties|contracts|service-charges|financial_labels|outgoing-invoices|incoming-invoices|receipt-payments|disbursement-payments)$
    value:
      type: object
      additionalProperties: true
    revision:
      type: integer
      minimum: 1
  required:
  - role
  - registry
  - value
  - revision
RegistryRole:
  type: object
  additionalProperties: false
  properties:
    id: *id001
    name: *id001
  required:
  - id
  - name
