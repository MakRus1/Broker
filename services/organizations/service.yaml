version: 1
libraries:
- common
postgresql:
  enabled: true
  cluster: organizations
auth:
  audience: broker-logistics
  roles-client: broker-logistics
  protected-prefix: /api/
  permissions:
    /api/internal/permissions/releases/upsert: organizations.register_permissions
    /api/internal/permissions/releases/activate: organizations.register_permissions
    /api/internal/permissions/releases/reconcile: organizations.register_permissions
    /api/organizations/access: authenticated
    /api/organizations/me: authenticated
    /api/admin/organizations/list: authenticated
    /api/admin/organizations/create: authenticated
    /api/admin/organizations/update: authenticated
    /api/admin/organizations/members/list: authenticated
    /api/admin/organizations/members/create: authenticated
    /api/admin/organizations/members/add: authenticated
    /api/admin/organizations/members/update: authenticated
    /api/admin/organizations/roles/list: authenticated
    /api/admin/organizations/roles/create: authenticated
    /api/admin/organizations/roles/update: authenticated
    /api/admin/platform-access/get: authenticated
    /api/admin/platform-access/update: authenticated
    /api/platform/access: authenticated
    /api/admin/organizations/members/update-profile: authenticated
    /api/organizations/employees/list: authenticated
    /api/organizations/administration/check: authenticated
    /api/organizations/membership/get: authenticated
    /api/organizations/registry-defaults/get: authenticated
    /api/organizations/registry-defaults/list: authenticated
    /api/organizations/registry-defaults/save: authenticated
  service-clients:
    organizations.register_permissions: permission-publisher
http_logging:
  exclude_paths:
  - /api/admin/organizations/members/create
service_accounts:
  publisher:
    client_id: permission-publisher
    audience: broker-logistics
    permissions:
    - organizations.register_permissions
    config:
      client_id: publisher-client-id
      client_secret: publisher-client-secret
      token_url: publisher-token-url
  users:
    client_id: organizations-manager
    keycloak_roles:
      realm-management:
      - manage-users
      - query-users
      - view-users
    config:
      client_id: users-client-id
      client_secret: users-client-secret
      token_url: users-token-url
