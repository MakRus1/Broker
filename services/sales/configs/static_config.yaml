components_manager:
    task_processors:
        main-task-processor:
            worker_threads: $worker-threads
        fs-task-processor:
            worker_threads: $worker-fs-threads
    default_task_processor: main-task-processor
    components:
        # OPENAPI_HANDLERS_BEGIN
        handler-api-admin-sales-settings-get:
            path: /api/admin/sales/settings/get
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-admin-sales-settings-update:
            path: /api/admin/sales/settings/update
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-cards-filter_values:
            path: /api/v1/sales/cards/filter-values
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-cards-get:
            path: /api/v1/sales/cards/get
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-cards-history:
            path: /api/v1/sales/cards/history
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-cards-list:
            path: /api/v1/sales/cards/list
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-cards-save:
            path: /api/v1/sales/cards/save
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-contacts-add:
            path: /api/v1/sales/contacts/add
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-contacts-history:
            path: /api/v1/sales/contacts/history
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-contacts-list:
            path: /api/v1/sales/contacts/list
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-contacts-update:
            path: /api/v1/sales/contacts/update
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-inquiries-create_shipment:
            path: /api/v1/sales/inquiries/create-shipment
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-inquiries-filter_values:
            path: /api/v1/sales/inquiries/filter-values
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-inquiries-get:
            path: /api/v1/sales/inquiries/get
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-inquiries-history:
            path: /api/v1/sales/inquiries/history
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-inquiries-list:
            path: /api/v1/sales/inquiries/list
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-inquiries-save:
            path: /api/v1/sales/inquiries/save
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-api-v1-sales-settings:
            path: /api/v1/sales/settings
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        # OPENAPI_HANDLERS_END
        # SERVICE_CONFIG_BEGIN
        client-counterparties:
            base-url: $client-counterparties-base-url
        client-notifications:
            base-url: $client-notifications-base-url
        client-organizations:
            base-url: $client-organizations-base-url
        client-shipments:
            base-url: $client-shipments-base-url
        client-transport_locations:
            base-url: $client-transport_locations-base-url
        platform-readiness: {}
        platform-http-readiness: {}
        platform-config-delivery:
            load-enabled: $config-updates-enabled
        platform-config-readiness:
            rules: []
        platform-outbox:
            postgres-component: postgres-sales
        postgres-sales:
            dbconnection: $pg-connection
            dbconnection#env: DB_CONNECTION
            blocking_task_processor: fs-task-processor
            dns_resolver: async
            sync-start: true
            connlimit_mode: manual
        platform-http-pipeline:
            extra-middlewares:
            - platform-auth
        platform-auth:
            issuer: $auth-issuer
            audience: broker-logistics
            roles-client: broker-logistics
            jwks-url: $auth-jwks-url
            protected-prefix: /api/
            allow-http: $auth-allow-http
            permissions:
                /api/admin/sales/settings/get: authenticated
                /api/admin/sales/settings/update: authenticated
                /api/v1/sales/cards/filter-values: sales.read
                /api/v1/sales/cards/get: sales.read
                /api/v1/sales/cards/history: sales.read
                /api/v1/sales/cards/list: sales.read
                /api/v1/sales/cards/save: sales.write
                /api/v1/sales/contacts/add: sales.write
                /api/v1/sales/contacts/history: sales.read
                /api/v1/sales/contacts/list: sales.read
                /api/v1/sales/contacts/update: sales.write
                /api/v1/sales/inquiries/create-shipment: sales.write
                /api/v1/sales/inquiries/filter-values: sales.read
                /api/v1/sales/inquiries/get: sales.read
                /api/v1/sales/inquiries/history: sales.read
                /api/v1/sales/inquiries/list: sales.read
                /api/v1/sales/inquiries/save: sales.write
                /api/v1/sales/settings: sales.read
            permission-dependencies:
                sales.read:
                - counterparties.read
                - organizations.read_employees
                sales.write:
                - sales.read
            organization-url: $organization-access-url
        auth-http-client:
            wait-for-dynamic-configs: false
        dynamic-config:
            defaults:
                HTTP_CLIENT_CONNECTION_POOL_SIZE: 1000
                POSTGRES_DEFAULT_COMMAND_CONTROL:
                    network_timeout_ms: 750
                    statement_timeout_ms: 500
            updates-enabled: $config-updates-enabled
            fs-cache-path: $config-cache-path
            fs-task-processor: fs-task-processor
        dynamic-config-client:
            load-enabled: $config-updates-enabled
            config-url: $config-server-url
            http-client: dynamic-config-http-client
            service-name: sales
            get-configs-overrides-for-service: false
            http-timeout: 1s
            http-retries: 1
        dynamic-config-client-updater:
            load-enabled: $config-updates-enabled
            config-settings: false
            first-update-fail-ok: true
            updates-sink: platform-config-delivery
            update-types: only-full
            deduplicate-update-types: none
            update-interval: 1s
        # SERVICE_CONFIG_END
        platform-http-telemetry:
            service-name: sales
            environment: $environment
        server:
            middleware-pipeline-builder: platform-http-pipeline
            listener:
                port: $server-port
                task_processor: main-task-processor
                handler-defaults:
                    request_body_size_log_limit: 0
                    request_headers_size_log_limit: 0
                    response_data_size_log_limit: 0
            listener-monitor:
                address: 127.0.0.1
                port: $monitor-port
                task_processor: main-task-processor
                handler-defaults:
                    request_body_size_log_limit: 0
                    request_headers_size_log_limit: 0
                    response_data_size_log_limit: 0
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    format: json
                    overflow_behavior: discard
        tracing-manager-locator:
            incoming-format:
            - opentelemetry
            new-requests-format:
            - opentelemetry
            otel-trace-sampling-enabled: true
        grpc-client-common:
            blocking-task-processor: fs-task-processor
        grpc-otlp-factory:
            load-enabled: $otlp-enabled
            middlewares:
                grpc-client-logging:
                    enabled: false
        otlp-logger:
            load-enabled: $otlp-enabled
            endpoint: $otlp-endpoint
            endpoint#env: OTEL_EXPORTER_OTLP_ENDPOINT
            client-factory-name: grpc-otlp-factory
            service-name: sales
            log-level: $logger-level
            sinks:
                logs: both
                tracing: both
            extra-attributes:
                service.version: 0.1.0
                deployment.environment.name: $environment
        grpc-client-logging:
            msg-log-level: none
        handler-server-monitor:
            path: /metrics
            method: GET
            task_processor: main-task-processor
            format: prometheus
            common-labels:
                service: sales
                environment: $environment
        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            monitor-handler: true
        handler-ping-ready:
            path: /ping/ready
            method: GET
            task_processor: main-task-processor
            monitor-handler: true
        shipment-dispatcher:
            load-enabled: $dispatcher-enabled
        service-token-provider:
            load-enabled: $dispatcher-enabled
            endpoint: $dispatcher-token-url
            client-id: $dispatcher-client-id
            client-secret: $dispatcher-client-secret
            timeout-ms: $dispatcher-token-timeout-ms
            max-retries: $dispatcher-token-max-retries
            allow-http: $auth-allow-http
        testsuite-support: {}
        congestion-control:
            fake-mode: true
        http-client: null
        http-client-core:
            fs-task-processor: fs-task-processor
        dns-client:
            fs-task-processor: fs-task-processor
        tests-control:
            load-enabled: $is-testing
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor
