openapi: 3.0.3
info:
  title: Добавить плановую позицию
  version: '1'
paths:
  /api/v1/shipment-items/add:
    post:
      summary: Добавить плановую позицию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                shipment_id:
                  type: string
                  format: uuid
                expected_revision:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                container_type_code:
                  type: string
                  pattern: ^[A-Z0-9]{2,16}$
                container_ownership:
                  type: string
                  enum:
                  - SOC
                  - COC
                planned_quantity:
                  type: integer
                  minimum: 1
                  maximum: 10000
                idempotency_key:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
              - shipment_id
              - expected_revision
              - container_type_code
              - container_ownership
              - planned_quantity
              - idempotency_key
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - item
                properties:
                  item:
                    $ref: ../components/schemas/models.yaml#/ShipmentItem
        '400':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
        '401':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
        '403':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
        '404':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
        '409':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
        '503':
          description: Ошибка запроса или зависимости
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- BearerAuth: []
