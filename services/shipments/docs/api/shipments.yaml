        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organization_id:
                  type: string
                  format: uuid
                expected_revision:
                  type: integer
                  format: int64
                  minimum: 0
                rules:
                  $ref: ../components/schemas/models.yaml#/ShipmentBusinessRules
              required:
              - organization_id
              - expected_revision
              - rules
