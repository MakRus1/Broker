      summary: Правила поставок организации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organization_id:
                  type: string
                  format: uuid
              required:
              - organization_id
      responses:
        '200':
          description: Результат операции
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ShipmentBusinessSettings
        '400':
