version: 1
types:
  public.shipment_item_v1:
    fields:
    - name: id
      type: uuid
    - name: revision
      type: bigint
    - name: shipment_id
      type: uuid
    - name: container_type
      type: text
    - name: ownership
      type: text
    - name: planned
      type: bigint
  public.creation_operation_v1:
    fields:
    - name: id
      type: uuid
    - name: item_id
      type: uuid
    - name: quantity
      type: bigint
    - name: status
      type: text
    - name: result
      type: jsonb
      nullable: true
  public.idempotent_result_v1:
    fields:
    - name: request
      type: jsonb
    - name: result
      type: jsonb
  public.shipment_dictionary_value_v1:
    fields:
    - name: dictionary
      type: text
    - name: code
      type: text
    - name: name
      type: text
  public.shipment_business_rules_v1:
    fields:
    - name: number_template
      type: text
    - name: reset_number_yearly
      type: boolean
    - name: statuses
      type: text[]
    - name: route_types
      type: text[]
    - name: planned_containers
      type: boolean
    - name: container_types
      type: text[]
  public.organization_shipment_rules_v1:
    fields:
    - name: rules
      type: public.shipment_business_rules_v1
    - name: revision
      type: bigint
  public.transport_location_v1:
    fields:
    - name: id
      type: uuid
    - name: kind
      type: text
    - name: name
      type: text
    - name: country_code
      type: text
    - name: code
      type: text
      nullable: true
  public.sea_details_v2:
    fields:
    - name: pol
      type: public.transport_location_v1
      nullable: true
    - name: pod
      type: public.transport_location_v1
      nullable: true
    - name: eta
      type: date
      nullable: true
    - name: departure_terminal_id
      type: uuid
      nullable: true
    - name: arrival_terminal_id
      type: uuid
      nullable: true
    - name: departure_date
      type: date
      nullable: true
    - name: vessel
      type: text
      nullable: true
    - name: voyage
      type: text
      nullable: true
  public.air_details_v2:
    fields:
    - name: carrier_id
      type: uuid
      nullable: true
    - name: origin_airport
      type: public.transport_location_v1
      nullable: true
    - name: destination_airport
      type: public.transport_location_v1
      nullable: true
    - name: eta
      type: date
      nullable: true
    - name: etd
      type: date
      nullable: true
    - name: departure_date
      type: date
      nullable: true
    - name: arrival_date
      type: date
      nullable: true
    - name: flight_number
      type: text
      nullable: true
  public.shipment_route_segment_v3:
    fields:
    - name: id
      type: uuid
    - name: type
      type: text
    - name: sea
      type: public.sea_details_v2
      nullable: true
    - name: air
      type: public.air_details_v2
      nullable: true
  public.shipment_v4:
    fields:
    - name: id
      type: uuid
    - name: revision
      type: bigint
    - name: number
      type: text
    - name: customer_id
      type: uuid
    - name: reference
      type: text
    - name: shipment_date
      type: date
    - name: recipient_id
      type: uuid
      nullable: true
    - name: logist
      type: text
      nullable: true
    - name: cargo_description
      type: text
      nullable: true
    - name: status
      type: text
    - name: incoterms
      type: text
      nullable: true
    - name: carriage_terms
      type: text
      nullable: true
    - name: loading
      type: text
      nullable: true
    - name: delivery_city
      type: text
      nullable: true
    - name: delivery_country
      type: text
      nullable: true
    - name: delivery_address
      type: text
      nullable: true
    - name: route_segments
      type: public.shipment_route_segment_v3[]
  public.shipment_data_v3:
    fields:
    - name: number
      type: text
    - name: customer_id
      type: uuid
    - name: reference
      type: text
    - name: shipment_date
      type: date
    - name: recipient_id
      type: uuid
      nullable: true
    - name: logist
      type: text
      nullable: true
    - name: cargo_description
      type: text
      nullable: true
    - name: status
      type: text
    - name: incoterms
      type: text
      nullable: true
    - name: carriage_terms
      type: text
      nullable: true
    - name: loading
      type: text
      nullable: true
    - name: delivery_city
      type: text
      nullable: true
    - name: delivery_country
      type: text
      nullable: true
    - name: delivery_address
      type: text
      nullable: true
    - name: route_segments
      type: public.shipment_route_segment_v3[]
  public.pending_container_creation_v1:
    fields:
    - name: id
      type: uuid
    - name: container_type
      type: text
    - name: ownership
      type: text
    - name: quantity
      type: bigint
