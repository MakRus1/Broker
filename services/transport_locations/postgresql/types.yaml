version: 1
types:
  public.transport_location_v1:
    fields:
    - name: id
      type: uuid
    - name: kind
      type: text
    - name: name
      type: text
    - name: country_code
      type: text
    - name: code
      type: text
      nullable: true
  public.railway_station_v1:
    fields:
    - name: esr_code
      type: text
    - name: name
      type: text
    - name: country_code
      type: text
  public.airport_source_v1:
    fields:
    - name: source_id
      type: bigint
    - name: location_id
      type: uuid
    - name: name
      type: text
    - name: country_code
      type: text
    - name: iata_code
      type: text
      nullable: true
    - name: icao_code
      type: text
      nullable: true
    - name: search_terms
      type: text
  public.sea_port_source_v1:
    fields:
    - name: locode
      type: text
    - name: location_id
      type: uuid
    - name: name
      type: text
    - name: country_code
      type: text
    - name: search_terms
      type: text
