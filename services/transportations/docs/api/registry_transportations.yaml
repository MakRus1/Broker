openapi: 3.0.3
info:
  title: Фильтры реестра
  version: '1'
paths:
  /api/v1/transportations/filter-values:
    post:
      summary: Поля реестра и значения фильтра с учётом остальных условий
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/FilterValuesRequest
      responses:
        '200':
          description: Каталог полей и очередная страница значений
          content:
            application/json:
              schema:
                $ref: ../components/schemas/operations.yaml#/RegistryValuesResult
        '400':
          description: Некорректные фильтры или неизвестное поле
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- BearerAuth: []
