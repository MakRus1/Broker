      summary: Создать перевозку вручную
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/models.yaml#/CreateTransportationRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
