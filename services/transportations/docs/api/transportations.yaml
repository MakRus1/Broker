  /api/v1/transportation-routes/usage:
    post:
      summary: Участки поставки с данными перевозок
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/models.yaml#/RouteUsageRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  segment_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                required:
                - segment_ids
        '400':
          description: Некорректное тело запроса, значения полей или последовательность дат
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
        '401':
          description: Отсутствует действительный Bearer-токен
          content:
