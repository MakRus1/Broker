openapi: 3.0.3
info:
  title: Перевозки
  version: '1'
paths:
  /api/v1/transportations/get:
    post:
      summary: Получить перевозку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/models.yaml#/GetTransportationRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - transportation
                properties:
                  transportation:
                    $ref: ../components/schemas/models.yaml#/Transportation
        '400':
          description: Некорректное тело запроса, значения полей или последовательность дат
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
        '401':
          description: Отсутствует действительный Bearer-токен
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
        '403':
          description: Нет требуемого права или доверенной привязки к клиенту
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
        '404':
          description: Объект не найден в доступном клиенте
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
        '409':
          description: 'Объект изменен: expected_revision не совпадает с текущей редакцией'
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
        '503':
          description: Недоступны ключи проверки авторизации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/models.yaml#/ApiError
  /api/v1/transportations/list:
    post:
      summary: Список перевозок
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/models.yaml#/ListTransportationsRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../components/schemas/models.yaml#/Transportation
                required:
                - items
        '400':
          description: Некорректное тело запроса, значения полей или последовательность дат
          content:
