ApiError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
CreationOperation:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    quantity:
      type: integer
      minimum: 1
      maximum: 100
    status:
      $ref: '#/OperationStatus'
    transportation_ids:
      type: array
      items:
        type: string
        format: uuid
    rejection_code:
      type: string
      maxLength: 128
  required:
  - id
  - item_id
  - quantity
  - status
  - transportation_ids
Transportation:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    shipment_id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    operation_id:
      type: string
      format: uuid
    container_type_code:
      type: string
      minLength: 1
      maxLength: 16
    container_ownership:
      $ref: '#/ContainerOwnership'
    route_segments:
      type: array
      items:
        $ref: '#/RouteSegment'
    type:
      $ref: '#/TransportationType'
    hazardous:
      type: boolean
    incoterms:
      type: string
    loading:
      type: string
    carriage_terms:
      type: string
    container_number:
      type: string
      maxLength: 64
      description: Фактический номер контейнера. Необязателен; нестандартный формат
        не запрещает сохранение.
  required:
  - id
  - revision
  - shipment_id
  - route_segments
  - type
  - hazardous
RouteSegment:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    mode:
      $ref: '#/TransportMode'
    origin:
      $ref: '#/RouteSegmentOrigin'
    destination:
      $ref: '#/RouteSegmentDestination'
    contractor_id:
      type: string
      format: uuid
    planned_departure_at:
      type: string
      format: date-time
    planned_arrival_at:
      type: string
      format: date-time
    actual_departure_at:
      type: string
      format: date-time
    actual_arrival_at:
      type: string
      format: date-time
    inherited:
      type: boolean
      description: Участок присутствует в текущем маршруте поставки. Отсутствующие
        старые участки доступны только для просмотра.
    rail:
      $ref: '#/RailDetails'
  required:
  - id
  - mode
RouteSegmentOrigin:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 256
    country_code:
      type: string
      pattern: ^(|[A-Z]{2})$
  required:
  - name
  - country_code
RouteSegmentDestination:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 256
    country_code:
      type: string
      pattern: ^(|[A-Z]{2})$
  required:
  - name
  - country_code
SetRouteSegmentsItem:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    mode:
      $ref: '#/TransportMode'
    origin:
      $ref: '#/SetRouteSegmentsItemOrigin'
    destination:
      $ref: '#/SetRouteSegmentsItemDestination'
    contractor_id:
      type: string
      format: uuid
    planned_departure_at:
      type: string
      format: date-time
    planned_arrival_at:
      type: string
      format: date-time
    rail:
      $ref: '#/RailDetails'
  required:
  - id
  - mode
SetRouteSegmentsItemOrigin:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 256
    country_code:
      type: string
      pattern: ^(|[A-Z]{2})$
  required:
  - name
  - country_code
SetRouteSegmentsItemDestination:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 256
    country_code:
      type: string
      pattern: ^(|[A-Z]{2})$
  required:
  - name
  - country_code
ContainerOwnership:
  type: string
  enum:
  - SOC
  - COC
OperationStatus:
  type: string
  enum:
  - pending
  - succeeded
  - rejected
TransportMode:
  type: string
  enum:
  - sea
  - international_rail
  - international_road
  - rail
  - road
  - pickup
  - air
EventKind:
  type: string
  enum:
  - departure
  - arrival
GetTransportationRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
  required:
  - transportation_id
ListTransportationsRequest:
  type: object
  additionalProperties: false
  properties:
    shipment_id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
    after:
      type: string
      format: uuid
  required: []
EnsureCreatedRequest:
  type: object
  additionalProperties: false
  properties:
    operation_id:
      type: string
      format: uuid
    shipment_id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    organization_id:
      type: string
      format: uuid
    quantity:
      type: integer
      minimum: 1
      maximum: 100
    schema_version:
      type: integer
      enum:
      - 1
    container_type_code:
      type: string
      pattern: ^[A-Z0-9]{2,16}$
    container_ownership:
      $ref: '#/ContainerOwnership'
  required:
  - operation_id
  - shipment_id
  - item_id
  - organization_id
  - quantity
  - schema_version
  - container_type_code
  - container_ownership
SetRouteRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    route_segments:
      type: array
      minItems: 1
      maxItems: 32
      items:
        $ref: '#/SetRouteSegmentsItem'
  required:
  - transportation_id
  - expected_revision
  - route_segments
RecordActualRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    route_segment_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    event_kind:
      $ref: '#/EventKind'
    occurred_at:
      type: string
      format: date-time
  required:
  - transportation_id
  - route_segment_id
  - expected_revision
  - event_kind
  - occurred_at
CorrectActualRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    route_segment_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    event_kind:
      $ref: '#/EventKind'
    occurred_at:
      type: string
      format: date-time
    reason:
      type: string
      minLength: 1
      maxLength: 2048
  required:
  - transportation_id
  - route_segment_id
  - expected_revision
  - event_kind
  - occurred_at
  - reason
ListHistoryRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    before:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
  required:
  - transportation_id
TransportationEvent:
  type: object
  additionalProperties: false
  properties:
    id:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    action:
      type: string
    actor:
      type: string
    actor_name:
      type: string
    occurred_at:
      type: string
      format: date-time
    reason:
      type: string
    route_segment_id:
      type: string
      format: uuid
    event_kind:
      $ref: '#/EventKind'
    revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    route_segments:
      type: array
      items:
        $ref: '#/RouteSegment'
  required:
  - id
  - action
  - actor
  - occurred_at
  - revision
  - route_segments
TransportationType:
  type: string
  enum:
  - consolidated
  - container
  - air
  - oversized
  - rail
  - vessel
CreateTransportationRequest:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    shipment_id:
      type: string
      format: uuid
    type:
      $ref: '#/TransportationType'
    hazardous:
      type: boolean
    container_type_code:
      type: string
      pattern: ^[A-Z0-9]{2,16}$
    container_ownership:
      $ref: '#/ContainerOwnership'
    container_number:
      type: string
      maxLength: 64
      description: Фактический номер контейнера. Необязателен; нестандартный формат
        не запрещает сохранение.
  required:
  - id
  - shipment_id
  - type
  - hazardous
UpdateTransportationRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    type:
      $ref: '#/TransportationType'
    hazardous:
      type: boolean
    container_type_code:
      type: string
      pattern: ^[A-Z0-9]{2,16}$
    container_ownership:
      $ref: '#/ContainerOwnership'
    container_number:
      type: string
      maxLength: 64
      description: Фактический номер контейнера. Необязателен; нестандартный формат
        не запрещает сохранение.
  required:
  - transportation_id
  - expected_revision
  - type
  - hazardous
RouteUsageRequest:
  type: object
  additionalProperties: false
  properties:
    shipment_id:
      type: string
      format: uuid
  required:
  - shipment_id
RailwayStation:
  type: object
  additionalProperties: false
  properties:
    esr_code:
      type: string
      pattern: ^[0-9]{6}$
    name:
      type: string
      minLength: 1
      maxLength: 256
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
  required:
  - esr_code
  - name
  - country_code
RailDetails:
  type: object
  additionalProperties: false
  properties:
    origin_station:
      $ref: '#/RailwayStation'
    destination_station:
      $ref: '#/RailwayStation'
    etd:
      type: string
      format: date
    eta:
      type: string
      format: date
    departure_date:
      type: string
      format: date
    arrival_date:
      type: string
      format: date
    unloading_date:
      type: string
      format: date
