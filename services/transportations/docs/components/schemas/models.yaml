ApiError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
CreationOperation:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    quantity:
      type: integer
      minimum: 1
      maximum: 100
    status:
      $ref: '#/OperationStatus'
    transportation_ids:
      type: array
      items:
        type: string
        format: uuid
    rejection_code:
      type: string
      maxLength: 128
  required:
  - id
  - item_id
  - quantity
  - status
  - transportation_ids
Transportation:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    shipment_id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    operation_id:
      type: string
      format: uuid
    container_type_code:
      type: string
      minLength: 1
      maxLength: 16
    container_ownership:
      $ref: '#/ContainerOwnership'
    route_segments:
      type: array
      items:
        $ref: '#/RouteSegment'
    type:
      $ref: '#/TransportationType'
    hazardous:
      type: boolean
    incoterms:
      type: string
    loading:
      type: string
    carriage_terms:
      type: string
    container_number:
      type: string
      maxLength: 64
      description: Фактический номер контейнера. Необязателен; нестандартный формат
        не запрещает сохранение.
  required:
  - id
  - revision
  - shipment_id
  - route_segments
  - type
  - hazardous
RouteSegment:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    mode:
      $ref: '#/TransportMode'
    origin:
      $ref: '#/RouteSegmentOrigin'
    destination:
      $ref: '#/RouteSegmentDestination'
    contractor_id:
      type: string
      format: uuid
    planned_departure_at:
      type: string
      format: date-time
    planned_arrival_at:
      type: string
      format: date-time
    actual_departure_at:
      type: string
      format: date-time
    actual_arrival_at:
      type: string
      format: date-time
    inherited:
      type: boolean
      description: Участок присутствует в текущем маршруте поставки. Отсутствующие
        старые участки доступны только для просмотра.
    rail:
      $ref: '#/RailDetails'
    sea:
      $ref: '#/SeaDetails'
    air:
      $ref: '#/AirDetails'
    international_road:
      $ref: '#/InternationalRoadDetails'
    pickup:
      $ref: '#/PickupDetails'
  required:
  - id
  - mode
RouteSegmentOrigin:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 256
    country_code:
      type: string
      pattern: ^(|[A-Z]{2})$
  required:
  - name
  - country_code
RouteSegmentDestination:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 256
    country_code:
      type: string
      pattern: ^(|[A-Z]{2})$
  required:
  - name
  - country_code
SetRouteSegmentsItem:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    mode:
      $ref: '#/TransportMode'
    origin:
      $ref: '#/SetRouteSegmentsItemOrigin'
    destination:
      $ref: '#/SetRouteSegmentsItemDestination'
    contractor_id:
      type: string
      format: uuid
    planned_departure_at:
      type: string
      format: date-time
    planned_arrival_at:
      type: string
      format: date-time
    rail:
      $ref: '#/RailDetails'
    international_road:
      $ref: '#/InternationalRoadDetails'
    pickup:
      $ref: '#/PickupDetails'
  required:
  - id
  - mode
SetRouteSegmentsItemOrigin:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 256
    country_code:
      type: string
      pattern: ^(|[A-Z]{2})$
  required:
  - name
  - country_code
SetRouteSegmentsItemDestination:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 256
    country_code:
      type: string
      pattern: ^(|[A-Z]{2})$
  required:
  - name
  - country_code
ContainerOwnership:
  type: string
  enum:
  - SOC
  - COC
OperationStatus:
  type: string
  enum:
  - pending
  - succeeded
  - rejected
TransportMode:
  type: string
  enum:
  - sea
  - international_rail
  - international_road
  - rail
  - road
  - pickup
  - air
EventKind:
  type: string
  enum:
  - departure
  - arrival
GetTransportationRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
  required:
  - transportation_id
ListTransportationsRequest:
  type: object
  additionalProperties: false
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
    after:
      type: string
      format: uuid
    sort:
      type: string
      default: id
      minLength: 1
      maxLength: 64
    descending:
      type: boolean
      default: false
    cursor:
      $ref: '#/RegistryCursor'
    filters:
      type: array
      maxItems: 32
      items:
        $ref: '#/RegistryFilter'
    route_filters:
      type: array
      maxItems: 8
      items:
        $ref: '#/RouteFilterGroup'
  required: []
EnsureCreatedRequest:
  type: object
  additionalProperties: false
  properties:
    operation_id:
      type: string
      format: uuid
    shipment_id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    organization_id:
      type: string
      format: uuid
    quantity:
      type: integer
      minimum: 1
      maximum: 100
    schema_version:
      type: integer
      enum:
      - 1
    container_type_code:
      type: string
      pattern: ^[A-Z0-9]{2,16}$
    container_ownership:
      $ref: '#/ContainerOwnership'
  required:
  - operation_id
  - shipment_id
  - item_id
  - organization_id
  - quantity
  - schema_version
  - container_type_code
  - container_ownership
SetRouteRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    route_segments:
      type: array
      minItems: 1
      maxItems: 32
      items:
        $ref: '#/SetRouteSegmentsItem'
  required:
  - transportation_id
  - expected_revision
  - route_segments
RecordActualRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    route_segment_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    event_kind:
      $ref: '#/EventKind'
    occurred_at:
      type: string
      format: date-time
  required:
  - transportation_id
  - route_segment_id
  - expected_revision
  - event_kind
  - occurred_at
CorrectActualRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    route_segment_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    event_kind:
      $ref: '#/EventKind'
    occurred_at:
      type: string
      format: date-time
    reason:
      type: string
      minLength: 1
      maxLength: 2048
  required:
  - transportation_id
  - route_segment_id
  - expected_revision
  - event_kind
  - occurred_at
  - reason
ListHistoryRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    before:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
  required:
  - transportation_id
TransportationEvent:
  type: object
  additionalProperties: false
  properties:
    id:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    action:
      type: string
    actor:
      type: string
    actor_name:
      type: string
    occurred_at:
      type: string
      format: date-time
    reason:
      type: string
    route_segment_id:
      type: string
      format: uuid
    event_kind:
      $ref: '#/EventKind'
    revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    route_segments:
      type: array
      items:
        $ref: '#/RouteSegment'
  required:
  - id
  - action
  - actor
  - occurred_at
  - revision
  - route_segments
TransportationType:
  type: string
  enum:
  - consolidated
  - container
  - air
  - oversized
  - rail
  - vessel
CreateTransportationRequest:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    shipment_id:
      type: string
      format: uuid
    type:
      $ref: '#/TransportationType'
    hazardous:
      type: boolean
    container_type_code:
      type: string
      pattern: ^[A-Z0-9]{2,16}$
    container_ownership:
      $ref: '#/ContainerOwnership'
    container_number:
      type: string
      maxLength: 64
      description: Фактический номер контейнера. Необязателен; нестандартный формат
        не запрещает сохранение.
  required:
  - id
  - shipment_id
  - type
  - hazardous
UpdateTransportationRequest:
  type: object
  additionalProperties: false
  properties:
    transportation_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    type:
      $ref: '#/TransportationType'
    hazardous:
      type: boolean
    container_type_code:
      type: string
      pattern: ^[A-Z0-9]{2,16}$
    container_ownership:
      $ref: '#/ContainerOwnership'
    container_number:
      type: string
      maxLength: 64
      description: Фактический номер контейнера. Необязателен; нестандартный формат
        не запрещает сохранение.
  required:
  - transportation_id
  - expected_revision
  - type
  - hazardous
RouteUsageRequest:
  type: object
  additionalProperties: false
  properties:
    shipment_id:
      type: string
      format: uuid
  required:
  - shipment_id
RailwayStation:
  type: object
  additionalProperties: false
  properties:
    esr_code:
      type: string
      pattern: ^[0-9]{6}$
    name:
      type: string
      minLength: 1
      maxLength: 256
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
    id:
      type: string
      format: uuid
    uic_code:
      type: string
      pattern: ^[0-9]{7}$
    esr_source:
      type: string
      description: 'Источник ЕСР: manual — ручной ввод, osm_hint — неподтверждённая
        подсказка OSM'
  required:
  - id
  - name
  - country_code
RailDetails:
  type: object
  additionalProperties: false
  properties:
    origin_station:
      $ref: '#/RailwayStation'
    destination_station:
      $ref: '#/RailwayStation'
    etd:
      type: string
      format: date
    eta:
      type: string
      format: date
    departure_date:
      type: string
      format: date
    arrival_date:
      type: string
      format: date
    unloading_date:
      type: string
      format: date
TransportLocationKind:
  type: string
  enum:
  - sea_port
  - airport
TransportLocation:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    kind:
      $ref: '#/TransportLocationKind'
    name:
      type: string
      minLength: 1
      maxLength: 256
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
    code:
      type: string
      minLength: 1
      maxLength: 16
  required:
  - id
  - kind
  - name
  - country_code
SeaDetails:
  type: object
  additionalProperties: false
  properties:
    pol:
      $ref: '#/TransportLocation'
    pod:
      $ref: '#/TransportLocation'
    eta:
      type: string
      format: date
    departure_terminal_id:
      type: string
      format: uuid
    arrival_terminal_id:
      type: string
      format: uuid
    departure_date:
      type: string
      format: date
    vessel:
      type: string
      maxLength: 128
    voyage:
      type: string
      maxLength: 128
  required: []
AirDetails:
  type: object
  additionalProperties: false
  properties:
    carrier_id:
      type: string
      format: uuid
    origin_airport:
      $ref: '#/TransportLocation'
    destination_airport:
      $ref: '#/TransportLocation'
    eta:
      type: string
      format: date
    etd:
      type: string
      format: date
    departure_date:
      type: string
      format: date
    arrival_date:
      type: string
      format: date
    flight_number:
      type: string
      maxLength: 64
  required: []
InternationalRoadDetails:
  type: object
  additionalProperties: false
  properties:
    loading_terminal_id:
      type: string
      format: uuid
    planned_loading_date:
      type: string
      format: date
    planned_unloading_date:
      type: string
      format: date
    departure_date:
      type: string
      format: date
    unloading_date:
      type: string
      format: date
    vehicle_number:
      type: string
      maxLength: 64
    trailer_number:
      type: string
      maxLength: 64
    cmr_number:
      type: string
      maxLength: 128
PickupDetails:
  type: object
  additionalProperties: false
  properties:
    planned_pickup_date:
      type: string
      format: date
    planned_delivery_date:
      type: string
      format: date
    pickup_date:
      type: string
      format: date
    delivery_date:
      type: string
      format: date
    delivery_city:
      type: string
      maxLength: 256
    delivery_country:
      type: string
      pattern: ^(|[A-Z]{2})$
    delivery_address:
      type: string
      maxLength: 1024
    driver:
      type: string
      maxLength: 256
    vehicle_number:
      type: string
      maxLength: 64
    ttn_date:
      type: string
      format: date
RegistryCursor:
  type: object
  additionalProperties: false
  required:
  - id
  - value
  - scope
  properties:
    id:
      type: string
      format: uuid
    value:
      type: string
      maxLength: 256
    scope:
      type: string
      pattern: ^[a-f0-9]{64}$
StationListCursor:
  type: object
  additionalProperties: false
  required:
  - id
  - value
  - scope
  properties:
    id:
      type: string
      format: uuid
    value:
      type: string
      maxLength: 1024
    scope:
      type: string
      pattern: ^[a-f0-9]{64}$
ListStationsRequest:
  type: object
  additionalProperties: false
  properties:
    query:
      type: string
      maxLength: 200
    after:
      type: string
      format: uuid
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
    sort:
      type: string
      enum:
      - esr_code
      - name
      - country_code
      default: name
    descending:
      type: boolean
      default: false
    cursor:
      $ref: '#/StationListCursor'
  required: []
ContainerFact:
  type: object
  additionalProperties: false
  required:
  - quantity
  properties:
    container_type_code:
      type: string
    container_ownership:
      $ref: '#/ContainerOwnership'
    quantity:
      type: integer
      minimum: 0
OperationFact:
  type: object
  additionalProperties: false
  required:
  - operation_id
  - created_quantity
  properties:
    operation_id:
      type: string
      format: uuid
    created_quantity:
      type: integer
      minimum: 0
RegistryFilter:
  type: object
  additionalProperties: false
  required:
  - field
  properties:
    field:
      type: string
      minLength: 1
      maxLength: 64
    values:
      type: array
      maxItems: 200
      uniqueItems: true
      items:
        type: string
        maxLength: 2000
    query:
      type: string
      maxLength: 256
    date_from:
      type: string
      format: date
    date_to:
      type: string
      format: date
    empty:
      type: boolean
RegistryField:
  type: object
  additionalProperties: false
  required:
  - id
  - label
  - kind
  - sortable
  - case_insensitive
  properties:
    id:
      type: string
    label:
      type: string
    kind:
      type: string
      enum:
      - values
      - set
      - date
      - boolean
    sortable:
      type: boolean
    lookup:
      type: string
    case_insensitive:
      type: boolean
RegistryValue:
  type: object
  additionalProperties: false
  required:
  - value
  - label
  properties:
    value:
      type: string
    label:
      type: string

RouteFilterGroup:
  type: object
  additionalProperties: false
  required: [filters]
  properties:
    filters:
      type: array
      minItems: 1
      maxItems: 32
      items:
        $ref: '#/RegistryFilter'

ShipmentRouteProjection:
  type: object
  additionalProperties: false
  required: [organization_id, shipment_id, revision, route_segments]
  properties:
    organization_id:
      type: string
      format: uuid
    shipment_id:
      type: string
      format: uuid
    revision:
      type: integer
      format: int64
      minimum: 1
    route_segments:
      type: array
      maxItems: 64
      items:
        $ref: '#/ProjectedRouteSegment'
ProjectedRouteSegment:
  type: object
  additionalProperties: false
  required: [id, type]
  properties:
    id:
      type: string
      format: uuid
    type:
      type: string
    sea:
      $ref: '#/SeaDetails'
    air:
      $ref: '#/AirDetails'

FilterValuesScope:
  type: string
  default: registry
  enum:
  - registry
  - route
