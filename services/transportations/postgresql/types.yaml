version: 1
types:
  public.transportation_v1:
    fields:
    - &id001
      name: id
      type: uuid
    - &id002
      name: revision
      type: bigint
    - &id003
      name: shipment_id
      type: uuid
    - &id004
      name: item_id
      type: uuid
    - &id005
      name: operation_id
      type: uuid
    - &id006
      name: container_type
      type: text
    - &id007
      name: ownership
      type: text
  public.saved_command_v1:
    fields:
    - name: payload
      type: jsonb
    - name: result
      type: jsonb
  public.transportation_leg_v1:
    fields:
    - name: transportation_id
      type: uuid
    - name: document
      type: jsonb
  public.transportation_v2:
    fields:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - name: number
      type: text
