version: 1
libraries:
- common
postgresql:
  enabled: true
  cluster: transportations
auth:
  audience: broker-logistics
  roles-client: broker-logistics
  protected-prefix: /api/
  permissions:
    /api/internal/v1/shipments/route-projection: transportations.create
    /api/internal/v1/transportations/ensure-created: transportations.create
    /api/v1/transportations/get: transportations.read
    /api/v1/transportations/list: transportations.read
    /api/v1/transportation-routes/set: transportations.write
    /api/v1/transportation-actuals/record: transportations.write
    /api/v1/transportation-actuals/correct: transportations.write
    /api/v1/transportations/history: transportations.read
    /api/v1/transportations/create: transportations.write
    /api/v1/transportations/update: transportations.write
    /api/v1/transportation-routes/usage: shipments.write
    /api/v1/transportations/container-fact: shipments.read
    /api/v1/transportations/filter-values: transportations.read
    /api/v1/transportations/route-filter-values: transportations.read
  organization-access: true
  service-clients:
    transportations.create: shipments-dispatcher
clients:
  shipments:
    service: shipments
    transport: http
  counterparties:
    service: counterparties
    transport: http
  transport_locations:
    service: transport_locations
    transport: http
