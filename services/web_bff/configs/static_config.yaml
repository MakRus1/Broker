        # OPENAPI_HANDLERS_END
        # SERVICE_CONFIG_BEGIN
        client-contracts:
            base-url: $client-contracts-base-url
        client-counterparties:
            base-url: $client-counterparties-base-url
        client-finance:
            base-url: $client-finance-base-url
        client-organizations:
            base-url: $client-organizations-base-url
        client-shipments:
            base-url: $client-shipments-base-url
        client-transport_locations:
            base-url: $client-transport_locations-base-url
        client-transportations:
            base-url: $client-transportations-base-url
        platform-readiness: {}
        platform-http-readiness: {}
        platform-config-delivery:
            load-enabled: $config-updates-enabled
        platform-config-readiness:
            rules: []
        dynamic-config:
            defaults:
                HTTP_CLIENT_CONNECTION_POOL_SIZE: 1000
                POSTGRES_DEFAULT_COMMAND_CONTROL:
                    network_timeout_ms: 750
                    statement_timeout_ms: 500
            updates-enabled: $config-updates-enabled
            fs-cache-path: $config-cache-path
            fs-task-processor: fs-task-processor
        dynamic-config-client:
            load-enabled: $config-updates-enabled
            config-url: $config-server-url
            http-client: dynamic-config-http-client
            service-name: web_bff
            get-configs-overrides-for-service: false
            http-timeout: 1s
            http-retries: 1
        dynamic-config-client-updater:
            load-enabled: $config-updates-enabled
            config-settings: false
            first-update-fail-ok: true
            updates-sink: platform-config-delivery
            update-types: only-full
            deduplicate-update-types: none
            update-interval: 1s
        # SERVICE_CONFIG_END
        platform-auth:
            issuer: $auth-issuer
            audience: broker-logistics
            roles-client: broker-logistics
            jwks-url: $auth-jwks-url
            protected-prefix: /api/
            permissions: {}
            allow-http: $auth-allow-http
        auth-http-client:
            wait-for-dynamic-configs: false
        browser-sessions:
            origin: $web-origin
            issuer: $auth-issuer
            token-url: $web-token-url
            revoke-url: $web-revoke-url
            secure-cookie: $web-secure-cookie
            client-id: broker-web
            session-cookie: broker_web
            login-cookie: broker_web_login
        browser-assets:
            dir: $web-assets-dir
            update-period: 10s
        browser-session: {}
        browser-login:
            path: /auth/login
            method: GET
            task_processor: main-task-processor
        browser-login-callback:
            path: /auth/callback
            method: GET
            task_processor: main-task-processor
        browser-assets-handler:
            path: /assets/*
            method: GET
            task_processor: main-task-processor
        browser-index:
            path: /
            method: GET
            task_processor: main-task-processor
        browser-index-html:
            path: /index.html
            method: GET
            task_processor: main-task-processor
        platform-http-telemetry:
            service-name: web_bff
            environment: $environment
        platform-http-pipeline:
            final-middlewares:
            - browser-session
        server:
            middleware-pipeline-builder: platform-http-pipeline
            listener:
                port: $server-port
                task_processor: main-task-processor
                handler-defaults:
                    request_body_size_log_limit: 0
                    request_headers_size_log_limit: 0
                    response_data_size_log_limit: 0
            listener-monitor:
                address: 127.0.0.1
                port: $monitor-port
                task_processor: main-task-processor
                handler-defaults:
                    request_body_size_log_limit: 0
                    request_headers_size_log_limit: 0
                    response_data_size_log_limit: 0
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    format: json
                    overflow_behavior: discard
        tracing-manager-locator:
            incoming-format:
            - opentelemetry
            new-requests-format:
            - opentelemetry
            otel-trace-sampling-enabled: true
        grpc-client-common:
            blocking-task-processor: fs-task-processor
        grpc-otlp-factory:
            load-enabled: $otlp-enabled
            middlewares:
                grpc-client-logging:
                    enabled: false
        otlp-logger:
            load-enabled: $otlp-enabled
            endpoint: $otlp-endpoint
            endpoint#env: OTEL_EXPORTER_OTLP_ENDPOINT
            client-factory-name: grpc-otlp-factory
            service-name: web_bff
            log-level: $logger-level
            sinks:
                logs: both
                tracing: both
            extra-attributes:
                service.version: 0.1.0
                deployment.environment.name: $environment
        grpc-client-logging:
            msg-log-level: none
        handler-server-monitor:
            path: /metrics
            method: GET
            task_processor: main-task-processor
            format: prometheus
            common-labels:
                service: web_bff
                environment: $environment
        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            monitor-handler: true
        handler-ping-ready:
            path: /ping/ready
            method: GET
            task_processor: main-task-processor
            monitor-handler: true
        testsuite-support: {}
        congestion-control:
            fake-mode: true
        http-client: null
        http-client-core:
            fs-task-processor: fs-task-processor
        dns-client:
            fs-task-processor: fs-task-processor
        tests-control:
            load-enabled: $is-testing
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor
        geography-cities:
            endpoint: https://suggestions.dadata.ru/suggestions/api/4_1/rs/suggest/address
            api-key#env: DADATA_API_KEY
            api-key#fallback: ''
            timeout-ms: 3000
            allow-http: false
        cities-http-client: {}
