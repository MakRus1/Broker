      summary: Поиск контрагентов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/counterparties/models.yaml#/ListCounterpartiesRequest
      responses:
        '200':
          description: Результат операции
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
