openapi: 3.0.3
info:
  title: Справочник контрагентов
  version: '1'
paths:
  /api/v1/counterparties/create:
    post:
      summary: Создать контрагента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/counterparties/models.yaml#/CreateCounterpartyRequest
      responses:
        '201':
          description: Результат операции
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  counterparty:
                    $ref: ../components/schemas/counterparties/models.yaml#/Counterparty
                required:
                - counterparty
        '400':
          description: Некорректные реквизиты или параметры
          content:
            application/json:
              schema:
                $ref: ../components/schemas/counterparties/models.yaml#/CounterpartyError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: ../components/schemas/counterparties/models.yaml#/CounterpartyError
        '403':
          description: Нет права или доступа к организации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/counterparties/models.yaml#/CounterpartyError
        '404':
          description: Контрагент не найден
          content:
            application/json:
              schema:
                $ref: ../components/schemas/counterparties/models.yaml#/CounterpartyError
        '409':
          description: Конфликт редакции, реквизитов или состояния
          content:
            application/json:
              schema:
                $ref: ../components/schemas/counterparties/models.yaml#/CounterpartyError
        '503':
          description: Недоступна проверка доступа
          content:
            application/json:
              schema:
                $ref: ../components/schemas/counterparties/models.yaml#/CounterpartyError
  /api/v1/counterparties/list:
    post:
      summary: Поиск контрагентов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/counterparties/models.yaml#/ListCounterpartiesRequest
      responses:
        '200':
          description: Результат операции
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../components/schemas/counterparties/models.yaml#/Counterparty
                required:
                - items
        '400':
          description: Некорректные реквизиты или параметры
