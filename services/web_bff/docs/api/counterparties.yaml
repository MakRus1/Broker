    post:
      summary: История изменений контрагента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/counterparties/models.yaml#/ListCounterpartyHistoryRequest
      responses:
        '200':
          description: События от новых к старым со снимками сохранённых полей
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../components/schemas/counterparties/models.yaml#/CounterpartyEvent
                required:
