openapi: 3.0.3
info:
  title: Перевозки
  version: '1'
paths:
  /api/v1/transportations/history:
    post:
      summary: История изменений перевозки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/transportations.yaml#/TListHistoryRequest
      responses:
        '200':
          description: История изменений маршрута и фактических дат
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../components/schemas/transportations.yaml#/TTransportationEvent
                required:
                - items
        '400':
          description: Некорректный идентификатор перевозки, курсор или лимит
          content:
            application/json:
              schema:
                $ref: ../components/schemas/transportations.yaml#/TApiError
        '401':
          description: Отсутствует действительный Bearer-токен
          content:
            application/json:
              schema:
                $ref: ../components/schemas/transportations.yaml#/TApiError
        '403':
          description: Нет права transportations.read или привязки к организации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/transportations.yaml#/TApiError
        '404':
          description: Перевозка не найдена в доступной организации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/transportations.yaml#/TApiError
        '503':
          description: Недоступны ключи проверки авторизации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/transportations.yaml#/TApiError
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: broker_web
security:
- BrowserSession: []
