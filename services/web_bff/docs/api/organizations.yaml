openapi: 3.0.3
info:
  title: Сотрудники организации
  version: '1'
paths:
  /api/organizations/employees/list:
    post:
      summary: Поиск действующих сотрудников организации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query:
                  type: string
                  maxLength: 200
                subject:
                  type: string
                  maxLength: 200
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
              required: []
      responses:
        '200':
          description: Результат поиска
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../components/schemas/organizations.yaml#/OrganizationEmployee
                required:
                - items
        '400':
          description: Некорректные параметры поиска
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/OrganizationError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/OrganizationError
        '403':
          description: Нет доступа к организации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/OrganizationError
        '503':
          description: Поиск временно недоступен
          content:
            application/json:
              schema:
                $ref: ../components/schemas/organizations.yaml#/OrganizationError
      security:
      - BrowserSession: []
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: broker_web
