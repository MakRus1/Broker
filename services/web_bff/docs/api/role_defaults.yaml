openapi: 3.0.3
info:
  title: Исходные виды реестров по ролям
  version: '1'
paths:
  /api/preferences/roles/list:
    post:
      summary: Виды реестров и роли организации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organization_id:
                  type: string
                  format: uuid
              required:
              - organization_id
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../components/schemas/registry_defaults.yaml#/RegistryDefault
                  roles:
                    type: array
                    items:
                      $ref: ../components/schemas/registry_defaults.yaml#/RegistryRole
                required:
                - items
                - roles
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: ../components/schemas/preferences/models.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: ../components/schemas/preferences/models.yaml#/ApiError
        '403':
          description: Нет доступа к организации или управлению ролями
          content:
            application/json:
              schema:
                $ref: ../components/schemas/preferences/models.yaml#/ApiError
        '409':
          description: Вид роли изменён другим пользователем
          content:
            application/json:
              schema:
                $ref: ../components/schemas/preferences/models.yaml#/ApiError
      security:
      - BrowserSession: []
  /api/preferences/roles/save:
    post:
      summary: Сохранить исходный вид реестра роли
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organization_id:
                  type: string
                  format: uuid
                role:
                  type: string
                  minLength: 1
                  maxLength: 100
                registry:
                  type: string
                  pattern: ^(shipments|transportations|counterparties|contracts|service-charges|financial_labels|outgoing-invoices|incoming-invoices|receipt-payments|disbursement-payments)$
                value:
                  type: object
                  additionalProperties: true
                expected_revision:
                  type: integer
                  minimum: 0
              required:
              - organization_id
              - role
              - registry
              - value
              - expected_revision
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  item:
                    $ref: ../components/schemas/registry_defaults.yaml#/RegistryDefault
                required:
                - item
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: ../components/schemas/preferences/models.yaml#/ApiError
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: ../components/schemas/preferences/models.yaml#/ApiError
        '403':
          description: Нет доступа к организации или управлению ролями
          content:
            application/json:
              schema:
                $ref: ../components/schemas/preferences/models.yaml#/ApiError
        '409':
          description: Вид роли изменён другим пользователем
          content:
            application/json:
              schema:
                $ref: ../components/schemas/preferences/models.yaml#/ApiError
      security:
      - BrowserSession: []
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: broker_web_session
