openapi: 3.0.3
info:
  title: Маршруты перевозок
  version: '1'
paths:
  /api/v1/transportation-routes/set:
    post:
      summary: Задать маршрут перевозки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/transportations.yaml#/TSetRouteRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - transportation
                properties:
                  transportation:
                    $ref: ../components/schemas/transportations.yaml#/TTransportation
        '400':
          description: Некорректное тело запроса, значения полей или последовательность
            дат
          content:
            application/json:
              schema:
                $ref: ../components/schemas/transportations.yaml#/TApiError
        '401':
          description: Отсутствует действительный Bearer-токен
          content:
            application/json:
              schema:
                $ref: ../components/schemas/transportations.yaml#/TApiError
        '403':
          description: Нет требуемого права или доверенной привязки к клиенту
          content:
            application/json:
              schema:
                $ref: ../components/schemas/transportations.yaml#/TApiError
        '404':
          description: Объект не найден в доступном клиенте
          content:
            application/json:
              schema:
                $ref: ../components/schemas/transportations.yaml#/TApiError
        '409':
          description: 'Объект изменен: expected_revision не совпадает с текущей редакцией;
            маршрут с записанными фактами пока не заменяется'
          content:
            application/json:
              schema:
                $ref: ../components/schemas/transportations.yaml#/TApiError
        '503':
          description: Недоступны ключи проверки авторизации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/transportations.yaml#/TApiError
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: broker_web
security:
- BrowserSession: []
