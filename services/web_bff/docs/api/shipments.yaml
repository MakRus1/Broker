  /api/v1/shipments/cargo-suggestions:
    post:
      summary: Подсказки описания груза
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shipments/models.yaml#/CargoSuggestionsRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      type: string
                      maxLength: 2000
                required:
                - items
        '400':
          description: Некорректное тело запроса, значения полей или последовательность дат
          content:
