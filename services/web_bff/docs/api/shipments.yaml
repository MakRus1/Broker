      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shipments/models.yaml#/DeleteCargoSuggestionRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  deleted:
                    type: boolean
                required:
