openapi: 3.0.3
info:
  title: Поставки
  version: '1'
paths:
  /api/v1/shipments/create:
    post:
      summary: Создать поставку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shipments/models.yaml#/CreateShipmentRequest
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - shipment
                properties:
                  shipment:
                    $ref: ../components/schemas/shipments/models.yaml#/Shipment
        '400':
          description: Некорректное тело запроса, значения полей или последовательность дат
          content:
            application/json:
              schema:
                $ref: ../components/schemas/shipments/models.yaml#/ApiError
        '401':
          description: Отсутствует действительный Bearer-токен
          content:
            application/json:
              schema:
                $ref: ../components/schemas/shipments/models.yaml#/ApiError
        '403':
          description: Нет требуемого права или доверенной привязки к клиенту
          content:
            application/json:
              schema:
                $ref: ../components/schemas/shipments/models.yaml#/ApiError
        '404':
          description: Объект не найден в доступном клиенте
          content:
            application/json:
              schema:
                $ref: ../components/schemas/shipments/models.yaml#/ApiError
        '409':
          description: Ключ идемпотентности уже использован с другим запросом или изменена редакция родительской поставки
          content:
            application/json:
              schema:
                $ref: ../components/schemas/shipments/models.yaml#/ApiError
        '503':
          description: Недоступны ключи проверки авторизации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/shipments/models.yaml#/ApiError
  /api/v1/shipments/get:
    post:
      summary: Получить поставку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shipments/models.yaml#/GetShipmentRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - shipment
                properties:
                  shipment:
                    $ref: ../components/schemas/shipments/models.yaml#/Shipment
        '400':
          description: Некорректное тело запроса, значения полей или последовательность дат
          content:
            application/json:
