        '403':
          description: Нет требуемого права или доверенной привязки к клиенту
          content:
            application/json:
              schema:
                $ref: ../components/schemas/shipments/models.yaml#/ApiError
        '404':
          description: Объект не найден в доступном клиенте
          content:
            application/json:
              schema:
                $ref: ../components/schemas/shipments/models.yaml#/ApiError
        '409':
          description: 'Объект изменен: expected_revision не совпадает с текущей редакцией'
          content:
            application/json:
              schema:
                $ref: ../components/schemas/shipments/models.yaml#/ApiError
        '503':
          description: Недоступны ключи проверки авторизации
          content:
            application/json:
              schema:
                $ref: ../components/schemas/shipments/models.yaml#/ApiError
  /api/v1/shipments/list:
    post:
      summary: Список поставок
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shipments/models.yaml#/ListShipmentsRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../components/schemas/shipments/models.yaml#/Shipment
                  next_cursor:
                    $ref: ../components/schemas/shipments/models.yaml#/ShipmentRegistryCursor
                required:
                - items
        '400':
          description: Некорректное тело запроса, значения полей или последовательность дат
          content:
            application/json:
              schema:
