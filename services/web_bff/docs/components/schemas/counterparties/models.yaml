SetArchivedCounterpartyRequest:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      maxLength: 256
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
    archived:
      type: boolean
  required:
  - id
  - expected_revision
  - archived
ListCounterpartiesRequest:
  type: object
  additionalProperties: false
  properties:
    after:
      type: string
      maxLength: 256
      format: uuid
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 100
    query:
      type: string
      maxLength: 256
      default: ''
    role:
      $ref: '#/CounterpartyRole'
    status:
      type: string
      enum:
      - active
      - archived
      - all
      default: active
  required: []
CounterpartySnapshot:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 256
      minLength: 1
    legal_name:
      type: string
      maxLength: 512
      nullable: true
    country_code:
      type: string
      maxLength: 2
      pattern: ^(|[A-Za-z]{2})$
      nullable: true
    tax_id:
      type: string
      maxLength: 64
      pattern: ^[A-Za-z0-9 -]*$
      nullable: true
    registration_id:
      type: string
      maxLength: 64
      nullable: true
    legal_address:
      type: string
      maxLength: 1024
      nullable: true
    roles:
      type: array
      items:
        $ref: '#/CounterpartyRole'
      uniqueItems: true
      maxItems: 5
    contacts:
      type: array
      items:
        $ref: '#/CounterpartyContact'
      maxItems: 32
    archived:
      type: boolean
    kpp:
      type: string
      nullable: true
      pattern: ^[0-9]{9}$
      maxLength: 9
    logist:
      type: string
      nullable: true
      minLength: 1
      maxLength: 256
  required:
  - name
ListCounterpartyHistoryRequest:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    before:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
  required:
  - id
CounterpartyEvent:
  type: object
  additionalProperties: false
  properties:
    id:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    action:
      type: string
    actor:
      type: string
    actor_name:
      type: string
    occurred_at:
      type: string
      format: date-time
    revision:
      type: integer
      minimum: 1
    before:
      $ref: '#/CounterpartySnapshot'
    after:
      $ref: '#/CounterpartySnapshot'
  required:
  - id
  - action
  - actor
  - occurred_at
  - after
RegistryParty:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
    legal_name:
      type: string
      nullable: true
    tax_id:
      type: string
    kpp:
      type: string
      nullable: true
    registration_id:
      type: string
      nullable: true
    legal_address:
      type: string
      nullable: true
    status:
      type: string
      nullable: true
  required:
  - name
  - legal_name
  - tax_id
  - kpp
  - registration_id
  - legal_address
  - status
LookupCounterpartyRequest:
  type: object
  additionalProperties: false
  properties:
    tax_id:
      type: string
      pattern: ^([0-9]{10}|[0-9]{12})$
  required:
  - tax_id
