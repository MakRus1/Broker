CounterpartyRole:
  type: string
  enum:
  - customer
  - carrier
  - agent
  - supplier
  - partner
CounterpartyContact:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 256
      minLength: 1
    position:
      type: string
      maxLength: 256
      nullable: true
    email:
      type: string
      maxLength: 256
      nullable: true
    phone:
      type: string
      maxLength: 64
      nullable: true
  required:
  - name
Counterparty:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      maxLength: 256
      format: uuid
    name:
      type: string
      maxLength: 256
      minLength: 1
    legal_name:
      type: string
      maxLength: 512
      nullable: true
    country_code:
      type: string
      maxLength: 2
      pattern: ^(|[A-Za-z]{2})$
      nullable: true
    tax_id:
      type: string
      maxLength: 64
      pattern: ^[A-Za-z0-9 -]*$
      nullable: true
    registration_id:
      type: string
      maxLength: 64
      nullable: true
    legal_address:
      type: string
      maxLength: 1024
      nullable: true
    roles:
      type: array
      items:
        $ref: '#/CounterpartyRole'
      uniqueItems: true
      maxItems: 5
      default: []
    contacts:
      type: array
      items:
        $ref: '#/CounterpartyContact'
      maxItems: 32
    revision:
      type: integer
      minimum: 1
    archived:
      type: boolean
    kpp:
      type: string
      nullable: true
      pattern: ^[0-9]{9}$
      maxLength: 9
    logist:
      type: string
      nullable: true
      minLength: 1
      maxLength: 256
  required:
  - id
  - name
  - legal_name
  - country_code
  - tax_id
  - registration_id
  - legal_address
  - roles
  - contacts
  - revision
  - archived
CounterpartyError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
