ApiError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
Notification:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    entity_id:
      type: string
      format: uuid
    entity_number:
      type: string
      minLength: 1
      maxLength: 200
    entity_revision:
      type: integer
    created_at:
      type: string
      format: date-time
    read:
      type: boolean
    event_type:
      type: string
      enum:
      - shipment.route_changed
      - shipment.created
      - sales.inquiry.shipment_creation_failed
  required:
  - id
  - entity_id
  - entity_number
  - entity_revision
  - created_at
  - read
  - event_type
