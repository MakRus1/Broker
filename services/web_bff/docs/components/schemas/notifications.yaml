ApiError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
Notification:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    shipment_id:
      type: string
      format: uuid
    shipment_number:
      type: string
      minLength: 1
      maxLength: 200
    shipment_revision:
      type: integer
    created_at:
      type: string
      format: date-time
    read:
      type: boolean
  required:
  - id
  - shipment_id
  - shipment_number
  - shipment_revision
  - created_at
  - read
