OrganizationEmployee:
  type: object
  additionalProperties: false
  properties:
    subject:
      type: string
    display_name:
      type: string
  required:
  - subject
  - display_name
OrganizationError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
