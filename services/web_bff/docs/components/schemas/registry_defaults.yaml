RegistryDefault:
  type: object
  additionalProperties: false
  properties:
    role:
      type: string
    registry:
      type: string
      pattern: ^(shipments|transportations|counterparties|contracts|service-charges|financial_labels|outgoing-invoices|incoming-invoices|receipt-payments|disbursement-payments)$
    value:
      type: object
      additionalProperties: true
    revision:
      type: integer
      minimum: 1
  required:
  - role
  - registry
  - value
  - revision
RegistryRole:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
    name:
      type: string
  required:
  - id
  - name

RegistryDefaultsResult:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: '#/RegistryDefault'
    roles:
      type: array
      items:
        $ref: '#/RegistryRole'
  required:
  - items
  - roles

SaveRegistryDefaultRequest:
  type: object
  additionalProperties: false
  properties:
    organization_id:
      type: string
      format: uuid
    role:
      type: string
      minLength: 1
      maxLength: 100
    registry:
      type: string
      pattern: ^(shipments|transportations|counterparties|contracts|service-charges|financial_labels|outgoing-invoices|incoming-invoices|receipt-payments|disbursement-payments)$
    value:
      type: object
      additionalProperties: true
    expected_revision:
      type: integer
      minimum: 0
  required:
  - organization_id
  - role
  - registry
  - value
  - expected_revision
