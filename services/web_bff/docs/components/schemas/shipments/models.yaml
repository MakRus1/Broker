ApiError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
CreationOperation:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    quantity:
      type: integer
      minimum: 1
      maximum: 100
    status:
      $ref: '#/OperationStatus'
    transportation_ids:
      type: array
      items:
        type: string
        format: uuid
    rejection_code:
      type: string
      maxLength: 128
  required:
  - id
  - item_id
  - quantity
  - status
  - transportation_ids
Shipment:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    number:
      type: string
      minLength: 1
      maxLength: 128
    customer_id:
      type: string
      format: uuid
    reference:
      type: string
      maxLength: 256
  required:
  - id
  - revision
  - number
  - customer_id
ShipmentItem:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    shipment_id:
      type: string
      format: uuid
    container_type_code:
      type: string
      minLength: 1
      maxLength: 16
    container_ownership:
      $ref: '#/ContainerOwnership'
    planned_quantity:
      type: integer
      minimum: 1
      maximum: 10000
    created_quantity:
      type: integer
      minimum: 0
      maximum: 10000
    pending_quantity:
      type: integer
      minimum: 0
      maximum: 10000
    available_quantity:
      type: integer
      minimum: 0
      maximum: 10000
  required:
  - id
  - revision
  - shipment_id
  - container_type_code
  - container_ownership
  - planned_quantity
  - created_quantity
  - pending_quantity
  - available_quantity
ContainerOwnership:
  type: string
  enum:
  - SOC
  - COC
OperationStatus:
  type: string
  enum:
  - pending
  - succeeded
  - rejected
CreateShipmentRequest:
  type: object
  additionalProperties: false
  properties:
    customer_id:
      type: string
      format: uuid
    reference:
      type: string
      maxLength: 256
    idempotency_key:
      type: string
      minLength: 1
      maxLength: 128
  required:
  - customer_id
  - idempotency_key
GetShipmentRequest:
  type: object
  additionalProperties: false
  properties:
    shipment_id:
      type: string
      format: uuid
  required:
  - shipment_id
ListShipmentsRequest:
  type: object
  additionalProperties: false
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
    after:
      type: string
      format: uuid
  required: []
UpdateShipmentRequest:
  type: object
  additionalProperties: false
  properties:
    shipment_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    reference:
      type: string
      maxLength: 256
  required:
  - shipment_id
  - expected_revision
  - reference
AddItemRequest:
  type: object
  additionalProperties: false
  properties:
    shipment_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    container_type_code:
      type: string
      pattern: ^[A-Z0-9]{2,16}$
    container_ownership:
      $ref: '#/ContainerOwnership'
    planned_quantity:
      type: integer
      minimum: 1
      maximum: 10000
    idempotency_key:
      type: string
      minLength: 1
      maxLength: 128
  required:
  - shipment_id
  - expected_revision
  - container_type_code
  - container_ownership
  - planned_quantity
  - idempotency_key
ListItemsRequest:
  type: object
  additionalProperties: false
  properties:
    shipment_id:
      type: string
      format: uuid
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
    after:
      type: string
      format: uuid
  required:
  - shipment_id
UpdateItemRequest:
  type: object
  additionalProperties: false
  properties:
    item_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    planned_quantity:
      type: integer
      minimum: 1
      maximum: 10000
  required:
  - item_id
  - expected_revision
  - planned_quantity
CreateOperationRequest:
  type: object
  additionalProperties: false
  properties:
    item_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    quantity:
      type: integer
      minimum: 1
      maximum: 100
    idempotency_key:
      type: string
      minLength: 1
      maxLength: 128
  required:
  - item_id
  - expected_revision
  - quantity
  - idempotency_key
GetOperationRequest:
  type: object
  additionalProperties: false
  properties:
    operation_id:
      type: string
      format: uuid
  required:
  - operation_id
