      type: string
      format: uuid
      x-cpp-type: uuid
  required:
  - customer_id
DeleteCargoSuggestionRequest:
  type: object
  additionalProperties: false
  properties:
    value:
      type: string
      maxLength: 2000
      minLength: 1
    customer_id:
      type: string
      format: uuid
      x-cpp-type: uuid
  required:
  - value
  - customer_id
GetShipmentSettingsRequest:
  type: object
  additionalProperties: false
  properties:
    customer_id:
      type: string
      format: uuid
      x-cpp-type: uuid
  required: []
DictionaryValue:
  type: object
  additionalProperties: false
  properties:
    code:
      type: string
    name:
      type: string
  required:
  - code
  - name
ShipmentDictionaries:
  type: object
  additionalProperties: false
  properties:
    incoterms:
      type: array
      items:
        $ref: '#/DictionaryValue'
    carriage_terms:
      type: array
      items:
        $ref: '#/DictionaryValue'
    loading:
      type: array
      items:
        $ref: '#/DictionaryValue'
    route_types:
      type: array
      items:
        $ref: '#/DictionaryValue'
  required:
  - incoterms
  - carriage_terms
  - loading
  - route_types
ShipmentRouteSegment:
  type: object
  additionalProperties: false
  properties:
    plan:
      $ref: '#/RoutePlan'
    id:
      type: string
      format: uuid
      x-cpp-type: uuid
    type:
      type: string
      minLength: 1
      maxLength: 64
    sea:
      $ref: '#/SeaDetails'
    air:
      $ref: '#/AirDetails'
  required:
  - id
  - type
TransportLocationKind:
  type: string
  enum:
  - sea_port
  - airport
TransportLocation:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      x-cpp-type: uuid
    kind:
      $ref: '#/TransportLocationKind'
    name:
      type: string
      minLength: 1
      maxLength: 256
    country_code:
      type: string
      pattern: ^[A-Z]{2}$
    code:
      type: string
      minLength: 1
      maxLength: 16
  required:
  - id
  - kind
  - name
  - country_code
SeaDetails:
  type: object
  additionalProperties: false
  properties:
    booking:
      $ref: '#/RouteBooking'
    documents:
      type: array
      maxItems: 20
      items:
        $ref: '#/BillOfLading'
    original_received:
      $ref: '#/RouteDocumentEvent'
    telex_release:
      $ref: '#/RouteDocumentEvent'
    pol:
      $ref: '#/TransportLocation'
    pod:
      $ref: '#/TransportLocation'
    eta:
      type: string
      format: date
    departure_terminal_id:
      type: string
      format: uuid
      x-cpp-type: uuid
    arrival_terminal_id:
      type: string
      format: uuid
      x-cpp-type: uuid
    departure_date:
      type: string
      format: date
    vessel:
      type: string
      maxLength: 128
    voyage:
      type: string
      maxLength: 128
  required: []
AirDetails:
  type: object
  additionalProperties: false
  properties:
    documents:
      type: array
      maxItems: 20
      items:
        $ref: '#/AirWaybill'
    carrier_id:
      type: string
      format: uuid
      x-cpp-type: uuid
    origin_airport:
      $ref: '#/TransportLocation'
    destination_airport:
      $ref: '#/TransportLocation'
    eta:
      type: string
      format: date
    etd:
      type: string
      format: date
    departure_date:
      type: string
      format: date
    arrival_date:
      type: string
      format: date
    flight_number:
      type: string
      maxLength: 64
  required: []
ShipmentRegistryCursor:
  type: object
  additionalProperties: false
  required:
  - id
  - scope
  properties:
    id:
      type: string
      format: uuid
      x-cpp-type: uuid
    scope:
      type: string
      pattern: ^[a-f0-9]{64}$
    text_value:
      type: string
      maxLength: 2048
    date_value:
      type: string
      format: date
ContainerFact:
  type: object
  additionalProperties: false
  required:
  - quantity
  properties:
    container_type_code:
      type: string
    container_ownership:
      $ref: '#/ContainerOwnership'
    quantity:
      type: integer
      minimum: 0
ContainerPlanItem:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      x-cpp-type: uuid
    revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    shipment_id:
      type: string
      format: uuid
      x-cpp-type: uuid
    container_type_code:
      type: string
      minLength: 1
      maxLength: 16
    container_ownership:
      $ref: '#/ContainerOwnership'
    planned_quantity:
      type: integer
      minimum: 0
      maximum: 2147483647
    created_quantity:
      type: integer
      minimum: 0
      maximum: 2147483647
    pending_quantity:
      type: integer
      minimum: 0
      maximum: 2147483647
    available_quantity:
      type: integer
      minimum: 0
      maximum: 2147483647
    excess_quantity:
      type: integer
      minimum: 0
  required:
  - id
  - revision
  - shipment_id
  - container_type_code
  - container_ownership
  - planned_quantity
  - created_quantity
  - pending_quantity
  - available_quantity
  - excess_quantity
RegistryFilter:
  type: object
  additionalProperties: false
  required:
  - field
  properties:
    field:
      type: string
      minLength: 1
      maxLength: 64
    values:
      type: array
      maxItems: 200
      uniqueItems: true
      items:
        type: string
        maxLength: 2000
    query:
      type: string
      maxLength: 256
    date_from:
      type: string
      format: date
    date_to:
      type: string
      format: date
    empty:
      type: boolean
RegistryField:
  type: object
  additionalProperties: false
  required:
  - id
  - kind
  - sortable
  - case_insensitive
  properties:
    id:
      type: string
    kind:
      type: string
      enum:
      - values
      - set
      - date
      - boolean
    sortable:
      type: boolean
    lookup:
      type: string
    case_insensitive:
      type: boolean
RegistryValue:
  type: object
  additionalProperties: false
  required:
  - value
  - label
  properties:
    value:
      type: string
    label:
      type: string

RoutePlan:
  type: object
  additionalProperties: false
  description: План участка из запроса и поставки. Фактические данные заполняются
    в перевозке.
  properties:
    origin_name:
      type: string
      maxLength: 256
    origin_country:
      type: string
      maxLength: 2
      pattern: ^[A-Z]{2}$
    origin_address:
      type: string
      maxLength: 1024
    destination_name:
      type: string
      maxLength: 256
    destination_country:
      type: string
      maxLength: 2
      pattern: ^[A-Z]{2}$
    destination_address:
      type: string
      maxLength: 1024
    departure_date:
      type: string
      format: date
    arrival_date:
      type: string
      format: date

RouteFilterGroup:
  type: object
  additionalProperties: false
  required: [filters]
  properties:
    filters:
      type: array
      minItems: 1
      maxItems: 32
      items:
        $ref: '#/RegistryFilter'
FilterValuesScope:
  type: string
  enum: [registry, route]
  default: registry

RouteBooking:
  type: object
  additionalProperties: false
  properties:
    number:
      type: string
      maxLength: 128
    status:
      type: string
      enum: [placed, confirmed]
    placed_date:
      type: string
      format: date
    confirmed_date:
      type: string
      format: date
BillOfLading:
  type: object
  additionalProperties: false
  required: [number]
  properties:
    number:
      type: string
      minLength: 1
      maxLength: 128
    date:
      type: string
      format: date
    leg:
      type: string
      enum: [ocean, feeder]
AirWaybill:
  type: object
  additionalProperties: false
  required: [number]
  properties:
    number:
      type: string
      minLength: 1
      maxLength: 128
    date:
      type: string
      format: date
RouteDocumentEvent:
  type: object
  additionalProperties: false
  properties:
    date:
      type: string
      format: date
