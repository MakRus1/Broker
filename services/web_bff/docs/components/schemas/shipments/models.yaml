  - SOC
  - COC
OperationStatus:
  type: string
  enum:
  - pending
  - succeeded
  - rejected
PlannedContainer:
  type: object
  additionalProperties: false
  properties:
    container_type_code:
      type: string
      pattern: ^[A-Z0-9]{2,16}$
    container_ownership:
