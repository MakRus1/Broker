ApiError:
  type: object
  additionalProperties: false
  properties:
    error:
      type: string
    message:
      type: string
  required:
  - error
  - message
CreationOperation:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      x-cpp-type: uuid
    item_id:
      type: string
      format: uuid
      x-cpp-type: uuid
    quantity:
      type: integer
      minimum: 1
      maximum: 100
    status:
      $ref: '#/OperationStatus'
    transportation_ids:
      type: array
      items:
        type: string
        format: uuid
        x-cpp-type: uuid
    rejection_code:
      type: string
      maxLength: 128
  required:
  - id
  - item_id
  - quantity
  - status
  - transportation_ids
ShipmentVoyageLink:
  type: object
  additionalProperties: false
  properties:
    discharge_port:
      type: string
    load_port:
      type: string
    segment_id:
      type: string
      format: uuid
      x-cpp-type: uuid
    voyage_id:
      type: string
      format: uuid
      x-cpp-type: uuid
    voyage_number:
      type: string
  required:
  - discharge_port
  - load_port
  - segment_id
  - voyage_id
  - voyage_number
Shipment:
  type: object
  additionalProperties: false
  properties:
    confirmed_voyages:
      description: Назначения подтверждённых броней в карточке поставки, доступные сотруднику линии.
      type: array
      items:
        $ref: '#/ShipmentVoyageLink'
    id:
      type: string
      format: uuid
      x-cpp-type: uuid
    revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    number:
      type: string
      minLength: 1
      maxLength: 128
    customer_id:
      type: string
      format: uuid
      x-cpp-type: uuid
    reference:
      type: string
      maxLength: 256
    shipment_date:
      type: string
      format: date
    recipient_id:
      type: string
      format: uuid
      x-cpp-type: uuid
      nullable: true
    logist:
      description: Идентификатор сотрудника организации (subject), не ФИО
      type: string
      maxLength: 200
      nullable: true
    cargo_description:
      type: string
      maxLength: 2000
      nullable: true
    status:
      type: string
      maxLength: 100
    incoterms:
      type: string
      maxLength: 16
      nullable: true
    carriage_terms:
      type: string
      maxLength: 32
      nullable: true
    loading:
      type: string
      maxLength: 32
      nullable: true
    delivery_city:
      type: string
      maxLength: 200
      nullable: true
    delivery_country:
      type: string
      pattern: ^[A-Z]{2}$
      nullable: true
    delivery_address:
      type: string
      maxLength: 1000
      nullable: true
    route_segments:
      type: array
      maxItems: 30
      items:
        $ref: '#/ShipmentRouteSegment'
  required:
  - id
  - revision
  - number
  - customer_id
  - shipment_date
  - status
  - route_segments
ShipmentItem:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      x-cpp-type: uuid
    revision:
      type: integer
      minimum: 1
      maximum: 2147483647
    shipment_id:
      type: string
      format: uuid
