version: 1
libraries:
- common
- auth
- browser
postgresql:
  enabled: true
  cluster: web-bff
clients:
  shipments:
    service: shipments
    transport: http
  transportations:
    service: transportations
    transport: http
  counterparties:
    service: counterparties
    transport: http
  organizations:
    service: organizations
    transport: http
  transport_locations:
    service: transport_locations
    transport: http
  contracts:
    service: contracts
    transport: http
  finance:
    service: finance
    transport: http
  user_preferences:
    service: user_preferences
    transport: http
  localization:
    service: localization
    transport: http
  notifications:
    service: notifications
    transport: http
  sales:
    service: sales
    transport: http
dashboard:
  title: Broker · Пользовательский BFF
  tags:
  - logistics
http_logging:
  redact_fields:
    "/api/organizations/employees/list": [display_name, query]
  exclude_paths:
  - /auth/**
  - /api/session
  - /api/logout
  - /api/preferences/**
