components_manager:
    task_processors:
        main-task-processor:
            worker_threads: 2
        fs-task-processor:
            worker_threads: 1
    default_task_processor: main-task-processor
    components:
        platform-http-telemetry:
            service-name: contract_service
            environment: testing
        platform-http-pipeline: {}
        server:
            middleware-pipeline-builder: platform-http-pipeline
            listener:
                port: 8084
            listener-monitor:
                address: 127.0.0.1
                port: 8085
                task_processor: main-task-processor
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: info
        dns-client:
            fs-task-processor: fs-task-processor
        http-client: {}
        http-client-core:
            fs-task-processor: fs-task-processor
        testsuite-support: {}
        tests-control:
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor
        client-probe:
            path: /client-probe
            method: GET
            task_processor: main-task-processor
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0
        handler-ping:
            path: /ping
            method: GET
            monitor-handler: true
            task_processor: main-task-processor
        handler-ping-ready:
            path: /ping/ready
            method: GET
            monitor-handler: true
            task_processor: main-task-processor
        # SERVICE_CONFIG_BEGIN
        client-broker:
            base-url: $client-broker-base-url
        platform-readiness: {}
        platform-http-readiness: {}
        platform-config-delivery:
            load-enabled: $config-updates-enabled
        platform-config-readiness:
            rules:
            -   name: BROKER_HTTP_CLIENT_CONFIG
                schema-hash: 0928419b1f0ce594caac412be58f6eefdffeaf2ff79f3911d01333df781eb2e4
                allow-builtin: false
                allow-cache: true
                max-age-seconds: 5
        dynamic-config:
            updates-enabled: $config-updates-enabled
            fs-cache-path: $config-cache-path
            fs-task-processor: fs-task-processor
        dynamic-config-client:
            load-enabled: $config-updates-enabled
            config-url: $config-server-url
            http-client: dynamic-config-http-client
            service-name: contract_service
            get-configs-overrides-for-service: false
            http-timeout: 1s
            http-retries: 1
        dynamic-config-client-updater:
            load-enabled: $config-updates-enabled
            config-settings: false
            first-update-fail-ok: true
            updates-sink: platform-config-delivery
            update-types: only-full
            deduplicate-update-types: none
            update-interval: 1s
        # SERVICE_CONFIG_END
        # OPENAPI_HANDLERS_BEGIN
        handler-items-by_id:
            path: /items/{id}
            method: GET
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-items-by_id-create:
            path: /items/{id}/create
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-models-echo:
            path: /models/echo
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-models-state:
            path: /models/state
            method: GET
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-validated:
            path: /validated
            method: GET
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        handler-validated-create:
            path: /validated/create
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 32768
            response_data_size_log_limit: 32768
        # OPENAPI_HANDLERS_END
