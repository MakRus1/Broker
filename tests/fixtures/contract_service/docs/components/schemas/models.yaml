State:
  type: string
  enum:
  - active
  - disabled
  default: active
Limit:
  type: integer
  format: int32
  minimum: 1
  maximum: 20
  default: 5
Address:
  type: object
  additionalProperties: false
  required:
  - city
  properties:
    city:
      type: string
      minLength: 1
    kind:
      type: string
      enum:
      - city
      - rural
      default: city
Profile:
  type: object
  additionalProperties: false
  required:
  - id
  - address
  properties:
    id:
      type: integer
      minimum: 1
    address:
      $ref: '#/Address'
    state:
      $ref: '#/State'
ProfileAlias:
  $ref: '#/Profile'
Payload:
  type: object
  additionalProperties: false
  required:
  - profile
  - profiles
  properties:
    profile:
      $ref: '#/ProfileAlias'
    profiles:
      type: array
      minItems: 1
      items:
        $ref: '#/Profile'
    limit:
      $ref: '#/Limit'
    note:
      type: string
      nullable: true
    payload_provided:
      type: boolean
      default: false
ApiError:
  type: object
  additionalProperties: false
  required:
  - error
  - message
  properties:
    error:
      type: string
    message:
      type: string
