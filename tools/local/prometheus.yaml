global:
  scrape_interval: 5s
scrape_configs:
- job_name: services
  metrics_path: /metrics
  honor_labels: true
  file_sd_configs:
  - files:
    - /etc/broker-local/prometheus-targets.json
    refresh_interval: 5s
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: readiness
  honor_labels: true
  static_configs:
  - targets:
    - readiness:9100
